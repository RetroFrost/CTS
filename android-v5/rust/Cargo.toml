[package]
name = "cts_engine"
version = "5.0.0"
edition = "2021"
description = "Cubical Compare V5 deterministic comparison timeline engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
