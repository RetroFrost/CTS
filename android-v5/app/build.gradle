plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.retrofrost.cubicalcompare.v5'
    compileSdk 36
    defaultConfig {
        applicationId 'com.retrofrost.cubicalcompare.v5'
        minSdk 26
        targetSdk 35
        def previewRun = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode 500000 + previewRun
        versionName "5.0.0-android-preview.${previewRun}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true; buildConfig true }
    kotlinOptions { jvmTarget = '17' }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*'] } }
}
dependencies {
    implementation 'androidx.media3:media3-transformer:1.11.1'
    implementation 'androidx.media3:media3-effect:1.11.1'
    implementation 'androidx.media3:media3-common:1.11.1'
    def bom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation bom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
