app-id: io.github.retrofrost.CubicalCompare
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: cubical-compare

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    no-autodownload: false
    autodelete: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --env=PATH=/app/lib/ffmpeg:/app/bin:/usr/bin
  - --env=CUBICAL_COMPARE_ENGINE=/app/libexec/cubical-compare/engine/cubical-compare-engine
  - --env=CUBICAL_COMPARE_FFMPEG=/app/lib/ffmpeg/ffmpeg

cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/python*/site-packages
  - /share/man
  - /share/pkgconfig
  - /bin/pyinstaller
  - /bin/pytest
  - '*.a'
  - '*.la'
  - __pycache__
  - '*.pyc'

modules:
  - python3-cubical-compare-engine.json

  - name: cubical-compare
    buildsystem: simple
    build-commands:
      - python3 -m pytest -q
      - python3 -m compileall -q engine
      - cd engine && python3 -m PyInstaller --noconfirm --clean --distpath=/tmp/cubical-compare-engine-dist --workpath=/tmp/cubical-compare-engine-build cubical-compare-engine.spec
      - install -d /app/libexec/cubical-compare/engine
      - cp -a /tmp/cubical-compare-engine-dist/cubical-compare-engine/. /app/libexec/cubical-compare/engine/
      - cmake -S . -B build-flatpak -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCUBICAL_COMPARE_ENGINE_PATH=/app/libexec/cubical-compare/engine/cubical-compare-engine
      - cmake --build build-flatpak --parallel 2
      - cmake --install build-flatpak
      - test -x /app/bin/cubical-compare
      - test -x /app/libexec/cubical-compare/engine/cubical-compare-engine
      - test -d /app/libexec/cubical-compare/engine/_internal
    sources:
      - type: dir
        path: ../..
