name: Build 2.0.8

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - android/**
      - tools/apply_phone_reference_build_fixes.py
      - tools/apply_renderer_import_ux.py
      - tools/apply_infinite_phone_renderer.py
      - tools/apply_puberty_badge_source_lock_v3.py
      - tools/apply_puberty_outro_source_lock_v1.py
      - tools/apply_runtime_integrity_fixes_v1.py
      - tools/apply_runtime_integrity_fixes_v2.py
      - tools/apply_runtime_integrity_fixes_v3.py
      - tools/apply_runtime_integrity_fixes_v4.py
      - tools/apply_runtime_integrity_fixes_v4_fixed.py
      - tools/apply_runtime_integrity_fixes_v5.py
      - tools/apply_runtime_integrity_fixes_v5_fixed.py
      - .github/workflows/build-207-native-fork.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android 2.0.8 source-exact + runtime smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Prove Android runtime is Python-free
        shell: bash
        run: |
          set -euo pipefail
          test ! -d android/app/src/main/python
          ! grep -R "chaquo\|PyApplication\|com\.chaquo" android --exclude-dir=build --exclude='*.lock'

      - name: Apply source-measured 2.0.8 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_phone_reference_build_fixes.py
          python3 tools/apply_renderer_import_ux.py
          python3 tools/apply_infinite_phone_renderer.py
          python3 tools/apply_puberty_badge_source_lock_v3.py
          python3 tools/apply_puberty_outro_source_lock_v1.py
          python3 tools/apply_runtime_integrity_fixes_v1.py
          python3 tools/apply_runtime_integrity_fixes_v2.py
          python3 tools/apply_runtime_integrity_fixes_v3.py
          python3 tools/apply_runtime_integrity_fixes_v4_fixed.py
          python3 tools/apply_runtime_integrity_fixes_v5_fixed.py

          require_grep() { local label="$1" needle="$2" file="$3"; echo "CHECK: $label"; grep -Fq "$needle" "$file" || { echo "FAILED: $label"; exit 1; }; }
          forbid_grep() { local label="$1" needle="$2" file="$3"; echo "CHECK: $label"; if grep -Fq "$needle" "$file"; then echo "FAILED: $label"; exit 1; fi; }

          RB=android/app/src/main/java/io/github/retrofrost/cts/android/RendererBundle.kt
          RF=android/app/src/main/java/io/github/retrofrost/cts/android/RibbonFrameRenderer.kt
          BR=android/app/src/main/java/io/github/retrofrost/cts/android/RendererBridge.kt
          ES=android/app/src/main/java/io/github/retrofrost/cts/android/ExportService.kt
          RI=android/app/src/main/java/io/github/retrofrost/cts/android/RendererImportActivity.kt
          RR=android/app/src/main/java/io/github/retrofrost/cts/android/RendererRepositoryActivity.kt
          DG=android/app/src/main/java/io/github/retrofrost/cts/android/DirectGpuVideoExporter.kt
          SP=android/app/src/main/java/io/github/retrofrost/cts/android/StudioProject.kt
          NI=android/app/src/main/java/io/github/retrofrost/cts/android/NativeImporters.kt
          NF=android/app/src/main/java/io/github/retrofrost/cts/android/NativeFrameRenderer.kt
          RF2=android/app/src/main/java/io/github/retrofrost/cts/android/RelationshipsFrameRenderer.kt
          DP=android/app/src/main/java/io/github/retrofrost/cts/android/DirectPreviewTransform.kt

          require_grep 'runtime app version' 'BuildConfig.VERSION_NAME.substringBefore' "$RB"
          require_grep 'opening affine renderer' 'openingBadgeAffine' "$RF"
          require_grep 'direct GPU exporter wired' 'DirectGpuVideoExporter' "$ES"
          require_grep 'renderer import UX' 'Ready for Cubical Compare' "$RI"
          require_grep 'Infinite exact engine' 'infinite-timeline-exact' "$RB"
          require_grep 'Puberty badge source lock' 'puberty-badge-source-lock-v3' "$RF"
          require_grep 'Puberty runtime capability' 'puberty-badge-source-lock-v3' "$RB"
          require_grep 'Puberty outro capability' 'puberty-outro-source-lock-v1' "$RB"
          require_grep 'runtime integrity marker' 'runtime-integrity-fixes-v1' "$RB"
          require_grep 'same-ID exact byte identity' 'activeBytes?.contentEquals(bytes)' "$RB"
          require_grep 'active renderer SHA' 'activeSha256' "$RB"
          require_grep 'repository exact SHA state' 'exactActive' "$RR"
          require_grep 'disable encoder B frames' 'KEY_MAX_B_FRAMES, 0' "$DG"
          require_grep 'shared render lock' 'withRenderLock' "$DG"
          require_grep 'project schema v6' 'put("version", 6)' "$SP"
          forbid_grep 'stale males model metadata' 'what-males-learn-at-each-age' "$SP"
          echo 'CHECK: no fixed 471px MegaPack image frame'
          if grep -A20 'if (background != null || subject != null)' "$NI" | grep -Fq '471'; then echo 'FAILED: fixed 471px MegaPack image frame remains'; exit 1; fi
          require_grep 'Ribbon renderer-owned artwork geometry' 'RendererArtworkLayout.imageBottom' "$RF"
          require_grep 'Native renderer-owned artwork geometry' 'RendererArtworkLayout.imageBottom' "$NF"
          require_grep 'Relationships renderer-owned artwork geometry' 'RendererArtworkLayout.imageBottom' "$RF2"
          require_grep 'Preview renderer-owned artwork geometry' 'RendererArtworkLayout.imageBottom' "$DP"
          require_grep 'native timeline-unit conversion' 'rendererTrackTime' "$NF"
          forbid_grep 'archived 57-card timeline special case' 'count == 57' "$NF"
          require_grep 'manifest-owned engine dispatch' 'internal fun engineKind' "$BR"
          require_grep 'direct export manifest engine dispatch' 'when (RendererBridge.engineKind(spec))' "$DG"
          require_grep 'renderer track window metadata' 'fun trackStart(target: String)' "$RB"
          require_grep 'renderer tag capability contract' 'requireDeclaredForTag' "$RB"
          require_grep 'opening renderer track ownership' 'explicitAffine' "$RF"
          require_grep 'later renderer track ownership' 'exactBadgeStart' "$RF"
          require_grep 'Ribbon engine field authority' 'spec.engine == "ribbon-exact"' "$RF"
          require_grep 'renderer lower-artwork capability' 'ribbon-artwork-region-v1' "$RB"
          require_grep 'renderer lower-artwork region' 'rendererArtworkRect' "$RF"
          require_grep 'renderer contain fit' 'fit.equals("contain"' "$RF"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Unit test and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace --console=plain

      - name: Enable KVM for Android runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: android/gradlew -p android :app:connectedDebugAndroidTest --stacktrace --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          cp "$APK" Cubical-Compare-2.0.8-Source-Exact.apk
          sha256sum Cubical-Compare-2.0.8-Source-Exact.apk > Cubical-Compare-2.0.8-Source-Exact.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-2.0.8-Source-Exact
          path: |
            Cubical-Compare-2.0.8-Source-Exact.apk
            Cubical-Compare-2.0.8-Source-Exact.apk.sha256
          if-no-files-found: error
          retention-days: 14
