name: CTS Android stable release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build stable-signed CTS 2.0.0
    runs-on: ubuntu-latest
    env:
      CTS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CTS_ANDROID_KEYSTORE_PASSWORD }}
      CTS_ANDROID_KEY_ALIAS: ${{ secrets.CTS_ANDROID_KEY_ALIAS }}
      CTS_ANDROID_KEY_PASSWORD: ${{ secrets.CTS_ANDROID_KEY_PASSWORD }}
      CTS_EXPECTED_CERT_SHA256: ${{ secrets.CTS_ANDROID_CERT_SHA256 }}
      CTS_REQUIRE_STABLE_SIGNING: "true"

    steps:
      - name: Check out Android source
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Require permanent signing secrets
        shell: bash
        env:
          CTS_ANDROID_KEYSTORE_B64: ${{ secrets.CTS_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          for name in CTS_ANDROID_KEYSTORE_B64 CTS_ANDROID_KEYSTORE_PASSWORD CTS_ANDROID_KEY_ALIAS CTS_ANDROID_KEY_PASSWORD CTS_EXPECTED_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required CTS stable-signing secret: $name" >&2
              exit 1
            fi
          done
          install -d -m 700 "$RUNNER_TEMP/cts-signing"
          printf '%s' "$CTS_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cts-signing/cts-release.keystore"
          chmod 600 "$RUNNER_TEMP/cts-signing/cts-release.keystore"
          echo "CTS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cts-signing/cts-release.keystore" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared contract
        run: python tools/sync_shared_contract.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run CTS Android tests
        run: gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build stable-signed release APK
        run: gradle --project-dir android :app:assembleRelease --stacktrace --console=plain

      - name: Verify CTS signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$CTS_EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "CTS signing certificate mismatch; refusing to publish this APK." >&2
            exit 1
          fi
          echo "Stable CTS signing certificate verified."

      - name: Stage CTS 2.0.0 APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk CTS-Android-2.0.0.apk
          sha256sum CTS-Android-2.0.0.apk > CTS-Android-2.0.0.apk.sha256

      - name: Upload stable CTS release
        uses: actions/upload-artifact@v4
        with:
          name: CTS-Android-2.0.0-stable
          path: |
            CTS-Android-2.0.0.apk
            CTS-Android-2.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Remove runner keystore
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/cts-signing"
