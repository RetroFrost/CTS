          work/runtime-renderer-version-4.2.1.18|ebc7577f678d8dbe6868bb004cf21aa359ca2c32
          BRANCHES
          # Protect any branch used by a currently open PR, as either source or base.
          open_pr_refs="$(gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | .head.ref, .base.ref')"
          deleted=0
          skipped=0
          failed=0
          echo '### Completed branch cleanup' >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r branch expected; do
            [[ -z "$branch" ]] && continue
            case "$branch" in
              main|windows/main|windows/main-preview|android|android-main-preview|v5/development|release/*|backup/*|checkpoint/*)
                echo "Preserved base or release branch: $branch"
                skipped=$((skipped+1))
                continue ;;
            esac
            if grep -Fxq "$branch" <<< "$open_pr_refs"; then
              echo "Preserved branch used by an open PR: $branch"
              skipped=$((skipped+1))
              continue
            fi
            actual="$(gh api "repos/$REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Skipped changed, missing or already removed branch: $branch"
              skipped=$((skipped+1))
              continue
            fi
            guarded="$(gh api "repos/$REPOSITORY/branches/$branch" --jq '.protected' 2>/dev/null || echo true)"
            if [[ "$guarded" != "false" ]]; then
              echo "Preserved protected or unverifiable branch: $branch"
              skipped=$((skipped+1))
              continue
            fi
            if gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted merged branch: $branch"
              deleted=$((deleted+1))
            else
              echo "::error::GitHub rejected branch deletion: $branch"
              failed=$((failed+1))
            fi
          done < "$targets"
          echo "- Deleted: $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Safely skipped: $skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: $failed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preserved active, release and unverified branches." >> "$GITHUB_STEP_SUMMARY"
          (( failed == 0 ))
