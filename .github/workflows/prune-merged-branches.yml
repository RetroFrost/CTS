name: Prune merged CTS branches (one-time)
on:
  push:
    branches:
      - windows/main-preview
    paths:
      - .github/workflows/prune-merged-branches.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Remove only reviewed and unchanged merged branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
