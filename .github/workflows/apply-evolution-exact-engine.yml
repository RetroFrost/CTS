name: Apply Evolution exact renderer engine

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - tools/apply_evolution_exact_engine.py
      - .github/workflows/apply-evolution-exact-engine.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact renderer patch
        run: python tools/apply_evolution_exact_engine.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and test
        run: gradle --project-dir android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-2.0.7-Evolution-Exact
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit exact renderer engine
        shell: bash
        run: |
          rm .github/workflows/apply-evolution-exact-engine.yml tools/apply_evolution_exact_engine.py
          git config user.name 'RetroFrost'
          git config user.email 'routerifter@gmail.com'
          git add android/app/src/main/java/io/github/retrofrost/cts/android/RibbonFrameRenderer.kt .github/workflows/apply-evolution-exact-engine.yml tools/apply_evolution_exact_engine.py
          git commit -m 'renderer: honor exact source-frame tracks'
          git push
