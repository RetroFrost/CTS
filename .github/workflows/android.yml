name: CTS Android validation

on:
  push:
    branches: [main, android, renderer-exact-males, "agent/**"]
    paths:
      - "android/**"
      - "shared/**"
      - "tools/sync_shared_contract.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "shared/**"
      - "tools/sync_shared_contract.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and test Android
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared contract
        run: python tools/sync_shared_contract.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile validation APK
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android/gradle-build.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee android/gradle-test.log

      - name: Upload validation APK and diagnostics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-2.0-exact-males-validation
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/gradle-build.log
            android/gradle-test.log
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-Android-exact-males-logs
          path: |
            android/gradle-build.log
            android/gradle-test.log
          if-no-files-found: warn

      # Validation APK only; release installers remain on the stable-signing release workflow.
