name: CTS Android

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Apply reconstruction background fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 0

      - name: Extract and run prepared patch
        shell: bash
        run: |
          python3 - <<'EXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/resume-android-reconstruction.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines())
          Path('/tmp/resume_android_reconstruction.py').write_text(body + "\n")
          EXTRACT
          python3 /tmp/resume_android_reconstruction.py

      - name: Restore normal Android CI and commit alpha7
        shell: bash
        run: |
          git show HEAD^:.github/workflows/android.yml > .github/workflows/android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Android: durable background video reconstruction [reconstruction-bg]"
          git push origin HEAD:android
