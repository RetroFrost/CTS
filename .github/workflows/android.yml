name: CTS Android

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: Apply reconstruction background fixes
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 0

      - name: Apply prepared Android patch
        run: python3 tools/apply_resume_android.py

      - name: Commit Android alpha7 code only
        shell: bash
        run: |
          git restore --source=HEAD -- .github/workflows/resume-android-reconstruction.yml tools/apply_resume_android.py .github/workflows/android.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Android: durable background video reconstruction [reconstruction-bg]"
          git push origin HEAD:android
