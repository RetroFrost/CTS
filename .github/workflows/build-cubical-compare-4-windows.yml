name: Build Cubical Compare 4 Windows

on:
  push:
    branches:
      - windows/main
      - work/portable-zip-windows
    paths:
      - 'windows/CubicalCompare/**'
      - 'windows/CubicalCompare.Modules/**'
      - 'windows/CubicalCompare.InstallerBootstrap/**'
      - 'windows/CubicalCompare.UpdateSmoke/**'
      - 'Directory.Build.targets'
      - '.github/workflows/build-cubical-compare-4-windows.yml'
  pull_request:
    branches:
      - windows/main
    paths:
      - 'windows/CubicalCompare/**'
      - 'windows/CubicalCompare.Modules/**'
      - 'windows/CubicalCompare.InstallerBootstrap/**'
      - 'windows/CubicalCompare.UpdateSmoke/**'
      - 'Directory.Build.targets'
      - '.github/workflows/build-cubical-compare-4-windows.yml'
  workflow_dispatch:

concurrency:
  group: cubical-compare-4-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "4.2.1.27"
          $assemblyVersion = $version

          # Velopack uses SemVer2 and does not support four-part app versions.
          # Keep the visible Cubical Compare version at 4.2.1.27 and advance the
          # package/feed version independently.
          $velopackVersion = "4.2.28"

          "CC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_ASSEMBLY_VERSION=$assemblyVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_VELOPACK_VERSION=$velopackVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_TAG=v$version-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Cubical Compare Windows version: $version (.NET 10)"
          Write-Host "Installer payload version: $velopackVersion (Velopack compatibility only)"

      - name: Restore
        run: dotnet restore windows/CubicalCompare/CubicalCompare.csproj -r win-x64 -p:Platform=x64

      - name: Verify direct preview editing contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $preview = Get-Content 'windows/CubicalCompare/MainWindow.ReliablePreviewTransform.cs' -Raw
          if ($preview -notmatch 'ReliablePreviewApplyAll_Click') { throw 'Preview apply-all image action is missing.' }
          if ($preview -notmatch 'OpenInlinePreviewTextEditor') { throw 'Inline preview text editor is missing.' }
          if ($preview -notmatch 'ReliableHitTestPreviewArtwork') { throw 'Direct artwork hit-testing is missing.' }
          if ($preview -notmatch 'QueuePreviewInteractionRender') { throw 'Live transform preview rendering is missing.' }
          if ($preview -notmatch 'while \(_previewInteractionRenderPending\)') { throw 'Latest-state preview render loop is missing.' }
          if ($preview -match '_previewInteractionRenderQueued') { throw 'Stale one-shot preview render queue is still present.' }
          if ($preview -notmatch 'Mark the drag complete BEFORE releasing capture') { throw 'Normal pointer release can regress to capture-lost rollback.' }
          if ($preview -notmatch 'PrepareProjectForImmersivePreviewRender') { throw 'Inline glyph suppression for immersive editing is missing.' }
          if ($preview -notmatch 'ReliablePreviewHandleModeAt') { throw 'Geometric resize/rotate handle hit-testing is missing.' }
          if ($preview -match 'var tag = FindPreviewTag\(e\.OriginalSource') { throw 'Transform mode must not depend on routed OriginalSource ancestry.' }
          if ($preview -notmatch '_suppressCardSelectionPreviewSeek') { throw 'Preview card selection seek suppression is missing.' }
          $thumb = Get-Content 'windows/CubicalCompare/MainWindow.ThumbnailAndMegaPack.cs' -Raw
          if ($thumb -notmatch 'if \(_suppressCardSelectionPreviewSeek\)') { throw 'Renderer preview selection handler can still seek after direct frame clicks.' }
          if ($preview -notmatch 'TextControlBackgroundFocused') { throw 'Transparent in-place text editor styling is missing.' }
          if ($preview -notmatch 'Opacity = 0,') { throw 'Artwork ghost must stay invisible so the real rendered frame remains visible.' }

          $rendererEngine = Get-Content 'windows/CubicalCompare/Core/Renderer/Legacy/RendererEngine.cs' -Raw
          if ($rendererEngine -notmatch 'SKRect\? visibleClip') { throw 'Renderer image transforms still lack a separate visible artwork clip.' }
          if ($rendererEngine -notmatch 'visibleClip \?\? dest') { throw 'Renderer still treats the SmartCard base image rectangle as the only artwork mask.' }
          if ($rendererEngine -notmatch 'DrawImageCover\([\s\S]*?new SKRect\(clip\.X, clip\.Y, clip\.Right, clip\.Bottom\)') { throw 'SmartCard artwork is not using the full authored reveal clip.' }

          $rendererAdapter = Get-Content 'windows/CubicalCompare/Core/Renderer/LegacyRendererAdapter.cs' -Raw
          if ($rendererAdapter -notmatch 'ImageBaseX') { throw 'Preview geometry does not separate SmartCard base image placement from the full artwork mask.' }
          if ($rendererAdapter -notmatch 'artworkClip = sequence\.Artwork\?\.ClipAt') { throw 'Preview geometry is not exposing the authored SmartCard artwork clip.' }
          if ($preview -notmatch 'ReliableImageBase') { throw 'Preview transforms do not use the SmartCard image base rectangle.' }
          if ($preview -notmatch 'ImageBaseWidth') { throw 'Preview resize/hit-testing still collapses SmartCard artwork back to the mask rectangle.' }

          $rendererBundle = Get-Content 'windows/CubicalCompare/Core/Renderer/Legacy/RendererBundle.cs' -Raw
          if ($rendererBundle -match 'public const string AppVersion\s*=') {
            throw 'Renderer compatibility app version is still hardcoded.'
          }
          if ($rendererBundle -notmatch 'RendererRuntimeVersion\.Current') {
            throw 'RendererCapabilities is not using the runtime version provider.'
          }

          $runtimeVersion = Get-Content 'windows/CubicalCompare/Core/Renderer/Legacy/RendererRuntimeVersion.cs' -Raw
          if ($runtimeVersion -notmatch 'Assembly\.GetEntryAssembly\(\)') {
            throw 'Renderer runtime version provider does not resolve the running entry assembly.'
          }
          if ($runtimeVersion -notmatch 'AssemblyInformationalVersionAttribute') {
            throw 'Renderer runtime version provider is not using the product informational version.'
          }
          if ($runtimeVersion -match '(?m)^\s*(?:public|private|internal|protected|const|static|readonly|var|string).*?["'']4\.2\.1\.\d+') {
            throw 'Renderer runtime version provider contains a hardcoded Cubical Compare release version assignment.'
          }

          $playback = Get-Content 'windows/CubicalCompare/MainWindow.PreviewPlayback.cs' -Raw
          if ($playback -notmatch '_previewPlaybackRenderLoopRunning') { throw 'Preview playback single-flight render guard is missing.' }
          if ($playback -notmatch '_previewPlaybackRequestedFrame') { throw 'Preview playback latest-frame coalescing is missing.' }
          if ($playback -notmatch 'RunPreviewPlaybackRenderLoopAsync') { throw 'Preview playback render loop is missing.' }
          if ($playback -notmatch 'SetPreviewPlaybackSliderValue') { throw 'Preview playback slider-update suppression is missing.' }

          $updateService = Get-Content 'windows/CubicalCompare.Modules/Updates/UpdateService.cs' -Raw
          if ($updateService -notmatch 'CheckForPortableZipUpdateAsync') { throw 'Direct GitHub portable ZIP resolver is missing.' }
          if ($updateService -notmatch 'release\.PortableZip') { throw 'GitHub ZIP update does not resolve a portable release asset.' }
          if ($updateService -notmatch 'Path\.Combine\(stagePath, "current"\)') { throw 'ZIP updater does not prefer the real Velopack current/ payload.' }
          if ($updateService -notmatch 'ResolveUpdateTargetDirectory') { throw 'ZIP updater cannot repair nested current/current layouts.' }
          if ($updateService -notmatch 'sq\.version') { throw 'ZIP updater does not protect/restore Velopack install metadata.' }
          if ($updateService -notmatch 'includeCurrentVersion:\s*true') { throw 'GitHub ZIP repair cannot re-apply the current release.' }
          if ($updateService -notmatch 'layout\.NeedsRepair') { throw 'Normal updater does not detect damaged install topology.' }
          if ($updateService -notmatch 'var repair = BestPortableFallback\(release\)') { throw 'Damaged installs must prefer verified ZIP recovery before Setup.exe.' }

          $nativeSetup = Get-Content 'windows/CubicalCompare.InstallerBootstrap/NativeSetup.cpp' -Raw
          if ($nativeSetup -notmatch 'MoveCurrentDirectoryOutsideInstall') { throw 'Setup does not release an inherited install-folder current-directory lock.' }
          if ($nativeSetup -notmatch 'StopConflictingCubicalCompareProcesses') { throw 'Setup does not close the full Cubical Compare process tree before replacement.' }
          if ($nativeSetup -notmatch 'QueryFullProcessImageNameW') { throw 'Setup cannot identify install-resident helper processes.' }
          if ($nativeSetup -notmatch 'CubicalCompare.Setup.Singleton.v1') { throw 'Setup does not prevent concurrent installer races.' }
          if ($nativeSetup -notmatch 'WM_INSTALL_PROGRESS') { throw 'Setup has no determinate progress message pipeline.' }
          if ($nativeSetup -notmatch 'PBM_SETPOS') { throw 'Setup progress bar does not visibly advance.' }
          if ($nativeSetup -notmatch 'IsLegacyBrokenInstall') { throw 'Setup cannot detect the malformed legacy install tree.' }
          if ($nativeSetup -notmatch 'QuarantineBrokenInstall') { throw 'Setup cannot quarantine a malformed current/ tree before Velopack repair.' }
          if ($nativeSetup -notmatch 'RestoreQuarantinedInstall') { throw 'Setup has no rollback for a failed repair attempt.' }
          if ($nativeSetup -notmatch 'VelopackLogPath') { throw 'Setup failures do not surface the Velopack log path.' }
          if ($nativeSetup -notmatch 'NextRecoveryInstallRoot') { throw 'Smart Setup has no fresh-root recovery strategy.' }
          if ($nativeSetup -notmatch 'active-root\.txt') { throw 'Smart Setup does not persist the active managed install root.' }
          if ($nativeSetup -notmatch '--silent --installto ') { throw 'Smart Setup is not using Velopack supported install-root override.' }
          if ($nativeSetup -notmatch 'Existing install is locked\. Switching to recovery location') { throw 'Smart Setup does not visibly explain lock recovery.' }
          if ($nativeSetup -notmatch 'smart installer exhausted both install paths') { throw 'Smart Setup does not distinguish two-path exhaustion from a first-path lock.' }

          $finalReleaseUi = Get-Content 'windows/CubicalCompare/MainWindow.FinalRelease.cs' -Raw
          if ($finalReleaseUi -notmatch 'Get latest from GitHub') { throw 'Update from ZIP does not expose GitHub fetching.' }
          if ($finalReleaseUi -notmatch 'Choose local ZIP') { throw 'Update from ZIP lost local archive support.' }

          $rendererEngine = Get-Content 'windows/CubicalCompare/Core/Renderer/Legacy/RendererEngine.cs' -Raw
          if ($rendererEngine -notmatch 'smart-card-text-outside-artwork-clip-v1') { throw 'SmartCard text-outside-artwork-clip runtime support is missing.' }
          if ($rendererEngine -notmatch 'entryMotion\.Equals\("top-to-final"') { throw 'SmartBadge top-to-final runtime handling is missing.' }
          if ($rendererEngine -notmatch 'entryAnchor\.Equals\("final-x"') { throw 'SmartBadge final-X anchor runtime handling is missing.' }
          if ($rendererEngine -notmatch 'SequenceOpaqueBounds') { throw 'SmartBadge final-X drift correction is missing.' }
          if ($rendererEngine -notmatch 'settledHold') { throw 'SmartBadge settled-hold runtime handling is missing.' }
          if ($rendererEngine -notmatch 'if \(index < 4\)') { throw 'Opening SmartBadge slot isolation is missing.' }
          if ($rendererEngine -notmatch 'slotLeft = index \* spec\.SlotPitch \+ slotInset') { throw 'Opening SmartBadge slot isolation is not anchored to the final card slot.' }
          if ($rendererEngine -notmatch 'canvas\.ClipRect\([\s\S]*?slotLeft[\s\S]*?slotRight[\s\S]*?SKClipOperation\.Intersect') { throw 'Opening SmartBadge base/text/overlay are not clipped as one composition.' }

          $smartSequence = Get-Content 'windows/CubicalCompare/Core/Renderer/Legacy/SmartBadgeSequence.cs' -Raw
          if ($smartSequence -notmatch 'FinalFrame\(\)') { throw 'SmartBadge final-frame accessor is missing.' }

          if ($rendererBundle -notmatch 'smart-badge-top-entry-final-x-v1') { throw 'Renderer capability list is missing top-entry/final-X support.' }
          if ($rendererBundle -notmatch 'smart-badge-settled-hold-v1') { throw 'Renderer capability list is missing settled-hold support.' }
          if ($rendererBundle -notmatch 'smart-card-text-outside-artwork-clip-v1') { throw 'Renderer capability list is missing SmartCard text clip support.' }
          if ($rendererBundle -notmatch 'smart-card-full-artwork-mask-v1') { throw 'Renderer capability list is missing full SmartCard artwork-mask support.' }

          $mainWindow = Get-Content 'windows/CubicalCompare/MainWindow.xaml.cs' -Raw
          if ($mainWindow -match 'ProjectFrameSlider\.Value = 0;\s*await RenderCurrentFrameAsync\(\);') {
            throw 'Renderer load still hard-resets every package to frame zero.'
          }
          if ($mainWindow -notmatch 'InitialPreviewFrame\(BuildProject\(\)\)') {
            throw 'Renderer load does not use the renderer-authored initial preview frame.'
          }

          $adapter = Get-Content 'windows/CubicalCompare/Core/Renderer/LegacyRendererAdapter.cs' -Raw
          if ($adapter -notmatch 'PreviewTextRegions') { throw 'Renderer-authored editable text regions are missing.' }
          if ($adapter -notmatch 'ImageCoordinateScaleX') { throw 'Renderer-local image coordinate scaling is missing.' }
          if ($adapter -notmatch 'TryGetRibbonSmartCardGeometry') { throw 'SmartCard authored artwork geometry is missing.' }
          if ($adapter -notmatch 'TryGetRibbonSmartBadgeTextRegions') { throw 'SmartBadge authored text geometry is missing.' }

          $app = Get-Content 'windows/CubicalCompare/App.xaml.cs' -Raw
          if ($app -match 'mainWindow\.InitializeDirectArtworkManipulator\(\)') {
            throw 'The isolated inspector artwork mini-canvas is still being initialised; the full renderer preview must be the transform surface.'
          }

          $finalUi = Get-Content 'windows/CubicalCompare/MainWindow.FinalRelease.cs' -Raw
          if ($finalUi -notmatch 'CreateNavigationItem\("Audio", "audio"') { throw 'Primary Audio navigation tab is missing.' }
          Write-Host 'Immersive preview editing, Audio tab and renderer-authored geometry contracts verified.'

      - name: Publish certificate-free portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item artifacts/publish -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish windows/CubicalCompare/CubicalCompare.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Version="$env:CC_VERSION" `
            -p:AssemblyVersion="$env:CC_ASSEMBLY_VERSION" `
            -p:FileVersion="$env:CC_ASSEMBLY_VERSION" `
            -p:InformationalVersion="$env:CC_VERSION+${{ github.sha }}" `
            -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }

      - name: Verify update restart does not block on Velopack OK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content 'windows/CubicalCompare.Modules/Updates/UpdateService.cs' -Raw
          if ($source -match 'ApplyUpdatesAndRestart\s*\(') {
            throw 'In-app package updates must not use ApplyUpdatesAndRestart; its Velopack UI can block on a final OK acknowledgement.'
          }
          if ($source -notmatch 'WaitExitThenApplyUpdates\s*\(' -or $source -notmatch 'silent:\s*true' -or $source -notmatch 'restart:\s*true') {
            throw 'Package updater must hand off with WaitExitThenApplyUpdates(silent: true, restart: true).'
          }
          Write-Host 'Verified package update handoff has no blocking Velopack completion acknowledgement.'

      - name: Verify .NET 10 modular output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'CubicalCompare.exe',
            'CubicalCompare.dll',
            'CubicalCompare.pri',
            'CubicalCompare.Core.dll',
            'CubicalCompare.MegaPack.dll',
            'CubicalCompare.Renderer.dll',
            'CubicalCompare.Thumbnail.dll',
            'CubicalCompare.Updates.dll'
          )
          foreach ($name in $required) {
            $path = Join-Path 'artifacts/publish' $name
            if (-not (Test-Path $path)) { throw "Required portable output is missing: $name" }
          }
          $runtimeDlls = @(Get-ChildItem artifacts/publish -Filter '*.dll' -File)
          if ($runtimeDlls.Count -lt 10) { throw 'Self-contained publish did not produce the expected multi-DLL application layout.' }
          Write-Host "Portable layout verified: $($runtimeDlls.Count) DLL files plus CubicalCompare.exe."

      - name: Smoke test unpackaged WinUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'artifacts/publish/CubicalCompare.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--ci-shell-smoke' -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Unpackaged Cubical Compare exited during WinUI smoke test with code $($process.ExitCode)." }
          Write-Host "Unpackaged WinUI startup smoke passed (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force

      - name: Smoke test full MainWindow and XAML runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $log = Join-Path $env:LOCALAPPDATA 'RetroFrost\CubicalCompare\startup.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'artifacts/publish/CubicalCompare.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--ci-mainwindow-smoke' -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "Full Cubical Compare window exited during smoke test with code $($process.ExitCode)." }
          if (-not (Test-Path $log)) { throw "Full-window smoke did not create startup.log." }
          $text = Get-Content $log -Raw
          if ($text -match 'Post-activation editor control initialisation failed') {
            throw ("Full-window post-activation initialisation failed. " + $text)
          }
          if ($text -notmatch 'Post-activation editor controls initialised') {
            throw ("Full-window smoke did not reach completed editor initialisation. " + $text)
          }
          $expectedRendererVersion = [regex]::Escape($env:CC_VERSION)
          if ($text -notmatch "Renderer compatibility app version: $expectedRendererVersion\.") {
            throw ("Renderer compatibility version is not the published app version $env:CC_VERSION. " + $text)
          }
          Write-Host "Full MainWindow/XAML smoke passed with renderer compatibility version $env:CC_VERSION (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Build open-source setup and update packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item artifacts/velopack -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path artifacts/velopack -Force | Out-Null

          # Fetch the previous published package/feed before packing. Velopack only
          # creates delta packages when the previous release is present locally.
          # This dramatically reduces normal update download/preparation time.
          vpk download github `
            --repoUrl "https://github.com/RetroFrost/CTS" `
            --token "${{ github.token }}" `
            --channel win `
            --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not fetch previous Velopack release; continuing with a full package only."
          }

          # Keep only update/feed history from the download. Public installer/portable
          # assets are rebuilt below and must never be reused from the previous release.
          Get-ChildItem artifacts/velopack -File | Where-Object {
            $_.Name -Like '*-Setup.exe' -or $_.Name -Like '*-Portable.zip'
          } | Remove-Item -Force -ErrorAction SilentlyContinue

          vpk pack `
            --packId CubicalCompare `
            --packVersion "$env:CC_VELOPACK_VERSION" `
            --packDir artifacts/publish `
            --mainExe CubicalCompare.exe `
            --packTitle "Cubical Compare" `
            --runtime win-x64 `
            --delta BestSpeed `
            --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed with exit code $LASTEXITCODE." }

          $setup = Get-ChildItem artifacts/velopack -File | Where-Object Name -Like '*Setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem artifacts/velopack -File | Where-Object Name -Like '*Portable.zip' | Select-Object -First 1
          $full = Get-ChildItem artifacts/velopack -File | Where-Object Name -EQ "CubicalCompare-$env:CC_VELOPACK_VERSION-full.nupkg" | Select-Object -First 1
          $delta = Get-ChildItem artifacts/velopack -File | Where-Object Name -EQ "CubicalCompare-$env:CC_VELOPACK_VERSION-delta.nupkg" | Select-Object -First 1
          $index = Get-ChildItem artifacts/velopack -File | Where-Object Name -Like 'releases.*.json' | Select-Object -First 1
          if (-not $setup) { throw 'Velopack did not produce Setup.exe.' }
          if (-not $portable) { throw 'Velopack did not produce Portable.zip.' }
          if (-not $full) { throw 'Velopack did not produce the current full update package.' }
          if (-not $index) { throw 'Velopack did not produce a release index.' }
          if ($delta) {
            Write-Host "Fast delta package generated: $($delta.Name) ($([math]::Round($delta.Length / 1MB, 2)) MiB)"
          }
          else {
            Write-Warning 'No delta package was generated; clients will automatically use the full package for this transition.'
          }

          # Build the public Setup.exe as a tiny native Win32 bootstrap around
          # Velopack's silent engine. It appears immediately, has no .NET runtime
          # dependency, never opens the Microsoft Store, and has no final OK dialog.
          $versionedSetup = "artifacts/velopack/CubicalCompare-$env:CC_VERSION-Windows-x64-Setup.exe"
          $versionedPortable = "artifacts/velopack/CubicalCompare-$env:CC_VERSION-Windows-x64-Portable.zip"
          & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File windows/CubicalCompare.InstallerBootstrap/Build-NativeSetup.ps1 `
            -VelopackSetup "$($setup.FullName)" `
            -Output "$versionedSetup"
          if ($LASTEXITCODE -ne 0) { throw "Native setup build failed with exit code $LASTEXITCODE." }

          Move-Item $portable.FullName $versionedPortable -Force
          Remove-Item $setup.FullName -Force
          Remove-Item artifacts/velopack/RELEASES -Force -ErrorAction SilentlyContinue

          "CC_SETUP=$((Resolve-Path $versionedSetup).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_PORTABLE=$versionedPortable" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Native Cubical Compare setup: $(Split-Path $versionedSetup -Leaf)"
          Write-Host "Portable release asset: $(Split-Path $versionedPortable -Leaf)"

      - name: Smoke test ZIP updater recovery and canonical replacement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'cubical-compare-zip-recovery'
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue

          # Reproduce the old broken topology:
          # root\Update.exe
          # root\current\Update.exe + .portable + current\CubicalCompare.exe
          $outerCurrent = Join-Path $root 'current'
          $nestedCurrent = Join-Path $outerCurrent 'current'
          New-Item -ItemType Directory -Path $nestedCurrent -Force | Out-Null
          'canonical updater sentinel' | Set-Content (Join-Path $root 'Update.exe') -Encoding ASCII
          'bad nested updater' | Set-Content (Join-Path $outerCurrent 'Update.exe') -Encoding ASCII
          'portable marker copied to wrong place' | Set-Content (Join-Path $outerCurrent '.portable') -Encoding ASCII
          'stale outer file' | Set-Content (Join-Path $outerCurrent 'stale.txt') -Encoding ASCII
          'stale nested exe' | Set-Content (Join-Path $nestedCurrent 'CubicalCompare.exe') -Encoding ASCII
          'stale nested file' | Set-Content (Join-Path $nestedCurrent 'stale-nested.txt') -Encoding ASCII

          dotnet run -c Release --project windows/CubicalCompare.UpdateSmoke/CubicalCompare.UpdateSmoke.csproj -- "$env:CC_PORTABLE" "$nestedCurrent"
          if ($LASTEXITCODE -ne 0) { throw "ZIP updater smoke runner failed with exit code $LASTEXITCODE." }

          $deadline = [DateTime]::UtcNow.AddSeconds(90)
          do {
            Start-Sleep -Milliseconds 500
            $directExe = Join-Path $outerCurrent 'CubicalCompare.exe'
            $manifest = Join-Path $outerCurrent 'sq.version'
            $stillNested = Test-Path (Join-Path $outerCurrent 'current')
            $stale = Test-Path (Join-Path $outerCurrent 'stale.txt')
            if ((Test-Path $directExe) -and (Test-Path $manifest) -and -not $stillNested -and -not $stale) { break }
          } while ([DateTime]::UtcNow -lt $deadline)

          if (-not (Test-Path (Join-Path $outerCurrent 'CubicalCompare.exe'))) { throw 'ZIP recovery did not replace the canonical current directory with the real app payload.' }
          if (-not (Test-Path (Join-Path $outerCurrent 'sq.version'))) { throw 'ZIP recovery lost the Velopack sq.version manifest.' }
          if (Test-Path (Join-Path $outerCurrent 'current')) { throw 'ZIP recovery preserved the broken current/current nesting.' }
          if (Test-Path (Join-Path $outerCurrent '.portable')) { throw 'ZIP recovery mirrored the portable bundle root into the installed current directory.' }
          if (Test-Path (Join-Path $outerCurrent 'Update.exe')) { throw 'ZIP recovery copied the portable bundle Update.exe into the installed current directory.' }
          if (Test-Path (Join-Path $outerCurrent 'stale.txt')) { throw 'ZIP recovery did not mirror-replace stale app files.' }
          if ((Get-Content (Join-Path $root 'Update.exe') -Raw) -notmatch 'canonical updater sentinel') { throw 'ZIP recovery modified the install-root Update.exe instead of only replacing current/.' }

          Write-Host 'ZIP updater recovery smoke passed: real current/ payload selected, nested layout flattened, sq.version restored, canonical root preserved.'

      - name: Verify public setup is native and self-contained
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File windows/CubicalCompare.InstallerBootstrap/Verify-NativeSetup.ps1 -Setup "$env:CC_SETUP"
          if ($LASTEXITCODE -ne 0) { throw "Native setup verification failed with exit code $LASTEXITCODE." }

      - name: Smoke test visible Cubical Compare installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          # Reproduce the user's real failure conditions:
          # 1) Cubical Compare is already running.
          # 2) an older ZIP update left a malformed current/current tree plus
          #    portable-bundle markers inside the installed current/ directory.
          $installRoot = Join-Path $env:LOCALAPPDATA 'CubicalCompare'
          Remove-Item $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $brokenCurrent = Join-Path $installRoot 'current'
          $brokenNested = Join-Path $brokenCurrent 'current'
          New-Item -ItemType Directory -Path $brokenNested -Force | Out-Null
          'bad portable marker' | Set-Content (Join-Path $brokenCurrent '.portable') -Encoding ASCII
          'bad nested updater' | Set-Content (Join-Path $brokenCurrent 'Update.exe') -Encoding ASCII
          'stale outer exe' | Set-Content (Join-Path $brokenCurrent 'CubicalCompare.exe') -Encoding ASCII
          'stale nested exe' | Set-Content (Join-Path $brokenNested 'CubicalCompare.exe') -Encoding ASCII

          # A second helper executable inside the install tree keeps that folder open.
          # Setup must identify/stop install-resident helpers, not only CubicalCompare.exe.
          $helperExe = Join-Path $brokenCurrent 'CubicalCompareWorker.exe'
          Copy-Item (Join-Path $env:SystemRoot 'System32\cmd.exe') $helperExe -Force
          $helper = Start-Process -FilePath $helperExe -ArgumentList '/d /c ping -n 300 127.0.0.1 >nul' -WorkingDirectory $brokenCurrent -PassThru
          $helperPid = $helper.Id

          $portableExe = (Resolve-Path 'artifacts/publish/CubicalCompare.exe').Path
          $alreadyRunning = Start-Process -FilePath $portableExe -ArgumentList '--ci-shell-smoke' -WorkingDirectory (Split-Path $portableExe) -PassThru
          Start-Sleep -Seconds 4
          $alreadyRunning.Refresh()
          if ($alreadyRunning.HasExited) { throw "Pre-existing Cubical Compare process exited before installer test with code $($alreadyRunning.ExitCode)." }
          $oldPid = $alreadyRunning.Id
          Write-Host "Pre-existing Cubical Compare process running as PID $oldPid."

          # Reproduce the key real-world lock: when Setup is launched by the app it
          # can inherit current/ as its process working directory. Windows locks a
          # process current directory against move/rename, so Setup must relocate
          # itself to %TEMP% immediately before Velopack tries to rename the root.
          $setupProcess = Start-Process -FilePath "$env:CC_SETUP" -WorkingDirectory $brokenCurrent -PassThru

          $visible = $false
          $launchTimer = [System.Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 125
            $setupProcess.Refresh()
            if ($setupProcess.HasExited) { break }
            if ($setupProcess.MainWindowHandle -ne 0) {
              $visible = $true
              break
            }
          }
          $launchTimer.Stop()
          if (-not $visible) {
            if (-not $setupProcess.HasExited) { Stop-Process -Id $setupProcess.Id -Force -ErrorAction SilentlyContinue }
            throw 'Public Setup.exe did not expose a visible installer window within five seconds.'
          }
          Write-Host "Visible Cubical Compare setup window detected after $([math]::Round($launchTimer.Elapsed.TotalMilliseconds)) ms (PID $($setupProcess.Id), HWND $($setupProcess.MainWindowHandle))."

          if (-not $setupProcess.WaitForExit(120000)) {
            Stop-Process -Id $setupProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'Visible Cubical Compare Setup.exe did not finish within the installer smoke window.'
          }
          if ($setupProcess.ExitCode -ne 0) { throw "Visible Cubical Compare Setup.exe failed with exit code $($setupProcess.ExitCode)." }

          if (Get-Process -Id $oldPid -ErrorAction SilentlyContinue) {
            throw 'Setup did not close the Cubical Compare process that was already running.'
          }
          if (Get-Process -Id $helperPid -ErrorAction SilentlyContinue) {
            throw 'Setup did not close the background helper that was locking the install tree.'
          }

          $installedExe = Join-Path $installRoot 'current\CubicalCompare.exe'
          if (-not (Test-Path $installedExe)) { throw 'Setup completed but the canonical installed CubicalCompare.exe was not found.' }
          if (-not (Test-Path (Join-Path $installRoot 'current\sq.version'))) { throw 'Setup repair did not restore sq.version.' }
          if (Test-Path (Join-Path $installRoot 'current\current')) { throw 'Setup repair preserved the broken current/current nesting.' }
          if (Test-Path (Join-Path $installRoot 'current\.portable')) { throw 'Setup repair left the copied portable marker inside installed current/.' }
          if (Test-Path (Join-Path $installRoot 'current\Update.exe')) { throw 'Setup repair left the copied portable Update.exe inside installed current/.' }

          $launched = $null
          for ($i = 0; $i -lt 15; $i++) {
            $launched = Get-Process CubicalCompare -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($launched) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $launched) { throw 'Visible setup completed but did not launch Cubical Compare.' }
          Write-Host "Visible setup repaired the malformed install and auto-launched Cubical Compare (PID $($launched.Id))."
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $installedExe -ArgumentList '--ci-shell-smoke' -WorkingDirectory (Split-Path $installedExe) -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Installed Cubical Compare exited during smoke test with code $($process.ExitCode)." }
          Write-Host "Installed-app smoke passed after installer repair (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force

          # Now reproduce the lock class the previous installer still could not solve:
          # an unrelated external process owns an exclusive file handle inside current/.
          # Smart Setup must NOT kill this unrelated process. It should let the normal
          # Velopack attempt fail and automatically install a fresh managed copy using
          # --installto, then make that clean root the active copy.
          $lockFile = Join-Path $installRoot 'current\smart-installer-external.lock'
          'external lock sentinel' | Set-Content $lockFile -Encoding ASCII
          # Keep the exclusive handle in the GitHub runner's own PowerShell
          # process. Setup cannot terminate its parent, so this is a deterministic
          # unknown/external lock that remains alive for the whole install attempt.
          $externalLock = [System.IO.File]::Open(
            $lockFile,
            [System.IO.FileMode]::Open,
            [System.IO.FileAccess]::ReadWrite,
            [System.IO.FileShare]::None)
          if ($null -eq $externalLock -or -not $externalLock.CanRead) {
            throw 'Could not establish the external FileShare.None lock for Smart Setup smoke testing.'
          }
          Write-Host "External exclusive file handle established by runner PID $PID."

          try {
            $secondSetup = Start-Process -FilePath "$env:CC_SETUP" -WorkingDirectory (Join-Path $installRoot 'current') -PassThru
            if (-not $secondSetup.WaitForExit(120000)) {
              Stop-Process -Id $secondSetup.Id -Force -ErrorAction SilentlyContinue
              throw 'Smart Setup did not finish its persistent-lock recovery within 120 seconds.'
            }
            if ($secondSetup.ExitCode -ne 0) {
              throw "Smart Setup persistent-lock recovery failed with exit code $($secondSetup.ExitCode)."
            }

            # The parent process still owns the stream here. If Setup somehow
            # depended on releasing/killing the external locker, it could not reach
            # this point.
            if (-not $externalLock.CanRead) {
              throw 'Smart Setup invalidated the external lock instead of using recovery installation.'
            }

            $pointer = Join-Path $env:LOCALAPPDATA 'RetroFrost\CubicalCompare\Installer\active-root.txt'
            if (-not (Test-Path $pointer)) {
              throw 'Smart Setup did not persist its active install root.'
            }
            $activeRoot = (Get-Content $pointer -Raw).Trim()
            if ([string]::IsNullOrWhiteSpace($activeRoot)) {
              throw 'Smart Setup active-root pointer is empty.'
            }

            $canonicalFull = [System.IO.Path]::GetFullPath($installRoot).TrimEnd('\')
            $activeFull = [System.IO.Path]::GetFullPath($activeRoot).TrimEnd('\')
            if ([string]::Equals($canonicalFull, $activeFull, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw 'Smart Setup claimed success but did not fail over from the still-locked canonical install root.'
            }

            $recoveryExe = Join-Path $activeRoot 'current\CubicalCompare.exe'
            if (-not (Test-Path $recoveryExe)) {
              throw "Smart Setup recovery root does not contain CubicalCompare.exe: $activeRoot"
            }
            if (-not (Test-Path (Join-Path $activeRoot 'current\sq.version'))) {
              throw 'Smart Setup recovery root is missing Velopack sq.version metadata.'
            }

            $shortcutPath = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Cubical Compare.lnk'
            if (Test-Path $shortcutPath) {
              $shell = New-Object -ComObject WScript.Shell
              $shortcut = $shell.CreateShortcut($shortcutPath)
              $shortcutTarget = [System.IO.Path]::GetFullPath($shortcut.TargetPath)
              if (-not $shortcutTarget.StartsWith($activeFull, [System.StringComparison]::OrdinalIgnoreCase)) {
                throw "Desktop shortcut did not follow Smart Setup recovery root. Target: $shortcutTarget"
              }
            }

            $recoveryProcess = $null
            for ($i = 0; $i -lt 15; $i++) {
              $recoveryProcess = Get-Process CubicalCompare -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($recoveryProcess) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $recoveryProcess) {
              throw 'Smart Setup recovery completed but did not launch Cubical Compare.'
            }

            Write-Host "Smart installer fallback passed: locked root '$installRoot' -> active recovery root '$activeRoot'."
            Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          finally {
            $externalLock.Dispose()
          }

      - name: Write SHA256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $public = Get-ChildItem artifacts/velopack -File | Where-Object {
            $_.Name -Like '*-Setup.exe' -or
            $_.Name -Like '*-Portable.zip' -or
            $_.Name -EQ "CubicalCompare-$env:CC_VELOPACK_VERSION-full.nupkg" -or
            $_.Name -EQ "CubicalCompare-$env:CC_VELOPACK_VERSION-delta.nupkg" -or
            $_.Name -Like 'releases.*.json'
          } | Sort-Object Name
          if ($public.Count -lt 4) { throw 'Expected Setup.exe, Portable.zip, current full nupkg and release index before writing SHA256SUMS.txt.' }
          $lines = $public | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content artifacts/velopack/SHA256SUMS.txt -Encoding ASCII

      - name: Upload verified Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: CubicalCompare-${{ env.CC_VERSION }}-windows-x64
          path: artifacts/velopack/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/windows/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $notes = @"
          ## Cubical Compare $env:CC_VERSION — Windows

          - 4.2.1.27 fixes SmartBadge opening collisions in the renderer runtime instead of patching individual renderer packages.
          - Opening cards 1–4 are clipped to their final card slots before the moving card transform, so incoming badges reveal from the gap/divider rather than painting over the previous badge.
          - Base badge frames, live jsparse text and overlay/shine stay in one canvas transform and one slot clip, eliminating split/ghost layers.
          - Settled badge positions are unchanged, and cards 5+ / continuous scrolling are untouched.
          - Existing FULL-ARTWORK renderer packages work directly; no extra gap-spawn metadata or per-renderer coordinate hacks are required.

          - SmartCard artwork transforms now expand through the full authored artwork/reveal mask (including behind the badge) instead of being hard-clipped to the smaller scale=1 image base rectangle.
          - Preview selection, hit-testing and resize handles now distinguish the full visible artwork mask from the SmartCard image base, fixing the later-card/post-card-4 shrink behavior.

          - 4.2.1.26 introduces Smart Setup: the existing %LOCALAPPDATA%\\CubicalCompare tree is no longer a single point of failure.
          - Setup first updates the remembered active managed root; if Windows still keeps that tree locked, Setup automatically installs a clean managed copy to a fresh recovery root using Velopack's supported --installto option.
          - The clean recovery copy becomes the remembered active install, and Velopack refreshes shortcuts/uninstall registration to that root while the externally locked old tree is left untouched.
          - Setup never needs to kill unrelated third-party processes merely because they hold an old Cubical Compare file open.
          - CI now keeps an exclusive FileShare.None handle open from an unrelated pwsh.exe process, requires the canonical update to fail over automatically, verifies the unrelated locker survives, verifies the recovery root/shortcut, and requires Cubical Compare to launch.
          - 4.2.1.25 fixes the folder-in-use/Access denied installer failure: the native Setup immediately moves its own process current directory to %TEMP%, because Windows locks a process current directory against rename/delete.
          - Setup now closes the entire Cubical Compare process tree, install-resident helpers and stale embedded setup engines before Velopack replaces the install.
          - A named setup mutex prevents multiple Cubical Compare installers from racing the same install directory.
          - The installer progress bar is now determinate and visibly advances through payload extraction, process shutdown/repair, Velopack install and relaunch.
          - CI launches Setup.exe with current/ as its inherited working directory and a separate helper running from that folder, then requires Setup to release both locks and install successfully.
          - 4.2.1.24 fixes the public Setup.exe failure shown on real machines: it closes a running Cubical Compare before file replacement and repairs the malformed current/current install tree left by older ZIP updates before invoking Velopack.
          - Installer repair is rollback-safe: the old current/ tree is quarantined first and restored automatically if the embedded engine still fails.
          - Setup failures now report the actual engine exit code and the Velopack log location instead of only showing a generic failure.
          - CI now launches Cubical Compare first, creates the old malformed install topology, then requires the public Setup.exe to repair, install and relaunch successfully.
          - 4.2.1.23 completes updater recovery by preferring the verified GitHub portable ZIP for damaged installs, avoiding an unnecessary installer handoff while retaining Setup.exe as a last resort.
          - Update-system recovery: GitHub/local ZIP updates now select the real Velopack Portable.zip current/ payload instead of mirroring the outer bundle into the installed current directory.
          - ZIP repair flattens the broken current/current topology created by 4.2.1.20/21, replaces the actual app files, restores sq.version, and preserves the canonical install-root Update.exe.
          - Damaged installed copies now repair directly from the verified GitHub portable ZIP first; Setup.exe remains only the last-resort recovery path.
          - Manual Update from ZIP can re-apply the current GitHub release, so an already-up-to-date but damaged installation can repair itself.
          - CI now reproduces the old nested-install failure and proves the ZIP updater repairs it end-to-end before a release can publish.
          - Renderer runtime compatibility: SmartCard text can stay outside artwork reveal clips, so title/description fields no longer disappear behind image masks.
          - SmartBadge v2 now supports top-to-final entry semantics with final-X anchoring; later badges are runtime-corrected against horizontal drift while preserving their authored vertical motion.
          - SmartBadge settledHold is recognized explicitly, and per-card placement/motion overrides can reuse one pack without duplicating assets.
          - Renderer capability validation now recognizes the new SmartCard/SmartBadge 4.2.1.21 feature contracts instead of rejecting valid packages.
          - Preview Play no longer floods the renderer with overlapping 60 FPS jobs; playback coalesces to one latest-frame render loop and skips stale frames when rendering is slower than real-time.
          - Update from ZIP now lets you fetch the newest Windows portable ZIP directly from GitHub Releases or choose a local ZIP, using the same validation/staging/restart path.
          - Renderer v3 loading no longer forces frame 0 when the scene starts later; it opens at the first visible authored checkpoint/object frame instead.
          - Renderer minAppVersion checks now use the actual running Cubical Compare product version instead of the stale hardcoded 4.2.1.12 compatibility value.
          - CI launches the published app and verifies the renderer subsystem sees exactly $env:CC_VERSION, preventing version drift from returning.
          - Preview interaction hotfix: normal artwork clicks are Move; resize/rotate activate only inside their visible handles.
          - Clicking an already-visible card in the rendered frame no longer seeks the timeline backward; list clicks retain intentional jump-to-card navigation.
          - Immersive preview editor: normal mouse-up no longer resets artwork to its pre-drag transform.
          - The real full renderer frame remains visible while dragging; selection UI is border/handles only and no duplicate artwork ghost covers the result.
          - Move, resize and rotation run through a latest-state render loop, so slow intermediate frames cannot leave the preview stuck on stale coordinates.
          - SmartCard and SmartBadge packages now expose their authored per-frame artwork/text geometry to the editor, including local coordinate scaling, alignment and rotation.
          - Transparent inline text editing is positioned from the renderer field itself and hides only the underlying rendered glyph while editing.
          - Audio is now a primary navigation tab with soundtrack selection, volume, looping and renderer-embedded-audio status.
          - Direct preview editing now uses renderer-specific geometry across ribbon, Infinite Timeline, Relationships and Renderer v3 cards.
          - Moving, resizing and rotating artwork updates the live rendered preview while dragging.
          - In-place preview text editing is transparent and borderless instead of covering the rendered card.
          - Description editing now targets only the actual wrapped text lines instead of covering the entire remaining card block.
          - Empty description-area space no longer steals clicks from artwork, so transformed images stay directly movable.
          - Direct preview editing: click visible title, description, badge header or badge value text and edit it in place with a real caret.
          - Click rendered artwork itself to select and drag it; use corner handles to resize and the rotate handle to rotate.
          - A visible Apply to all images button beside the selected artwork copies its transform, crop and layer settings to every card.
          - SmartBadge v2 lets one renderer package embed multiple bootanimation-style badge ZIPs and map a different pack to every card.
          - Nested badge packs keep value/unit/header live through jsparse while their shell, reveal, shadow and shine stay frame-addressed.
          - Smart animation overlay frames now composite after live text/artwork, so glass/shine passes affect the live content instead of sitting underneath it.
          - Renderer v3 ZIPs may wrap the proven exact ribbon renderer while carrying SmartBadge v2 sidecars, preserving existing source-measured card/scroll tracks.
          - Source-exact renderers now support up to 65,536 renderer tracks and 65,536 dense keyframes per track instead of the old 256 / 4,096 legacy limits.\n          - Update from ZIP is restored for local portable bundles with validation, staged extraction, rollback and restart.\n          - Renderer v3 and nested Smart Feature ZIPs now support up to 65,536 frame assets while retaining expanded-size and duplicate-path safety checks.\n          - Renderer v3 proxy scenes can now combine SmartCards with the wrapped source-measured ribbon engine, preserving exact movement/scroll timing while replacing card visuals with live SmartCard content.\n          - SmartCard now uses strict split-layer compositing: base shell, live artwork, live title/description, then overlay shine/glass above all live content.\n          - smart-card-layered-compositing-v1 validates synchronized overlay frames so card shine cannot silently disappear or render underneath the content.\n          - Renderer v3 packages can contain a real renderer.renderer3 proxy scene that delegates to an exact wrapped ribbon renderer while keeping SmartBadge v2 nested ZIPs.\n          - Initial Setup.exe uses a tiny native Win32 bootstrap with no .NET runtime dependency. It shows progress immediately, runs Velopack silently, closes automatically and launches Cubical Compare.
          - The bootstrap cannot redirect to Microsoft Store for a missing runtime and avoids Velopack's final OK acknowledgement.
          - Setup is smoke-tested to show its own window within five seconds, finish unattended and launch the installed app automatically.
          - In-app package updates no longer stop on Velopack's final OK acknowledgement; Cubical Compare shows its own progress, then performs the file-swap handoff without a blocking completion dialog and restarts automatically.
          - CI now downloads the previous Velopack release before packing and generates BestSpeed delta packages when possible, so routine updates avoid re-downloading/re-preparing the full self-contained app.
          - The updater reports whether it selected a fast delta package or a full package.
          - Reliability-first automatic updater replaces the old fixed Update from ZIP path.
          - Real Velopack-managed installs prefer the verified full .nupkg + releases.win.json feed automatically.
          - Installed copies fall back to the visible Setup.exe if the package feed is unavailable or does not resolve safely.
          - Raw/portable copies use the versioned portable ZIP when that is the safer path.
          - Portable ZIP updates retry downloads, verify GitHub SHA-256 digests, fully stage before app exit and roll back if file replacement fails.
          - The Updates UI now exposes one Install update action and reports the method selected automatically.
          - Full nupkg and releases.win.json assets are published again so package-based updates can actually work.
          - Smart Badge Animation and the 4.2.1 Renderer Accuracy Pack remain included.
          - Public Setup.exe remains visible/non-silent and launches Cubical Compare after installation.
          - Self-contained x64 build; no separate .NET or Windows App SDK runtime install is required.

          **Unsigned build note:** Windows SmartScreen may still warn on an unsigned download. No certificate is required to build, install or update Cubical Compare.
          "@

          gh release view "$env:CC_TAG" --repo RetroFrost/CTS 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:CC_TAG" --repo RetroFrost/CTS --title "Cubical Compare $env:CC_VERSION — Windows" --notes "$notes" --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the GitHub release metadata.' }
          }
          else {
            gh release create "$env:CC_TAG" `
              --repo RetroFrost/CTS `
              --target "$env:GITHUB_SHA" `
              --title "Cubical Compare $env:CC_VERSION — Windows" `
              --notes "$notes" `
              --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }
          }

          $assets = @(
            Get-ChildItem artifacts/velopack -File | Where-Object {
              $_.Name -Like '*-Setup.exe' -or
              $_.Name -Like '*-Portable.zip' -or
              $_.Name -EQ "CubicalCompare-$env:CC_VELOPACK_VERSION-full.nupkg" -or
              $_.Name -EQ "CubicalCompare-$env:CC_VELOPACK_VERSION-delta.nupkg" -or
              $_.Name -Like 'releases.*.json' -or
              $_.Name -eq 'SHA256SUMS.txt'
            } | Sort-Object @{ Expression = {
              if ($_.Name -Like '*-delta.nupkg') { 0 }
              elseif ($_.Name -Like '*-full.nupkg') { 1 }
              elseif ($_.Name -Like 'releases.*.json') { 2 }
              elseif ($_.Name -Like '*-Portable.zip') { 3 }
              elseif ($_.Name -Like '*-Setup.exe') { 4 }
              else { 5 }
            } }
          )
          if ($assets.Count -eq 0) { throw 'No release assets were selected for upload.' }

          function Get-RemoteAsset([string]$name) {
            $releaseJson = gh api "repos/RetroFrost/CTS/releases/tags/$env:CC_TAG" 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseJson)) { return $null }
            $release = $releaseJson | ConvertFrom-Json
            return $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
          }

          $delays = @(5, 15, 30)
          foreach ($asset in $assets) {
            $uploaded = $false
            $localDigest = "sha256:" + (Get-FileHash -Algorithm SHA256 $asset.FullName).Hash.ToLowerInvariant()

            function Test-RemoteAssetMatch($remoteAsset, [int64]$expectedSize, [string]$expectedDigest) {
              return $null -ne $remoteAsset -and
                $remoteAsset.state -eq 'uploaded' -and
                [int64]$remoteAsset.size -eq $expectedSize -and
                -not [string]::IsNullOrWhiteSpace([string]$remoteAsset.digest) -and
                [string]::Equals([string]$remoteAsset.digest, $expectedDigest, [System.StringComparison]::OrdinalIgnoreCase)
            }

            for ($attempt = 1; $attempt -le 4; $attempt++) {
              $remote = Get-RemoteAsset $asset.Name
              if (Test-RemoteAssetMatch $remote ([int64]$asset.Length) $localDigest) {
                Write-Host "Release asset already verified by SHA-256: $($asset.Name)"
                $uploaded = $true
                break
              }

              if ($null -ne $remote) {
                $remoteDigest = if ([string]::IsNullOrWhiteSpace([string]$remote.digest)) { '<missing>' } else { [string]$remote.digest }
                Write-Warning "Removing stale/mismatched release asset: $($asset.Name) (remote digest $remoteDigest, local digest $localDigest)"
                gh api --method DELETE "repos/RetroFrost/CTS/releases/assets/$($remote.id)" 2>$null | Out-Null
              }

              Write-Host "Uploading $($asset.Name) (attempt $attempt/4)..."
              gh release upload "$env:CC_TAG" "$($asset.FullName)" --repo RetroFrost/CTS
              $uploadExit = $LASTEXITCODE

              $remote = Get-RemoteAsset $asset.Name
              if (Test-RemoteAssetMatch $remote ([int64]$asset.Length) $localDigest) {
                if ($uploadExit -eq 0) {
                  Write-Host "Verified release asset by SHA-256: $($asset.Name)"
                }
                else {
                  Write-Host "GitHub reported an upload error, but the SHA-256 digest is correct: $($asset.Name)"
                }
                $uploaded = $true
                break
              }

              if ($attempt -lt 4) {
                $delay = $delays[$attempt - 1]
                Write-Warning "Upload failed or digest mismatched for $($asset.Name); retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }

            if (-not $uploaded) { throw "Release asset failed SHA-256 verification after 4 attempts: $($asset.Name)" }
          }
