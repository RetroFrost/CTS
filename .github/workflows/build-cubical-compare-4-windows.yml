name: Build Cubical Compare 4 Windows

on:
  push:
    branches:
      - windows/main
    paths:
      - 'windows/CubicalCompare/**'
      - '.github/workflows/build-cubical-compare-4-windows.yml'
  workflow_dispatch:

concurrency:
  group: cubical-compare-4-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore windows/CubicalCompare/CubicalCompare.csproj -r win-x64 -p:Platform=x64

      - name: Build single-project MSIX
        shell: pwsh
        run: |
          dotnet publish windows/CubicalCompare/CubicalCompare.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=false

          $package = Get-ChildItem windows/CubicalCompare/AppPackages -Recurse -File | Where-Object { $_.Extension -in '.msix', '.appx' } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $package) { throw 'MSIX packaging completed without producing an installable package.' }
          "CC_PACKAGE=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package: $($package.FullName)"

      - name: Install packaged app for CI
        shell: pwsh
        run: |
          Add-AppxPackage -Path "$env:CC_PACKAGE" -AllowUnsigned -ForceApplicationShutdown
          $package = Get-AppxPackage -Name 'RetroFrost.CubicalCompare' | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $package) { throw 'Cubical Compare package was not registered after Add-AppxPackage.' }
          Write-Host "Installed $($package.Name) $($package.Version) ($($package.PackageFullName))"
          "CC_PFN=$($package.PackageFamilyName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test installed WinUI startup
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'CubicalCompare/startup.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$env:CC_PFN!App"
          Start-Sleep -Seconds 10

          $process = Get-Process CubicalCompare -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $process) {
            if (Test-Path $log) { Get-Content $log -Raw | Write-Host }
            throw 'Installed Cubical Compare package did not remain running after activation.'
          }

          if (Test-Path $log) {
            $startup = Get-Content $log -Raw
            $startup | Write-Host
            if ($startup -match 'startup failed|unhandled exception|Recovery window also failed') {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Cubical Compare reached the recovery/crash path during packaged startup.'
            }
          }

          Write-Host "Packaged WinUI startup survived. PID $($process.Id)."
          Stop-Process -Id $process.Id -Force

      - name: Stage verified MSIX
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/CubicalCompare-4-MSIX -Force | Out-Null
          Copy-Item "$env:CC_PACKAGE" artifacts/CubicalCompare-4-MSIX/CubicalCompare-4-x64.msix
          @'
          Cubical Compare 4 - verified CI MSIX

          GitHub Actions built, registered and launch-tested this exact package as a packaged WinUI 3 application.
          The CI artifact is intentionally unsigned. Public release builds must be signed with RetroFrost's stable trusted signing certificate.
          '@ | Set-Content artifacts/CubicalCompare-4-MSIX/README.txt

      - name: Upload verified Windows MSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CubicalCompare-4-win-x64-msix
          path: artifacts/CubicalCompare-4-MSIX/**
          if-no-files-found: error
          retention-days: 14
