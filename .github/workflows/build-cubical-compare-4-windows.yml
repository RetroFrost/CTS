name: Build Cubical Compare 4 Windows

on:
  push:
    branches:
      - windows/main
      - work/portable-zip-windows
    paths:
      - 'windows/CubicalCompare/**'
      - 'windows/CubicalCompare.Modules/**'
      - 'windows/CubicalCompare.InstallerBootstrap/**'
      - 'Directory.Build.targets'
      - '.github/workflows/build-cubical-compare-4-windows.yml'
  pull_request:
    branches:
      - windows/main
    paths:
      - 'windows/CubicalCompare/**'
      - 'windows/CubicalCompare.Modules/**'
      - 'windows/CubicalCompare.InstallerBootstrap/**'
      - 'Directory.Build.targets'
      - '.github/workflows/build-cubical-compare-4-windows.yml'
  workflow_dispatch:

concurrency:
  group: cubical-compare-4-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win-x64:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "4.2.0"
          $assemblyVersion = "$version.0"
          "CC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_ASSEMBLY_VERSION=$assemblyVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_TAG=v$version-windows" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Cubical Compare Windows version: $version (.NET 10)"

      - name: Restore
        run: dotnet restore windows/CubicalCompare/CubicalCompare.csproj -r win-x64 -p:Platform=x64

      - name: Publish certificate-free portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item artifacts/publish -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish windows/CubicalCompare/CubicalCompare.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:Version="$env:CC_VERSION" `
            -p:AssemblyVersion="$env:CC_ASSEMBLY_VERSION" `
            -p:FileVersion="$env:CC_ASSEMBLY_VERSION" `
            -p:InformationalVersion="$env:CC_VERSION+${{ github.sha }}" `
            -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }

      - name: Verify .NET 10 modular output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'CubicalCompare.exe',
            'CubicalCompare.dll',
            'CubicalCompare.pri',
            'CubicalCompare.Core.dll',
            'CubicalCompare.MegaPack.dll',
            'CubicalCompare.Renderer.dll',
            'CubicalCompare.Thumbnail.dll',
            'CubicalCompare.Updates.dll'
          )
          foreach ($name in $required) {
            $path = Join-Path 'artifacts/publish' $name
            if (-not (Test-Path $path)) { throw "Required portable output is missing: $name" }
          }
          $runtimeDlls = @(Get-ChildItem artifacts/publish -Filter '*.dll' -File)
          if ($runtimeDlls.Count -lt 10) { throw 'Self-contained publish did not produce the expected multi-DLL application layout.' }
          Write-Host "Portable layout verified: $($runtimeDlls.Count) DLL files plus CubicalCompare.exe."

      - name: Smoke test unpackaged WinUI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'artifacts/publish/CubicalCompare.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--ci-shell-smoke' -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Unpackaged Cubical Compare exited during WinUI smoke test with code $($process.ExitCode)." }
          Write-Host "Unpackaged WinUI startup smoke passed (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force

      - name: Smoke test full MainWindow and XAML runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $log = Join-Path $env:LOCALAPPDATA 'RetroFrost\CubicalCompare\startup.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $exe = (Resolve-Path 'artifacts/publish/CubicalCompare.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--ci-mainwindow-smoke' -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "Full Cubical Compare window exited during smoke test with code $($process.ExitCode)." }
          if (-not (Test-Path $log)) { throw "Full-window smoke did not create startup.log." }
          $text = Get-Content $log -Raw
          if ($text -match 'Post-activation editor control initialisation failed') {
            throw ("Full-window post-activation initialisation failed. " + $text)
          }
          if ($text -notmatch 'Post-activation editor controls initialised') {
            throw ("Full-window smoke did not reach completed editor initialisation. " + $text)
          }
          Write-Host "Full MainWindow/XAML smoke passed (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Build open-source setup and update packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item artifacts/velopack -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path artifacts/velopack -Force | Out-Null

          vpk pack `
            --packId CubicalCompare `
            --packVersion "$env:CC_VERSION" `
            --packDir artifacts/publish `
            --mainExe CubicalCompare.exe `
            --packTitle "Cubical Compare" `
            --runtime win-x64 `
            --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed with exit code $LASTEXITCODE." }

          $setup = Get-ChildItem artifacts/velopack -File | Where-Object Name -Like '*Setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem artifacts/velopack -File | Where-Object Name -Like '*Portable.zip' | Select-Object -First 1
          $full = Get-ChildItem artifacts/velopack -File | Where-Object Name -Like '*-full.nupkg' | Select-Object -First 1
          $index = Get-ChildItem artifacts/velopack -File | Where-Object Name -Like 'releases.*.json' | Select-Object -First 1
          if (-not $setup) { throw 'Velopack did not produce Setup.exe.' }
          if (-not $portable) { throw 'Velopack did not produce Portable.zip.' }
          if (-not $full) { throw 'Velopack did not produce a full update package.' }
          if (-not $index) { throw 'Velopack did not produce a release index.' }

          # Build the public interactive bootstrap. The embedded Velopack installer
          # runs with its normal visible progress UI and launches Cubical Compare when done.
          Remove-Item artifacts/bootstrap -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish windows/CubicalCompare.InstallerBootstrap/CubicalCompare.InstallerBootstrap.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:VelopackSetupPath="$($setup.FullName)" `
            -o artifacts/bootstrap
          if ($LASTEXITCODE -ne 0) { throw "Installer bootstrap publish failed with exit code $LASTEXITCODE." }

          $bootstrap = Get-ChildItem artifacts/bootstrap -File -Filter 'CubicalCompare.Setup.exe' | Select-Object -First 1
          if (-not $bootstrap) { throw 'Installer bootstrap did not produce CubicalCompare.Setup.exe.' }

          $versionedSetup = "artifacts/velopack/CubicalCompare-$env:CC_VERSION-Windows-x64-Setup.exe"
          $versionedPortable = "artifacts/velopack/CubicalCompare-$env:CC_VERSION-Windows-x64-Portable.zip"
          Copy-Item $bootstrap.FullName $versionedSetup -Force
          Move-Item $portable.FullName $versionedPortable -Force
          Remove-Item $setup.FullName -Force
          Remove-Item artifacts/velopack/RELEASES -Force -ErrorAction SilentlyContinue

          "CC_SETUP=$((Resolve-Path $versionedSetup).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_PORTABLE=$versionedPortable" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Visible interactive setup: $(Split-Path $versionedSetup -Leaf)"
          Write-Host "Portable release asset: $(Split-Path $versionedPortable -Leaf)"

      - name: Verify public setup has visible UI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content 'windows/CubicalCompare.InstallerBootstrap/CubicalCompare.InstallerBootstrap.csproj' -Raw
          $source = Get-Content 'windows/CubicalCompare.InstallerBootstrap/Program.cs' -Raw
          if ($project -notmatch '<UseWindowsForms>true</UseWindowsForms>') {
            throw 'Public Cubical Compare Setup must use a visible Windows UI.'
          }
          if ($source -notmatch 'ShowInTaskbar\s*=\s*true') {
            throw 'Public Cubical Compare Setup must remain visible in the taskbar while installing.'
          }
          Write-Host 'Public setup source declares a visible installer window.'

      - name: Smoke test visible Cubical Compare installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          # Run exactly like a user double-clicking the public Setup.exe.
          $setupProcess = Start-Process -FilePath "$env:CC_SETUP" -PassThru

          $visible = $false
          for ($i = 0; $i -lt 15; $i++) {
            Start-Sleep -Seconds 1
            $setupProcess.Refresh()
            if ($setupProcess.HasExited) { break }
            if ($setupProcess.MainWindowHandle -ne 0) {
              $visible = $true
              break
            }
          }
          if (-not $visible) {
            if (-not $setupProcess.HasExited) { Stop-Process -Id $setupProcess.Id -Force -ErrorAction SilentlyContinue }
            throw 'Public Setup.exe never exposed a visible installer window.'
          }
          Write-Host "Visible Setup window detected (PID $($setupProcess.Id), HWND $($setupProcess.MainWindowHandle))."

          if (-not $setupProcess.WaitForExit(120000)) {
            Stop-Process -Id $setupProcess.Id -Force -ErrorAction SilentlyContinue
            throw 'Visible Cubical Compare Setup.exe did not finish within the installer smoke window.'
          }
          if ($setupProcess.ExitCode -ne 0) { throw "Visible Cubical Compare Setup.exe failed with exit code $($setupProcess.ExitCode)." }

          $installedExe = Join-Path $env:LOCALAPPDATA 'CubicalCompare\current\CubicalCompare.exe'
          if (-not (Test-Path $installedExe)) {
            $installedExe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'CubicalCompare') -Filter CubicalCompare.exe -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $installedExe -or -not (Test-Path $installedExe)) { throw 'Setup completed but the installed Cubical Compare executable was not found.' }

          $launched = $null
          for ($i = 0; $i -lt 15; $i++) {
            $launched = Get-Process CubicalCompare -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($launched) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $launched) { throw 'Visible setup completed but did not launch Cubical Compare.' }
          Write-Host "Visible setup auto-launched Cubical Compare (PID $($launched.Id))."
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $installedExe -ArgumentList '--ci-shell-smoke' -WorkingDirectory (Split-Path $installedExe) -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Installed Cubical Compare exited during smoke test with code $($process.ExitCode)." }
          Write-Host "Installed-app smoke passed (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force

      - name: Write SHA256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = Get-ChildItem artifacts/velopack -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content artifacts/velopack/SHA256SUMS.txt -Encoding ASCII

      - name: Upload verified Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: CubicalCompare-${{ env.CC_VERSION }}-windows-x64
          path: artifacts/velopack/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/windows/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $notes = @"
          ## Cubical Compare $env:CC_VERSION — Windows

          - Migrated to .NET 10 and Windows App SDK 2.4.
          - Certificate-free unpackaged WinUI 3 deployment.
          - Open-source Velopack Setup.exe and update packages.
          - Versioned portable Windows ZIP release asset; the app updater ignores GitHub's generated source-code archive.
          - Real modular assemblies: Core, Renderer, MegaPack, Thumbnail and Updates.
          - Developer Options are visible by default; bulk runtime C# source bundles are supported.
          - Live update-download and video-export activity watcher with real-time progress.
          - Dynamic Windows accent colouring, English regional variants, Mica surfaces and refreshed Settings.
          - Public Setup.exe always shows Cubical Compare's own visible progress window, closes without a success acknowledgement dialog, and launches Cubical Compare after installation.
          - Self-contained x64 build; no separate .NET or Windows App SDK runtime install is required.

          **Unsigned build note:** Windows SmartScreen may still warn on an unsigned download. No certificate is required to build, install or update Cubical Compare.
          "@

          gh release view "$env:CC_TAG" --repo RetroFrost/CTS 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "$env:CC_TAG" --repo RetroFrost/CTS --title "Cubical Compare $env:CC_VERSION — Windows" --notes "$notes" --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not update the GitHub release metadata.' }
          }
          else {
            gh release create "$env:CC_TAG" `
              --repo RetroFrost/CTS `
              --target "$env:GITHUB_SHA" `
              --title "Cubical Compare $env:CC_VERSION — Windows" `
              --notes "$notes" `
              --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the GitHub release.' }
          }

          $assets = @(
            Get-ChildItem artifacts/velopack -File | Where-Object {
              $_.Name -Like '*-Setup.exe' -or
              $_.Name -Like '*-Portable.zip' -or
              $_.Name -Like '*-full.nupkg' -or
              $_.Name -Like '*-delta.nupkg' -or
              $_.Name -Like 'releases.*.json' -or
              $_.Name -eq 'SHA256SUMS.txt'
            } | Sort-Object @{ Expression = {
              if ($_.Name -Like '*-Portable.zip') { 0 }
              elseif ($_.Name -Like '*-Setup.exe') { 1 }
              elseif ($_.Name -Like '*-full.nupkg') { 2 }
              elseif ($_.Name -Like '*-delta.nupkg') { 3 }
              elseif ($_.Name -Like 'releases.*.json') { 4 }
              else { 5 }
            } }
          )
          if ($assets.Count -eq 0) { throw 'No release assets were selected for upload.' }

          function Get-RemoteAsset([string]$name) {
            $releaseJson = gh api "repos/RetroFrost/CTS/releases/tags/$env:CC_TAG" 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseJson)) { return $null }
            $release = $releaseJson | ConvertFrom-Json
            return $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
          }

          $delays = @(5, 15, 30)
          foreach ($asset in $assets) {
            $uploaded = $false
            $localDigest = "sha256:" + (Get-FileHash -Algorithm SHA256 $asset.FullName).Hash.ToLowerInvariant()

            function Test-RemoteAssetMatch($remoteAsset, [int64]$expectedSize, [string]$expectedDigest) {
              return $null -ne $remoteAsset -and
                $remoteAsset.state -eq 'uploaded' -and
                [int64]$remoteAsset.size -eq $expectedSize -and
                -not [string]::IsNullOrWhiteSpace([string]$remoteAsset.digest) -and
                [string]::Equals([string]$remoteAsset.digest, $expectedDigest, [System.StringComparison]::OrdinalIgnoreCase)
            }

            for ($attempt = 1; $attempt -le 4; $attempt++) {
              $remote = Get-RemoteAsset $asset.Name
              if (Test-RemoteAssetMatch $remote ([int64]$asset.Length) $localDigest) {
                Write-Host "Release asset already verified by SHA-256: $($asset.Name)"
                $uploaded = $true
                break
              }

              if ($null -ne $remote) {
                $remoteDigest = if ([string]::IsNullOrWhiteSpace([string]$remote.digest)) { '<missing>' } else { [string]$remote.digest }
                Write-Warning "Removing stale/mismatched release asset: $($asset.Name) (remote digest $remoteDigest, local digest $localDigest)"
                gh api --method DELETE "repos/RetroFrost/CTS/releases/assets/$($remote.id)" 2>$null | Out-Null
              }

              Write-Host "Uploading $($asset.Name) (attempt $attempt/4)..."
              gh release upload "$env:CC_TAG" "$($asset.FullName)" --repo RetroFrost/CTS
              $uploadExit = $LASTEXITCODE

              $remote = Get-RemoteAsset $asset.Name
              if (Test-RemoteAssetMatch $remote ([int64]$asset.Length) $localDigest) {
                if ($uploadExit -eq 0) {
                  Write-Host "Verified release asset by SHA-256: $($asset.Name)"
                }
                else {
                  Write-Host "GitHub reported an upload error, but the SHA-256 digest is correct: $($asset.Name)"
                }
                $uploaded = $true
                break
              }

              if ($attempt -lt 4) {
                $delay = $delays[$attempt - 1]
                Write-Warning "Upload failed or digest mismatched for $($asset.Name); retrying in $delay seconds."
                Start-Sleep -Seconds $delay
              }
            }

            if (-not $uploaded) { throw "Release asset failed SHA-256 verification after 4 attempts: $($asset.Name)" }
          }
