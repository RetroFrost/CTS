name: Build Cubical Compare 4 Windows

on:
  push:
    branches:
      - windows/main
    paths:
      - 'windows/CubicalCompare/**'
      - '.github/workflows/build-cubical-compare-4-windows.yml'
  workflow_dispatch:

concurrency:
  group: cubical-compare-4-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create trusted CI signing identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=RetroFrost Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddDays(7)
          $cer = Join-Path $env:RUNNER_TEMP 'CubicalCompare-CI.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPeople' | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          "CC_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CC_CER=$cer" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Created CI signing identity $($cert.Thumbprint)."

      - name: Restore
        run: dotnet restore windows/CubicalCompare/CubicalCompare.csproj -r win-x64 -p:Platform=x64

      - name: Build signed single-project MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish windows/CubicalCompare/CubicalCompare.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="$env:CC_CERT_THUMBPRINT"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }

          $package = Get-ChildItem windows/CubicalCompare/AppPackages -Recurse -File | Where-Object { $_.Extension -in '.msix', '.appx' } | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $package) { throw 'MSIX packaging completed without producing an installable package.' }

          $signature = Get-AuthenticodeSignature -FilePath $package.FullName
          Write-Host "MSIX signature status: $($signature.Status); signer: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or $signature.SignerCertificate.Subject -ne 'CN=RetroFrost Development') {
            throw 'The generated MSIX is not validly signed by the expected Cubical Compare development identity.'
          }

          "CC_PACKAGE=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Package: $($package.FullName)"

      - name: Install packaged app for CI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-AppxPackage -Path "$env:CC_PACKAGE" -ForceApplicationShutdown
          $package = Get-AppxPackage -Name 'RetroFrost.CubicalCompare' | Sort-Object Version -Descending | Select-Object -First 1
          if (-not $package) { throw 'Cubical Compare package was not registered after Add-AppxPackage.' }
          Write-Host "Installed $($package.Name) $($package.Version) ($($package.PackageFullName))"
          "CC_PFN=$($package.PackageFamilyName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test installed WinUI startup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process CubicalCompare -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          [ComImport, Guid("2e941141-7f97-4756-ba1d-9decde894a3d")]
          internal class ApplicationActivationManager {}

          [ComImport, Guid("2e941141-7f97-4756-ba1d-9decde894a3d"), InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
          internal interface IApplicationActivationManager
          {
              int ActivateApplication(string appUserModelId, string arguments, uint options, out uint processId);
              int ActivateForFile(IntPtr appUserModelId, IntPtr itemArray, IntPtr verb, out uint processId);
              int ActivateForProtocol(IntPtr appUserModelId, IntPtr itemArray, out uint processId);
          }

          public static class PackagedAppLauncher
          {
              public static uint Activate(string appUserModelId)
              {
                  var manager = (IApplicationActivationManager)new ApplicationActivationManager();
                  uint processId;
                  int hr = manager.ActivateApplication(appUserModelId, null, 0, out processId);
                  if (hr < 0) Marshal.ThrowExceptionForHR(hr);
                  return processId;
              }
          }
          '@

          $aumid = "$env:CC_PFN!App"
          Write-Host "Activating $aumid"
          $pid = [PackagedAppLauncher]::Activate($aumid)
          if (-not $pid) { throw 'Package activation returned no process ID.' }
          Write-Host "Activation returned PID $pid."
          Start-Sleep -Seconds 10

          $process = Get-Process -Id $pid -ErrorAction SilentlyContinue
          if (-not $process) {
            Write-Host 'Cubical Compare exited during startup. Relevant Application events:'
            Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -match 'CubicalCompare|RetroFrost.CubicalCompare|Microsoft.UI.Xaml|WindowsAppSDK' } |
              Select-Object -First 30 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List | Out-String | Write-Host
            throw "Installed Cubical Compare package exited during startup (PID $pid)."
          }

          $logs = @(
            (Join-Path $env:LOCALAPPDATA 'CubicalCompare/startup.log'),
            (Join-Path $env:LOCALAPPDATA "Packages/$env:CC_PFN/LocalState/CubicalCompare/startup.log")
          ) | Where-Object { Test-Path $_ }
          foreach ($log in $logs) {
            $startup = Get-Content $log -Raw
            Write-Host "--- $log ---"
            $startup | Write-Host
            if ($startup -match 'startup failed|unhandled exception|Recovery window also failed') {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw 'Cubical Compare reached the recovery/crash path during packaged startup.'
            }
          }

          Write-Host "Packaged WinUI startup survived. PID $($process.Id)."
          Stop-Process -Id $process.Id -Force

      - name: Stage verified MSIX
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/CubicalCompare-4-MSIX -Force | Out-Null
          Copy-Item "$env:CC_PACKAGE" artifacts/CubicalCompare-4-MSIX/CubicalCompare-4-x64.msix
          Copy-Item "$env:CC_CER" artifacts/CubicalCompare-4-MSIX/CubicalCompare-Development.cer
          @'
          Cubical Compare 4 - verified development MSIX

          GitHub Actions built, signed, installed and launch-tested this exact packaged WinUI 3 application.
          The included short-lived certificate exists only so the isolated CI runner can validate package deployment.
          Public release builds must use RetroFrost's stable production signing identity.
          '@ | Set-Content artifacts/CubicalCompare-4-MSIX/README.txt

      - name: Upload verified Windows MSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CubicalCompare-4-win-x64-msix
          path: artifacts/CubicalCompare-4-MSIX/**
          if-no-files-found: error
          retention-days: 14
