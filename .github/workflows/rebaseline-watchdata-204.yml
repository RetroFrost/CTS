name: Rebaseline WatchData 2.0.4

on:
  push:
    branches:
      - hotfix/reference-fidelity-watchdata-font-2.0.4
    paths:
      - .github/workflows/rebaseline-watchdata-204.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Freeze corrected renderer baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/final-cross-platform-release.yml')
          text = path.read_text(encoding='utf-8')
          old = 'RENDERER_BASE: 485f64be1ad65764e72b3758d5f11c3666aa27c2'
          new = 'RENDERER_BASE: 0aabbdcc9118f8fd82876d8b8ec2ee54b0fcbeb6'
          if old not in text:
              raise SystemExit('old renderer baseline not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/rebaseline-watchdata-204.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Freeze corrected WatchData 2.0.4 renderer baseline'
          git push origin HEAD:hotfix/reference-fidelity-watchdata-font-2.0.4
