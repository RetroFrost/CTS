name: Integrate CTS 2.0 full-video reference match

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/integrate-cts2-reference-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Apply CTS 2.0 Cards workspace
        run: python tools/apply_cts2_cards_workspace.py

      - name: Remove abandoned video reconstruction
        run: python tools/remove_cts2_video_reconstruction.py

      - name: Seal reference model behaviour
        run: python tools/lock_android_reference_models.py

      - name: Normalize measured-pass compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_cts2_measured_reference_timeline.py')
          text = path.read_text()

          old = 'elif "shippedReferenceModelCannotBeRetimedOrReformattedByTheApp" not in pt:'
          new = 'elif "shippedReferenceModelCannotBeRetimedOrReformattedByTheApp" not in pt and "referenceModelRejectsCustomVideoFormatAndMode" not in pt:'
          text = text.replace(old, new, 1)

          old = '''if "private fun malesConveyorShift(" not in t:\n    t = insert_after(t, helper_marker, helpers, "males measured helpers")\n'''
          new = '''if "private fun malesConveyorShift(" not in t:\n    if helper_marker not in t:\n        raise SystemExit("males measured helpers: marker not found")\n    t = t.replace(helper_marker, helpers + helper_marker, 1)\n'''
          text = text.replace(old, new, 1)

          old = '''        return if (x < 0.5f) 4f * x * x * x else 1f - kotlin.math.pow(-2f * x + 2f, 3f) / 2f\n'''
          new = '''        val q = -2f * x + 2f\n        return if (x < 0.5f) 4f * x * x * x else 1f - q * q * q / 2f\n'''
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Apply whole-video measured clocks
        run: python tools/apply_cts2_measured_reference_timeline.py

      - name: Verify source invariants
        shell: bash
        run: |
          git diff --check
          grep -q 'versionCode = 20000' android/app/build.gradle.kts
          grep -q 'versionName = "2.0.0"' android/app/build.gradle.kts
          grep -q 'const val EXACT_REFERENCE_PLAYBACK_RATE = 1f' android/app/src/main/java/io/github/retrofrost/cts/android/timeline/TimelineEngine.kt
          grep -q 'MALES_STEADY_END_FRAME = 16_335' android/app/src/main/java/io/github/retrofrost/cts/android/timeline/TimelineEngine.kt
          grep -q 'MALES_OUTRO_START_FRAME = 16_372' android/app/src/main/java/io/github/retrofrost/cts/android/timeline/TimelineEngine.kt
          grep -q 'colors = titleFieldColors2()' android/app/src/main/java/io/github/retrofrost/cts/android/ui/CardsWorkspace2.kt
          grep -q 'focusedContainerColor = Color.White' android/app/src/main/java/io/github/retrofrost/cts/android/ui/CardsWorkspace2.kt
          grep -q 'focusedTextColor = Color.Black' android/app/src/main/java/io/github/retrofrost/cts/android/ui/CardsWorkspace2.kt
          grep -q 'modelMode = if (sealedReference) ModelMode.ExactReference else modelMode' android/app/src/main/java/io/github/retrofrost/cts/android/model/CtsProject.kt
          ! grep -q 'Reference settings' android/app/src/main/java/io/github/retrofrost/cts/android/ui/CardsWorkspace2.kt
          ! grep -q 'onChooseBackground' android/app/src/main/java/io/github/retrofrost/cts/android/ui/CardsWorkspace2.kt
          ! test -e android/app/src/main/java/io/github/retrofrost/cts/android/importer/VideoComparisonImporter.kt
          ! test -e android/app/src/main/java/io/github/retrofrost/cts/android/importer/VideoReconstructionWorker.kt
          ! test -e android/app/src/main/java/io/github/retrofrost/cts/android/ui/VideoReconstructionReview.kt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared contract
        run: python tools/sync_shared_contract.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build CTS 2.0.0 validation APK
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-reference-lock.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-reference-tests.log

      - name: Commit tested integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android tools/apply_cts2_cards_workspace.py tools/lock_android_reference_models.py tools/apply_cts2_measured_reference_timeline.py tools/remove_cts2_video_reconstruction.py
          if git diff --cached --quiet; then
            echo "Measured reference integration already committed"
          else
            git commit -m "Match CTS 2.0 to full reference video clocks"
            git pull --rebase origin android
            git push origin HEAD:android
          fi

      - name: Upload validation logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-2.0-full-reference-validation-logs
          path: |
            android/gradle-cts2-reference-lock.log
            android/gradle-cts2-reference-tests.log
          if-no-files-found: ignore
