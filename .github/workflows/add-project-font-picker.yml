name: Add project font picker

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - '.github/workflows/add-project-font-picker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Apply font picker
        run: python3 tools/add_project_font_picker.py

      - name: Verify source diff
        run: git diff --check

      - name: Unit tests, lint, release build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace --console=plain

      - name: Commit verified font picker
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/add-project-font-picker.yml
          rm tools/add_project_font_picker.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/io/github/retrofrost/cts/android/ProjectFontResolver.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/StudioProject.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/MainActivity.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/NativeFrameRenderer.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RelationshipsFrameRenderer.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RibbonFrameRenderer.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RelationshipsPrecisionFrameRenderer.kt \
                  .github/workflows/add-project-font-picker.yml \
                  tools/add_project_font_picker.py
          git commit -m 'android: add project font picker'
          git push origin HEAD:fork/2.0.7-renderer-bundles
