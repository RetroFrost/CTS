name: Integrate CTS 2.0 measured palette

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/integrate-cts2-palette.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  palette-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Apply measured reference palette
        run: python tools/apply_cts2_measured_palette.py

      - name: Regenerate shared contract adapters
        run: python tools/sync_shared_contract.py

      - name: Verify measured palette invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          R=android/app/src/main/java/io/github/retrofrost/cts/android/export/ReferenceFrameRenderer.kt
          P=android/app/src/main/java/io/github/retrofrost/cts/android/ui/ProgramMonitor.kt
          B=android/app/src/main/java/io/github/retrofrost/cts/android/render/ReferenceBadgePainter.kt
          grep -q 'Color.rgb(232, 230, 226)' "$R"
          grep -q 'Color.rgb(242, 242, 242)' "$R"
          grep -q 'Color.rgb(24, 24, 24)' "$R"
          grep -q 'Color.rgb(99, 94, 87)' "$R"
          grep -q 'Color.rgb(211, 8, 9)' "$B"
          grep -q 'Color.rgb(211, 15, 14)' "$B"
          grep -q 'Color.rgb(254, 186, 97)' "$B"
          grep -q 'Color(0xFFE8E6E2)' "$P"
          grep -q 'Color(0xFF181818)' "$P"
          grep -q 'Color(0xFFC06F00)' "$P"
          grep -q '"title_background": "#F2F2F2"' shared/cts_contract.json
          grep -q '"description_background": "#635E57"' shared/cts_contract.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared contract
        run: python tools/sync_shared_contract.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build measured-palette CTS
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-palette.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-palette-tests.log

      - name: Commit tested measured palette
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            shared/cts_contract.json \
            comparison_studio/shared_contract.py \
            android/app/src/main/java/io/github/retrofrost/cts/android/shared/SharedContract.kt \
            android/app/src/main/java/io/github/retrofrost/cts/android/export/ReferenceFrameRenderer.kt \
            android/app/src/main/java/io/github/retrofrost/cts/android/ui/ProgramMonitor.kt \
            android/app/src/main/java/io/github/retrofrost/cts/android/render/ReferenceBadgePainter.kt
          if git diff --cached --quiet; then
            echo "Measured palette already integrated"
          else
            git commit -m "Match CTS 2.0 reference palette to source video"
            git stash push --include-untracked -m cts-palette-ci-generated || true
            git pull --rebase origin android
            git push origin HEAD:android
            git stash pop || true
          fi

      - name: Upload validation logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-2.0-measured-palette-validation-logs
          path: |
            android/gradle-cts2-palette.log
            android/gradle-cts2-palette-tests.log
          if-no-files-found: ignore
