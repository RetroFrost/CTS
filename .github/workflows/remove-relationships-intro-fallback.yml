name: Remove relationships intro fallback

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - '.github/workflows/remove-relationships-intro-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Remove exact-v2 intro fallback
        run: python3 tools/disable_relationships_intro_fallback.py

      - name: Verify source diff
        run: git diff --check

      - name: Test and build release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Commit verified source change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remove-relationships-intro-fallback.yml
          rm tools/disable_relationships_intro_fallback.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/io/github/retrofrost/cts/android/RelationshipsPrecisionFrameRenderer.kt \
                  .github/workflows/remove-relationships-intro-fallback.yml \
                  tools/disable_relationships_intro_fallback.py
          git commit -m 'renderer: disable exact-v2 intro fallback by default'
          git push origin HEAD:fork/2.0.7-renderer-bundles

      - name: Package APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Cubical-Compare-2.0.7-Relationships-Exact-NoBrand.apk
          sha256sum Cubical-Compare-2.0.7-Relationships-Exact-NoBrand.apk > Cubical-Compare-2.0.7-Relationships-Exact-NoBrand.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-2.0.7-Relationships-Exact-NoBrand
          path: |
            Cubical-Compare-2.0.7-Relationships-Exact-NoBrand.apk
            Cubical-Compare-2.0.7-Relationships-Exact-NoBrand.apk.sha256
          if-no-files-found: error
          retention-days: 14
