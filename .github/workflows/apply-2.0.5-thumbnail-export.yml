name: Apply 2.0.5 thumbnail export

on:
  workflow_dispatch:
  push:
    branches:
      - feature/thumbnails-megapack-2.0.5
    paths:
      - tools/apply_205_thumbnail_export.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply source changes
        run: python tools/apply_205_thumbnail_export.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android native CMakeLists.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Add same-folder thumbnail export for 2.0.5'
          git push origin HEAD:feature/thumbnails-megapack-2.0.5
