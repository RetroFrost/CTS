name: Apply full Cubical Compare 1.0.1 source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-exact-reference-renderer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cubical-compare-1.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt pytest

      - name: Apply tested renderer, UI and bug-fix bundle
        shell: bash
        run: |
          cat .migration-data/exact-renderer-part0* | base64 -d > /tmp/exact-renderer-changes.tar.gz
          tar -xzf /tmp/exact-renderer-changes.tar.gz

      - name: Mark the complete native rebuild as 1.0.1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'CMakeLists.txt': [('project(CubicalCompare VERSION 1.0.0', 'project(CubicalCompare VERSION 1.0.1')],
              'native/windows/CubicalCompare.manifest': [('version="1.0.0.0"', 'version="1.0.1.0"')],
              'tests/test_release_identity.py': [('version="1.0.0.0"', 'version="1.0.1.0"')],
              'packaging/flatpak/io.github.retrofrost.CTS.metainfo.xml': [('<release version="1.0.0" date="2026-08-05">', '<release version="1.0.1" date="2026-08-06">')],
              'packaging/linux/control': [('Version: 1.0.0', 'Version: 1.0.1')],
              '.github/workflows/cubical-compare-release-ci.yml': [('      - v1.0.0*', '      - v1.0.*'), ('  VERSION: 1.0.0', '  VERSION: 1.0.1')],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)

          workflow = Path('.github/workflows/cubical-compare-release-ci.yml')
          text = workflow.read_text()
          build_old = '          cmake --build build-linux --parallel 2\n          test -x build-linux/cubical-compare\n'
          build_new = build_old + '          strings build-linux/cubical-compare | grep -F "Official model"\n          strings build-linux/cubical-compare | grep -F "Click to Insert Data"\n          strings build-linux/cubical-compare | grep -F "What Males Learn At Each Age"\n          strings build-linux/cubical-compare | grep -F "Types Of Relationships"\n'
          if build_old not in text:
              raise SystemExit('Native GTK build marker was not found')
          text = text.replace(build_old, build_new)
          stage_old = '          install -Dm644 README.md stage-linux/share/doc/cubical-compare/README.md\n          test -x stage-linux/bin/cubical-compare\n'
          stage_new = '          install -Dm644 README.md stage-linux/share/doc/cubical-compare/README.md\n          git rev-parse HEAD > stage-linux/share/doc/cubical-compare/BUILD-COMMIT\n          printf \'%s\\n\' "${VERSION}" > stage-linux/share/doc/cubical-compare/BUILD-VERSION\n          test -x stage-linux/bin/cubical-compare\n'
          if stage_old not in text:
              raise SystemExit('Linux staging marker was not found')
          workflow.write_text(text.replace(stage_old, stage_new))

          changelog = Path('CHANGELOG.md')
          entry = '# Cubical Compare 1.0.1\n\n- Rebuilt the GTK and Windows interfaces from the same source as the renderer.\n- Included the official model selector, locked output controls, UI bug fixes and exact-frame duration fixes.\n- Embedded build commit and version markers in Linux packages.\n\n'
          current = changelog.read_text()
          if not current.startswith('# Cubical Compare 1.0.1'):
              changelog.write_text(entry + current)
          PY

      - name: Verify engine, timing and native UI source
        shell: bash
        run: |
          PYTHONPATH=engine python -m pytest -q
          g++ -std=c++20 -I native/core/include -c native/core/src/project.cpp -o /tmp/project.o
          grep -F 'Official model' native/linux-gtk/main.cpp
          grep -F 'Click to Insert Data' native/linux-gtk/main.cpp
          grep -F 'What Males Learn At Each Age' native/linux-gtk/main.cpp
          grep -F 'Types Of Relationships' native/linux-gtk/main.cpp

      - name: Commit complete 1.0.1 source to release branch
        shell: bash
        run: |
          rm -rf .migration-data .github/workflows/apply-exact-reference-renderer.yml
          git config user.name RetroFrost
          git config user.email routerifter@gmail.com
          git add -A
          git commit -m "Rebuild full Cubical Compare 1.0.1 app"
          git push origin HEAD:release/cubical-compare-1.0
