name: Build full Cubical Compare 1.0.1 app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-exact-reference-renderer.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  build-full-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'trigger-full-app-1.0.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/cubical-compare-1.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install complete build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream binutils cmake desktop-file-utils dpkg-dev ffmpeg g++ \
            libgtk-4-dev ninja-build pkg-config xauth xvfb
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt

      - name: Build and verify complete application
        run: bash tools/build_full_app_1_0_1.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-1.0.1-Full-Linux-amd64
          path: |
            dist/Cubical-Compare-1.0.1-linux-amd64.deb
            dist/SHA256SUMS.txt
            engine-self-test/self-test.mp4
          if-no-files-found: error
