name: Build Windows C++ 3.0.300

on:
  push:
    branches:
      - windows/cpp-3.0.300
    paths:
      - CMakeLists.txt
      - native/**
      - engine/**
      - tools/patch_windows_cpp_engine.py
      - .github/workflows/build-windows-cpp-30300.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cts-windows-cpp-30300-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 3.0.300

jobs:
  windows:
    name: Native C++ Windows x64
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Verify 3.0.300 native source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Select-String -Path CMakeLists.txt -SimpleMatch 'project(CubicalCompare VERSION 3.0.300 LANGUAGES CXX)' | Out-Null
          Select-String -Path native/windows/main.cpp -SimpleMatch 'Cubical Compare 3.0.300' | Out-Null
          Select-String -Path native/core/src/project.cpp -SimpleMatch '\"version\": 6' | Out-Null
          Select-String -Path native/core/include/cubical/project.hpp -SimpleMatch 'badge_header' | Out-Null
          Select-String -Path native/core/include/cubical/project.hpp -SimpleMatch 'encoder_preference' | Out-Null
          Select-String -Path native/core/include/cubical/project.hpp -SimpleMatch 'intro_mode' | Out-Null

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-build.txt

      - name: Install renderer build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.Length -gt 1000000 } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $ffmpeg) { throw 'Could not locate FFmpeg.' }
          "CUBICAL_COMPARE_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Align renderer CCX bridge with project schema v6
        shell: pwsh
        run: |
          python tools/patch_windows_cpp_engine.py
          Select-String -Path engine/engine_cli.py -SimpleMatch 'badge_header=gets(f"card.{index}.badge_header")' | Out-Null

      - name: Build private exact renderer runtime
        working-directory: engine
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD"
          pyinstaller --noconfirm --clean cubical-compare-engine.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '.\dist\cubical-compare-engine\cubical-compare-engine.exe')) { throw 'Renderer executable missing.' }
          Copy-Item $env:CUBICAL_COMPARE_FFMPEG '.\dist\cubical-compare-engine\ffmpeg.exe' -Force

      - name: Configure and build C++ application
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '.\build-windows\Release\CubicalCompare.exe')) { throw 'CubicalCompare.exe missing.' }

      - name: Run packaged renderer smoke test
        shell: pwsh
        run: |
          $engine = "$PWD\engine\dist\cubical-compare-engine\cubical-compare-engine.exe"
          $env:CUBICAL_COMPARE_ENGINE = $engine
          $env:CUBICAL_COMPARE_FFMPEG = "$PWD\engine\dist\cubical-compare-engine\ffmpeg.exe"
          & .\build-windows\Release\CubicalCompare.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "dist\Cubical-Compare-$env:VERSION-Windows-x64"
          $archive = "dist\Cubical-Compare-$env:VERSION-Windows-x64.zip"
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$root\libexec\engine" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root\renderers" | Out-Null
          Copy-Item '.\build-windows\Release\CubicalCompare.exe' "$root\CubicalCompare.exe"
          Copy-Item '.\engine\dist\cubical-compare-engine\*' "$root\libexec\engine" -Recurse -Force
          Copy-Item README.md "$root\README.md"
          Copy-Item LICENSE "$root\LICENSE.txt"

          $env:CUBICAL_COMPARE_ENGINE = "$PWD\$root\libexec\engine\cubical-compare-engine.exe"
          $env:CUBICAL_COMPARE_FFMPEG = "$PWD\$root\libexec\engine\ffmpeg.exe"
          & "$root\CubicalCompare.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-Archive -Path $root -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  Cubical-Compare-$env:VERSION-Windows-x64.zip" | Set-Content "dist\Cubical-Compare-$env:VERSION-Windows-x64.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-3.0.300-Windows-Cpp-x64
          path: |
            dist/Cubical-Compare-3.0.300-Windows-x64.zip
            dist/Cubical-Compare-3.0.300-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
