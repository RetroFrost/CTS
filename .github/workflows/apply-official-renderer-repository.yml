name: Apply official renderer repository

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/apply-official-renderer-repository.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - name: Apply app wiring
        run: python3 tools/apply_official_renderer_repository.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Test and build Android
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Commit app feature
        run: |
          rm .github/workflows/apply-official-renderer-repository.yml tools/apply_official_renderer_repository.py
          git config user.name 'RetroFrost'
          git config user.email 'routerifter@gmail.com'
          git add android/app/src/main/java/io/github/retrofrost/cts/android/RendererRepositoryActivity.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RendererManagerActivity.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RendererBundle.kt \
                  android/app/src/main/AndroidManifest.xml \
                  .github/workflows/apply-official-renderer-repository.yml \
                  tools/apply_official_renderer_repository.py
          git commit -m 'android: add official renderer repository'
          git pull --rebase origin fork/2.0.7-renderer-bundles
          git push origin HEAD:fork/2.0.7-renderer-bundles
