name: CTS V5 Android M2 Renderer3 Preview

on:
  push:
    branches: [v5/development, v5/renderer3-android]
    paths:
      - 'android/**'
      - 'shared/**'
      - 'tools/sync_shared_contract.py'
      - '.github/workflows/v5-android-preview.yml'
  pull_request:
    branches: [v5/development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify shared Android/desktop contract
        run: python tools/sync_shared_contract.py --check
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 using runner command-line tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDK_MANAGER"
          ( set +o pipefail; yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null )
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run tests and build signed debug APK
        run: gradle --project-dir android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CTS-V5-Android-M2-Renderer3-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CTS-V5-Android-M2-Renderer3-debug
          path: CTS-V5-Android-M2-Renderer3-debug.apk
          if-no-files-found: error
      - name: Publish Android V5 prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/v5/development'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v5.0.0-android-m2-renderer3-preview.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Android M2 Renderer3 preview was already published; preserving its release assets."
            exit 0
          fi
          gh release create "$TAG" CTS-V5-Android-M2-Renderer3-debug.apk --target "$GITHUB_SHA" --title "Cubical Compare V5 Android M2 — Renderer3" --prerelease --notes "Native Android Renderer3 reader and scene playback for supported raster/vector/text scene-v3 packages, preview and MP4 export, with CRC/ZIP safety checks. SmartBadge/complex desktop Renderer3 features remain unsupported and show an import error. Debug signed APK; stable release signing is not configured."
