name: Cleanup obsolete Android tests
on:
  push:
    branches: [work/final-cross-platform-rebuild]
    paths:
      - .github/workflows/cleanup-final-android-tests.yml
      - .cleanup-final-android-tests-trigger
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/final-cross-platform-rebuild
      - name: Replace tests from deleted Android implementation
        run: |
          set -euo pipefail
          rm -rf android/app/src/test/java
          mkdir -p android/app/src/test/java/io/github/retrofrost/cts/android
          cat > android/app/src/test/java/io/github/retrofrost/cts/android/FinalArchitectureTest.kt <<'EOF'
          package io.github.retrofrost.cts.android

          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertFalse
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class FinalArchitectureTest {
              @Test
              fun releaseIdentityIsFinalTwoPointZero() {
                  assertEquals("2.0.0", BuildConfig.VERSION_NAME)
                  assertEquals(20000, BuildConfig.VERSION_CODE)
              }

              @Test
              fun projectDefaultsToTheVerifiedReferenceContract() {
                  val project = StudioProject()
                  assertEquals(1920, project.width)
                  assertEquals(1080, project.height)
                  assertEquals(60, project.fps)
                  assertTrue(project.showBadges)
                  assertTrue(project.creditsEnabled)
                  assertFalse(project.cards.isEmpty())
              }

              @Test
              fun cardModelKeepsReferenceBadgeValuesVerbatim() {
                  val card = StudioCard(title = "Reference", value = "7M YEARS AGO")
                  assertEquals("7M YEARS AGO", card.value)
              }
          }
          EOF
          rm -f .cleanup-final-android-tests-trigger .github/workflows/cleanup-final-android-tests.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace obsolete Android implementation tests"
          git push origin HEAD:work/final-cross-platform-rebuild
