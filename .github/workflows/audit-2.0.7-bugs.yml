name: Audit 2.0.7 app bugs

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - '.github/workflows/audit-2.0.7-bugs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Unit tests
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest --stacktrace --console=plain
      - name: Android lint
        run: android/gradlew -p android :app:lintDebug --stacktrace --console=plain
      - name: Release compile
        run: android/gradlew -p android :app:assembleRelease --stacktrace --console=plain
