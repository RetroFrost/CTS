name: Apply WatchData 2.0.4 audit fixes

on:
  push:
    branches:
      - hotfix/reference-fidelity-watchdata-font-2.0.4
    paths:
      - .github/workflows/apply-watchdata-204-audit-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply measured audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          renderer_paths = [
              Path('engine/ccengine/watchdata_renderer.py'),
              Path('android/app/src/main/python/ccengine/watchdata_renderer.py'),
          ]
          for path in renderer_paths:
              text = path.read_text(encoding='utf-8')
              old = 'settled = age >= (_base.SHINE_START + _base.SHINE_SECONDS + 1e-6)'
              new = 'settled = age >= (_base.SHINE_START + _base.SHINE_SECONDS - 1e-6)'
              if old not in text:
                  raise SystemExit(f'missing shine boundary in {path}')
              text = text.replace(old, new, 1)
              old = 'heading = self._font_from_bundle(POPPINS_EXTRA_BOLD, 50, fallback_bold=True)'
              new = 'heading = self._font_from_bundle(POPPINS_MEDIUM, 50, fallback_bold=False)'
              if old not in text:
                  raise SystemExit(f'missing credits heading font in {path}')
              text = text.replace(old, new, 1)
              old = '        y = 388\n        for role_text, value_text in rows:'
              new = '        y = 410\n        for role_text, value_text in rows:'
              if old not in text:
                  raise SystemExit(f'missing credits row start in {path}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          app = Path('android/app/src/main/java/io/github/retrofrost/cts/android/FinalStudioApp.kt')
          text = app.read_text(encoding='utf-8')
          text = text.replace('Cubical-Compare-2.0.3.mp4', 'Cubical-Compare-2.0.4.mp4')
          app.write_text(text, encoding='utf-8')

          # The one-shot workflow must not remain in the release tree.
          Path('.github/workflows/apply-watchdata-204-audit-fixes.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix settled shine and WatchData credits audit drift'
          git push origin HEAD:hotfix/reference-fidelity-watchdata-font-2.0.4
