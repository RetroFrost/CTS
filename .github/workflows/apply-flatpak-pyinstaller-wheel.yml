name: Apply Flatpak PyInstaller wheel

on:
  workflow_dispatch:
  push:
    branches:
      - release/cubical-compare-1.0
    paths:
      - .github/workflows/apply-flatpak-pyinstaller-wheel.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/cubical-compare-1.0
          fetch-depth: 0

      - name: Replace PyInstaller source archive with official Linux wheel
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('packaging/flatpak/python3-cubical-compare-engine.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          wheel_url = (
              'https://files.pythonhosted.org/packages/9f/09/'
              '51b8905714b733bac66dbc041a7821372d70d888d273ae474c4037d4202d/'
              'pyinstaller-6.21.0-py3-none-manylinux2014_x86_64.whl'
          )
          wheel_sha256 = '605169523a6b5ace39f13dfbff21add9f2bc43df99c7daf9394fefb2c45e8b6f'
          found_module = False
          replaced = False
          for module in payload.get('modules', []):
              if module.get('name') != 'python3-PyInstaller':
                  continue
              found_module = True
              for source in module.get('sources', []):
                  url = source.get('url', '')
                  if url.endswith('pyinstaller-6.21.0.tar.gz'):
                      source['url'] = wheel_url
                      source['sha256'] = wheel_sha256
                      replaced = True
                  elif url.endswith('pyinstaller-6.21.0-py3-none-manylinux2014_x86_64.whl'):
                      source['sha256'] = wheel_sha256
              module['build-commands'] = [
                  command.replace(
                      '"PyInstaller==6.21.0" --no-build-isolation',
                      '"PyInstaller==6.21.0" --only-binary=PyInstaller --no-build-isolation',
                  )
                  for command in module.get('build-commands', [])
              ]
          if not found_module:
              raise SystemExit('python3-PyInstaller module was not found.')
          current = json.dumps(payload, indent=4) + '\n'
          if 'pyinstaller-6.21.0.tar.gz' in current:
              raise SystemExit('PyInstaller source archive remains after patch.')
          if wheel_url not in current or wheel_sha256 not in current:
              raise SystemExit('Pinned PyInstaller wheel was not installed into the manifest.')
          path.write_text(current, encoding='utf-8')
          print('replaced source archive:', replaced)
          PY

      - name: Commit pinned wheel
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/flatpak/python3-cubical-compare-engine.json
          if git diff --cached --quiet; then
            echo 'Official PyInstaller wheel is already pinned.'
            exit 0
          fi
          git commit -m 'Use official PyInstaller Linux wheel for Flatpak'
          git push origin HEAD:release/cubical-compare-1.0
