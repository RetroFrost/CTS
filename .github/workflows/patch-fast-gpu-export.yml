name: Patch fast GPU export

on:
  push:
    branches: [fork/2.0.7-renderer-bundles]
    paths: [.github/workflows/patch-fast-gpu-export.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
      - name: Patch bitmap-to-GPU hot path
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/java/io/github/retrofrost/cts/android/HardwareVideoExporter.kt')
          s = p.read_text()

          def rep(old, new):
              global s
              assert s.count(old) == 1, old[:80]
              s = s.replace(old, new, 1)

          rep('import android.opengl.GLES20\n', 'import android.opengl.GLES20\nimport android.opengl.GLUtils\n')

          rep('''                val rgba = RendererBridge.renderRgba(project, frame, width, height)
                require(rgba.size == width * height * 4) { "Renderer returned an invalid RGBA frame." }
                egl.draw(rgba, frame * 1_000_000_000L / fps)
''', '''                val bitmap = RendererBridge.render(project, frame, width, height)
                try {
                    require(bitmap.width == width && bitmap.height == height) { "Renderer returned an invalid frame size." }
                    egl.draw(bitmap, frame * 1_000_000_000L / fps)
                } finally {
                    bitmap.recycle()
                }
''')

          rep('''    private val program: Int
    private val texture: Int
''', '''    private val program: Int
    private val texture: Int
    private val positionLocation: Int
    private val texCoordLocation: Int
    private val textureUniformLocation: Int
''')

          rep('''        GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
        GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
        glRenderer = GLES20.glGetString(GLES20.GL_RENDERER) ?: "Phone GPU"
''', '''        GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
        GLES20.glTexParameteri(GLES20.GL_TEXTURE_2D, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
        // Allocate texture storage once. Per-frame glTexImage2D forced the driver to
        // recreate a full 1080p texture every frame.
        GLES20.glTexImage2D(
            GLES20.GL_TEXTURE_2D, 0, GLES20.GL_RGBA, width, height, 0,
            GLES20.GL_RGBA, GLES20.GL_UNSIGNED_BYTE, null,
        )
        positionLocation = GLES20.glGetAttribLocation(program, "aPosition")
        texCoordLocation = GLES20.glGetAttribLocation(program, "aTexCoord")
        textureUniformLocation = GLES20.glGetUniformLocation(program, "uTexture")
        glRenderer = GLES20.glGetString(GLES20.GL_RENDERER) ?: "Phone GPU"
''')

          start = s.index('    fun draw(rgba: ByteArray, presentationNanos: Long) {')
          end = s.index('\n    fun release() {', start)
          old = s[start:end]
          new = '''    fun draw(bitmap: android.graphics.Bitmap, presentationNanos: Long) {
        GLES20.glViewport(0, 0, width, height)
        GLES20.glUseProgram(program)
        GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, texture)
        GLES20.glPixelStorei(GLES20.GL_UNPACK_ALIGNMENT, 1)
        // GLUtils uploads the Bitmap through Android's native graphics path, avoiding
        // an ~8 MB RGBA ByteArray allocation/copy for every 1080p frame.
        GLUtils.texSubImage2D(GLES20.GL_TEXTURE_2D, 0, 0, 0, bitmap)
        vertices.position(0)
        GLES20.glVertexAttribPointer(positionLocation, 2, GLES20.GL_FLOAT, false, 16, vertices)
        GLES20.glEnableVertexAttribArray(positionLocation)
        vertices.position(2)
        GLES20.glVertexAttribPointer(texCoordLocation, 2, GLES20.GL_FLOAT, false, 16, vertices)
        GLES20.glEnableVertexAttribArray(texCoordLocation)
        GLES20.glUniform1i(textureUniformLocation, 0)
        GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
        EGLExt.eglPresentationTimeANDROID(display, eglSurface, presentationNanos)
        check(EGL14.eglSwapBuffers(display, eglSurface)) { "The GPU encoder surface stopped responding." }
    }
'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "RetroFrost CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-fast-gpu-export.yml
          git add android/app/src/main/java/io/github/retrofrost/cts/android/HardwareVideoExporter.kt
          git commit -m "Remove RGBA copy from GPU export hot path"
          git push origin HEAD:fork/2.0.7-renderer-bundles
