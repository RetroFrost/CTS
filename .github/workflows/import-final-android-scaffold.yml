name: Import final Android scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - work/final-cross-platform-rebuild
    paths:
      - .github/workflows/import-final-android-scaffold.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/final-cross-platform-rebuild
          fetch-depth: 0
      - name: Import Android build scaffold only
        run: |
          set -euo pipefail
          git fetch origin android
          git checkout origin/android -- android
          rm -rf android/.gradle android/app/build android/build
          find android -type d -name .gradle -prune -exec rm -rf {} + || true
          git add android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Android build scaffold for final rebuild" || exit 0
          git push origin HEAD:work/final-cross-platform-rebuild
