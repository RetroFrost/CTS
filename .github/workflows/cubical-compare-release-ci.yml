name: Cubical Compare release CI

on:
  workflow_dispatch:
  push:
    branches:
      - release/cubical-compare-1.0
    tags:
      - v1.0.0*
    paths:
      - CMakeLists.txt
      - native/**
      - engine/**
      - tests/**
      - packaging/**
      - .github/workflows/cubical-compare-release-ci.yml

permissions:
  contents: read

concurrency:
  group: cubical-compare-release-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.0.0

jobs:
  linux:
    name: Linux amd64 packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-build.txt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream cmake desktop-file-utils dpkg-dev ffmpeg g++ \
            libgtk-4-dev ninja-build pkg-config xvfb
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt

      - name: Validate canonical source and metadata
        run: |
          test -f .materialized-source
          test -f engine/cubical-compare-engine.spec
          test -f native/linux-gtk/main.cpp
          test -f native/windows/main.cpp
          test -f packaging/flatpak/io.github.retrofrost.CubicalCompare.metainfo.xml
          if grep -R --line-number --exclude-dir=.git \
            -E 'Cubical Create|cubical-create-engine|CUBICAL_CREATE_ENGINE|CubicalCreate' \
            native engine tests packaging CMakeLists.txt README.md; then
            echo 'Legacy product identifiers remain in the canonical source.' >&2
            exit 1
          fi
          grep -R --line-number 'CCX1' native engine tests >/dev/null
          desktop-file-validate packaging/flatpak/io.github.retrofrost.CubicalCompare.desktop
          appstreamcli validate --no-net packaging/flatpak/io.github.retrofrost.CubicalCompare.metainfo.xml

      - name: Test Python rendering engine
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
          CUBICAL_COMPARE_FFMPEG: /usr/bin/ffmpeg
        run: |
          pytest -q
          python -m compileall -q engine

      - name: Build private one-directory engine
        working-directory: engine
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          pyinstaller --noconfirm --clean cubical-compare-engine.spec
          test -x dist/cubical-compare-engine/cubical-compare-engine
          test -d dist/cubical-compare-engine/_internal

      - name: Run packaged engine self-test
        env:
          CUBICAL_COMPARE_FFMPEG: /usr/bin/ffmpeg
        run: |
          rm -rf engine-self-test
          engine/dist/cubical-compare-engine/cubical-compare-engine \
            self-test --directory engine-self-test
          test -s engine-self-test/self-test.mp4
          test -s engine-self-test/self-test.png
          test -s engine-self-test/self-test.bmp
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 engine-self-test/self-test.mp4

      - name: Build native GTK application
        run: |
          cmake -S . -B build-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-linux --parallel 2
          test -x build-linux/cubical-compare

      - name: Run native application self-test
        env:
          CUBICAL_COMPARE_ENGINE: ${{ github.workspace }}/engine/dist/cubical-compare-engine/cubical-compare-engine
          CUBICAL_COMPARE_FFMPEG: /usr/bin/ffmpeg
        run: |
          xvfb-run -a ./build-linux/cubical-compare --self-test

      - name: Stage portable Linux application
        run: |
          rm -rf stage-linux dist
          cmake --install build-linux --prefix "$PWD/stage-linux"
          install -d stage-linux/libexec/cubical-compare/engine
          cp -a engine/dist/cubical-compare-engine/. \
            stage-linux/libexec/cubical-compare/engine/
          install -Dm644 README.md stage-linux/share/doc/cubical-compare/README.md
          test -x stage-linux/bin/cubical-compare
          test -x stage-linux/libexec/cubical-compare/engine/cubical-compare-engine

          rm -rf staged-self-test
          CUBICAL_COMPARE_FFMPEG=/usr/bin/ffmpeg \
            xvfb-run -a stage-linux/bin/cubical-compare --self-test

          mkdir -p dist/Cubical-Compare-${VERSION}-linux-amd64
          cp -a stage-linux/. dist/Cubical-Compare-${VERSION}-linux-amd64/
          tar -C dist -czf dist/Cubical-Compare-${VERSION}-linux-amd64.tar.gz \
            Cubical-Compare-${VERSION}-linux-amd64

      - name: Build Debian package
        run: |
          rm -rf deb-root
          mkdir -p deb-root/DEBIAN deb-root/usr
          cp -a stage-linux/. deb-root/usr/
          cat > deb-root/DEBIAN/control <<EOF
          Package: cubical-compare
          Version: ${VERSION}
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: RetroFrost
          Depends: ffmpeg, libgtk-4-1
          Description: Native comparison-video editor
           Cubical Compare imports spreadsheet data, edits comparison cards,
           previews the final animation and exports MP4 video through its
           privately bundled rendering engine.
          EOF
          dpkg-deb --build --root-owner-group deb-root \
            dist/Cubical-Compare-${VERSION}-linux-amd64.deb
          dpkg-deb --info dist/Cubical-Compare-${VERSION}-linux-amd64.deb
          dpkg-deb --contents dist/Cubical-Compare-${VERSION}-linux-amd64.deb | \
            grep 'usr/libexec/cubical-compare/engine/cubical-compare-engine'

      - name: Create source archive and checksums
        run: |
          git archive --format=zip \
            --output=dist/Cubical-Compare-${VERSION}-source.zip HEAD
          cd dist
          sha256sum \
            Cubical-Compare-${VERSION}-linux-amd64.tar.gz \
            Cubical-Compare-${VERSION}-linux-amd64.deb \
            Cubical-Compare-${VERSION}-source.zip > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-${{ env.VERSION }}-Linux-amd64
          path: |
            dist/Cubical-Compare-${{ env.VERSION }}-linux-amd64.tar.gz
            dist/Cubical-Compare-${{ env.VERSION }}-linux-amd64.deb
            dist/Cubical-Compare-${{ env.VERSION }}-source.zip
            dist/SHA256SUMS-linux.txt
          if-no-files-found: error

  windows:
    name: Windows x64 portable package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-build.txt

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction Stop
          "CUBICAL_COMPARE_FFMPEG=$($ffmpeg.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test Python rendering engine
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\engine"
          pytest -q
          python -m compileall -q engine

      - name: Build private one-directory engine
        working-directory: engine
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD"
          pyinstaller --noconfirm --clean cubical-compare-engine.spec
          $engine = '.\dist\cubical-compare-engine\cubical-compare-engine.exe'
          if (-not (Test-Path $engine)) { throw 'Private engine executable was not produced.' }
          if (-not (Test-Path '.\dist\cubical-compare-engine\_internal')) { throw 'Private engine runtime directory was not produced.' }
          Copy-Item $env:CUBICAL_COMPARE_FFMPEG '.\dist\cubical-compare-engine\ffmpeg.exe' -Force

      - name: Run packaged engine self-test
        shell: pwsh
        run: |
          Remove-Item engine-self-test -Recurse -Force -ErrorAction SilentlyContinue
          & .\engine\dist\cubical-compare-engine\cubical-compare-engine.exe \
            self-test --directory engine-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path engine-self-test\self-test.mp4)) { throw 'Engine self-test MP4 is missing.' }
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 engine-self-test\self-test.mp4

      - name: Build native Windows application
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64
          cmake --build build-windows --config Release --parallel 2
          if (-not (Test-Path '.\build-windows\Release\CubicalCompare.exe')) {
            throw 'CubicalCompare.exe was not produced.'
          }

      - name: Run native application self-test
        shell: pwsh
        run: |
          $env:CUBICAL_COMPARE_ENGINE = "$PWD\engine\dist\cubical-compare-engine\cubical-compare-engine.exe"
          & .\build-windows\Release\CubicalCompare.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "dist\Cubical-Compare-$env:VERSION-windows-x64"
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path "$root\libexec\engine" -Force | Out-Null
          Copy-Item '.\build-windows\Release\CubicalCompare.exe' "$root\CubicalCompare.exe"
          Copy-Item '.\engine\dist\cubical-compare-engine\*' "$root\libexec\engine" -Recurse -Force
          Copy-Item README.md "$root\README.md"
          Copy-Item LICENSE "$root\LICENSE.txt"

          $env:CUBICAL_COMPARE_ENGINE = "$PWD\$root\libexec\engine\cubical-compare-engine.exe"
          & "$root\CubicalCompare.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-Archive -Path $root \
            -DestinationPath "dist\Cubical-Compare-$env:VERSION-windows-x64.zip" -Force
          $hash = (Get-FileHash "dist\Cubical-Compare-$env:VERSION-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Cubical-Compare-$env:VERSION-windows-x64.zip" | \
            Set-Content dist\SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-${{ env.VERSION }}-Windows-x64
          path: |
            dist/Cubical-Compare-${{ env.VERSION }}-windows-x64.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
