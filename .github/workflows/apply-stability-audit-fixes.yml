name: Apply 2.0.7 stability audit fixes

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - '.github/workflows/apply-stability-audit-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Apply audited stability fixes
        run: |
          python3 tools/apply_stability_audit_fixes.py
          sed -i '/import kotlinx.coroutines.launch/a import kotlinx.coroutines.flow.asStateFlow' android/app/src/main/java/io/github/retrofrost/cts/android/ExportService.kt

      - name: Verify source diff
        run: git diff --check

      - name: Unit tests, lint, release build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace --console=plain

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-stability-audit-fixes.yml
          rm -f .github/workflows/audit-2.0.7-bugs.yml
          rm -f tools/apply_stability_audit_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'android: harden 2.0.7 after full app audit'
          git push origin HEAD:fork/2.0.7-renderer-bundles

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk Cubical-Compare-2.0.7-Audited.apk
          sha256sum Cubical-Compare-2.0.7-Audited.apk > Cubical-Compare-2.0.7-Audited.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-2.0.7-Audited
          path: |
            Cubical-Compare-2.0.7-Audited.apk
            Cubical-Compare-2.0.7-Audited.apk.sha256
          if-no-files-found: error
          retention-days: 14
