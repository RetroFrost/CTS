name: Apply Android title field contrast

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/apply-android-readable-text-fields.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Keep white background only on Title and bump alpha
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt')
          text = ui.read_text()

          color_line = '                    colors = readableOutlinedTextFieldColors(),\n'
          text = text.replace(color_line, '')

          title_anchor = '                    label = { Text("Title") },\n                    modifier = Modifier\n'
          title_replacement = '                    label = { Text("Title") },\n                    colors = readableOutlinedTextFieldColors(),\n                    modifier = Modifier\n'
          if title_anchor not in text:
              raise SystemExit('Title field anchor not found')
          text = text.replace(title_anchor, title_replacement, 1)

          if text.count('colors = readableOutlinedTextFieldColors()') != 1:
              raise SystemExit('Expected exactly one readable field color override')
          if 'label = { Text("Title") },\n                    colors = readableOutlinedTextFieldColors(),' not in text:
              raise SystemExit('White field override is not attached to Title')

          ui.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          g = gradle.read_text()
          g = g.replace('versionCode = 8', 'versionCode = 9', 1)
          g = g.replace('versionName = "0.3.0-alpha8"', 'versionName = "0.3.0-alpha9"', 1)
          if 'versionCode = 9' not in g or 'versionName = "0.3.0-alpha9"' not in g:
              raise SystemExit('Could not set alpha9 version')
          gradle.write_text(g)
          PY

          git diff --check
          git diff -- android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt android/app/build.gradle.kts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared contract
        run: python tools/sync_shared_contract.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build alpha9 debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android/gradle-build.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee android/gradle-test.log

      - name: Commit tested fix to android
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt android/app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "Fix already applied"
          else
            git commit -m "Limit white background to Android title field"
            git push origin HEAD:android
          fi

      - name: Upload alpha9 APK
        uses: actions/upload-artifact@v4
        with:
          name: CTS-Android-alpha9-title-field
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-Android-alpha9-build-logs
          path: |
            android/gradle-build.log
            android/gradle-test.log
          if-no-files-found: ignore
