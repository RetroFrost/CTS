name: Build Cubical Compare 3.0.300 Renderer v3

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/build-v30300-renderer-v3.yml
      - tools/fix_v30300_renderer_v3_identity.py
      - android/app/src/test/java/io/github/retrofrost/cts/android/RendererV3CompatibilityTest.kt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-v30300-renderer-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify 3.0.300 Renderer v3 contract
        run: python tools/fix_v30300_renderer_v3_identity.py

      - name: Unit test compatibility and build APKs
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Stage named APKs and checksums
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Cubical-Compare-3.0.300-Renderer-v3-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist/Cubical-Compare-3.0.300-Renderer-v3-release.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APK bundle
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-3.0.300-Renderer-v3
          path: dist/*
          if-no-files-found: error

      - name: Persist corrected built-in identity
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/io/github/retrofrost/cts/android/RendererBundle.kt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix Cubical Compare 3.0.300 Renderer v3 identity'
          git push origin HEAD:fork/2.0.7-renderer-bundles
