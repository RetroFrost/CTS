name: Apply release CI PowerShell fix

on:
  workflow_dispatch:
  push:
    branches:
      - release/cubical-compare-1.0
    paths:
      - .github/workflows/apply-release-ci-powershell-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/cubical-compare-1.0
          fetch-depth: 0

      - name: Correct native-command failure handling and continuations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/cubical-compare-release-ci.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''          $env:PYTHONPATH = "$PWD\\engine"\n          pytest -q\n          python -m compileall -q engine\n''':
              '''          $env:PYTHONPATH = "$PWD\\engine"\n          pytest -q\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n          python -m compileall -q engine\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n''',
              '''          & .\\engine\\dist\\cubical-compare-engine\\cubical-compare-engine.exe \\\n            self-test --directory engine-self-test\n''':
              '''          & .\\engine\\dist\\cubical-compare-engine\\cubical-compare-engine.exe self-test --directory engine-self-test\n''',
              '''          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height \\\n            -of default=noprint_wrappers=1 engine-self-test\\self-test.mp4\n''':
              '''          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 engine-self-test\\self-test.mp4\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n''',
              '''          Compress-Archive -Path $root \\\n            -DestinationPath "dist\\Cubical-Compare-$env:VERSION-windows-x64.zip" -Force\n''':
              '''          Compress-Archive -Path $root -DestinationPath "dist\\Cubical-Compare-$env:VERSION-windows-x64.zip" -Force\n''',
              '''          "$hash  Cubical-Compare-$env:VERSION-windows-x64.zip" | \\\n            Set-Content dist\\SHA256SUMS-windows.txt\n''':
              '''          "$hash  Cubical-Compare-$env:VERSION-windows-x64.zip" | Set-Content dist\\SHA256SUMS-windows.txt\n''',
          }
          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Expected workflow fragment was not found:\n{old}')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cubical-compare-release-ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix Windows release CI command handling'
          git push origin HEAD:release/cubical-compare-1.0
