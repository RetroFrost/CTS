name: Build Cubical Create Alpha 21 Windows Parity

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'alpha21-overlay.b64.part*'
      - '.github/workflows/build-cubical-create-alpha21.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 parity and fast export
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore verified Alpha 20 engine-launch source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item source -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory source | Out-Null

          $alpha18Parts = Get-ChildItem cubical-create-alpha18-source.b64.part* |
            Where-Object { $_.Name -match '^cubical-create-alpha18-source\.b64\.part\d+$' } |
            Sort-Object { [int]([regex]::Match($_.Name, 'part(\d+)$').Groups[1].Value) }
          if ($alpha18Parts.Count -ne 5) { throw "Expected 5 Alpha 18 chunks, found $($alpha18Parts.Count)." }
          $encoded = ($alpha18Parts | ForEach-Object { (Get-Content $_.FullName -Raw) -replace '\s','' }) -join ''
          $archive = "$env:RUNNER_TEMP\alpha18.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'f77790798c92e8a75dfdc84281aeb1addfb6332b887a45bb0e321d8ff4a5b48e') { throw 'Alpha 18 checksum mismatch.' }
          Expand-Archive $archive source -Force
          python alpha18-compiler-fixes.py source

          $names = 0..11 | ForEach-Object { 'alpha19-overlay5.part{0:D2}' -f $_ }
          $encoded = ($names | ForEach-Object { (Get-Content $_ -Raw) -replace '\s','' }) -join ''
          $archive = "$env:RUNNER_TEMP\alpha19-overlay.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'da9f2ebe57e55b46466bada594197b110d3a5ac1569e9d4ec7f22bddf906448e') { throw 'Alpha 19 checksum mismatch.' }
          Expand-Archive $archive source -Force

          $names = @(
            'alpha20-overlay.part00',
            'alpha20-fix01.part00', 'alpha20-fix01.part01', 'alpha20-fix01.part02',
            'alpha20-overlay.part02',
            'alpha20-fix03.part00', 'alpha20-fix03.part01', 'alpha20-fix03.part02',
            'alpha20-overlay.part04'
          )
          $encoded = ($names | ForEach-Object { (Get-Content $_ -Raw) -replace '\s','' }) -join ''
          $archive = "$env:RUNNER_TEMP\alpha20-overlay.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '00c7161d0ff5abe872e3d88d9f31667d07a3fba0525f71e1bf21c99f3cef566d') { throw 'Alpha 20 checksum mismatch.' }
          Expand-Archive $archive source -Force

          python alpha20-idle-startup-fix.py source
          Select-String -Path source\native\core\src\process.cpp -Pattern 'CreateProcessW'
          Select-String -Path source\native\windows\main.cpp -SimpleMatch 'load_project(s);reset_player(s);SetTimer'

      - name: Apply Alpha 21 Linux parity and export-speed update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = 0..3 | ForEach-Object { 'alpha21-overlay.b64.part{0:D2}' -f $_ }
          foreach ($name in $names) {
            if (-not (Test-Path $name)) { throw "Missing Alpha 21 chunk: $name" }
          }
          $encoded = ($names | ForEach-Object { (Get-Content $_ -Raw) -replace '\s','' }) -join ''
          $archive = "$env:RUNNER_TEMP\alpha21-overlay.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne '49a92733bb2ba5622b42b746a065aeabdbf0095ca23c42600c12cfdda38513be') {
            throw "Alpha 21 checksum mismatch: $actual"
          }
          Expand-Archive $archive source -Force

          Select-String -Path source\engine\engine_cli.py -SimpleMatch '0.2.6-alpha21'
          Select-String -Path source\engine\ccengine\renderer.py -SimpleMatch '_free_transform_artwork'
          Select-String -Path source\engine\ccengine\exporter.py -SimpleMatch 'ultrafast'
          Select-String -Path source\native\windows\main.cpp -SimpleMatch 'Image transform'
          Select-String -Path source\native\windows\main.cpp -SimpleMatch 'PreviewSubclassProc'
          Select-String -Path source\native\core\src\process.cpp -Pattern 'CreateProcessW'

      - name: Install FFmpeg and engine dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg -y --no-progress
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -File -Filter 'ffmpeg.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 1000000 } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $ffmpeg) { throw 'Could not locate the real FFmpeg executable.' }
          "FFMPEG_PATH=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          python -m pip install --upgrade pip -q
          pip install -q -r source\engine\requirements.txt pyinstaller pytest

      - name: Test transform, renderer, and fast export
        working-directory: source
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\engine"
          pytest -q

      - name: Bundle and self-test engine
        working-directory: source
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\engine"
          Push-Location engine
          pyinstaller --noconfirm --clean cubical-create-engine.spec | Out-Null
          Copy-Item $env:FFMPEG_PATH .\dist\ffmpeg.exe -Force
          $selfTest = "$env:RUNNER_TEMP\alpha21-engine-self-test"
          & .\dist\cubical-create-engine.exe self-test --directory $selfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$selfTest\self-test.mp4")) { throw 'Engine self-test did not create MP4.' }
          Pop-Location

      - name: Compile and test Windows editor
        working-directory: source
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --parallel 2
          $env:CUBICAL_CREATE_ENGINE = "$PWD\engine\dist\cubical-create-engine.exe"
          & .\build\Release\CubicalCreate.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Alpha 21 Windows build and source
        working-directory: source
        shell: pwsh
        run: |
          $version = '0.2.6-alpha21'
          $root = "Cubical-Create-$version-windows-x64"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item .\build\Release\CubicalCreate.exe "$root\CubicalCreate.exe"
          Copy-Item .\engine\dist\cubical-create-engine.exe "$root\cubical-create-engine.exe"
          Copy-Item .\engine\dist\ffmpeg.exe "$root\ffmpeg.exe"
          Copy-Item .\README.md "$root\README.md"
          Compress-Archive -Path $root -DestinationPath "Cubical-Create-$version-windows-x64.zip" -Force
          Compress-Archive -Path @('native','engine','tests','packaging','CMakeLists.txt','README.md') -DestinationPath "Cubical-Create-$version-source.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Create-0.2.6-alpha21-Windows-x64
          path: |
            source/Cubical-Create-0.2.6-alpha21-windows-x64.zip
            source/Cubical-Create-0.2.6-alpha21-source.zip
          if-no-files-found: error
