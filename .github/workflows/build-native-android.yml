name: Build Cubical Compare Native

on:
  push:
    branches:
      - rewrite/native-ctr-thumbnails
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build native APK
        shell: bash
        run: gradle --project-dir native-android :app:assembleDebug --stacktrace --console=plain

      - name: Verify native APK
        shell: bash
        run: |
          set -euo pipefail
          test -s native-android/app/build/outputs/apk/debug/app-debug.apk
          cp native-android/app/build/outputs/apk/debug/app-debug.apk Cubical-Compare-3.0.0-Native-Alpha.apk
          sha256sum Cubical-Compare-3.0.0-Native-Alpha.apk | tee Cubical-Compare-3.0.0-Native-Alpha.apk.sha256

      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-3.0.0-Native-Alpha
          path: |
            Cubical-Compare-3.0.0-Native-Alpha.apk
            Cubical-Compare-3.0.0-Native-Alpha.apk.sha256
          if-no-files-found: error
          retention-days: 14
