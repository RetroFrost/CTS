name: Build Cubical Create Alpha 19

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'alpha19-apply.py'
      - '.github/workflows/build-cubical-create-alpha19.yml'

permissions:
  contents: read

jobs:
  linux:
    name: Linux GTK 4 amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore reviewed Alpha 18 source and apply Alpha 19
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin cubical-create-alpha18-build:refs/remotes/origin/cubical-create-alpha18-build
          mkdir -p "$RUNNER_TEMP/alpha18-parts"
          for part in 00 01 02 03 04; do
            git show "origin/cubical-create-alpha18-build:cubical-create-alpha18-source.b64.part${part}" > "$RUNNER_TEMP/alpha18-parts/part${part}"
          done
          cat "$RUNNER_TEMP"/alpha18-parts/part* | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/alpha18.zip"
          echo 'f77790798c92e8a75dfdc84281aeb1addfb6332b887a45bb0e321d8ff4a5b48e  '"$RUNNER_TEMP/alpha18.zip" | sha256sum -c -
          mkdir source
          unzip -q "$RUNNER_TEMP/alpha18.zip" -d source
          git show origin/cubical-create-alpha18-build:alpha18-compiler-fixes.py > "$RUNNER_TEMP/alpha18-compiler-fixes.py"
          python3 "$RUNNER_TEMP/alpha18-compiler-fixes.py" source
          python3 alpha19-apply.py source
          grep -q '0.2.4-alpha.19' source/engine/engine_cli.py
          grep -q 'compress_level=3' source/engine/ccengine/image_sheet_core.py
          grep -q 'sheet_importing' source/native/linux-gtk/main.cpp
          grep -q 'WM_SHEET_DONE' source/native/windows/main.cpp
          cd source
          zip -qr ../Cubical-Create-0.2.4-alpha19-source.zip . -x '*/__pycache__/*' '*/.pytest_cache/*' '*.pyc' '.venv/*' 'build*/*' 'engine/dist/*'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build pkg-config libgtk-4-dev python3-venv ffmpeg fontconfig zip

      - name: Test and bundle rendering engine
        working-directory: source
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip -q
          pip install -q -r engine/requirements.txt pyinstaller pytest
          PYTHONPATH=engine pytest -q
          cd engine
          pyinstaller --noconfirm --clean cubical-create-engine.spec >/dev/null
          ./dist/cubical-create-engine self-test --directory "$RUNNER_TEMP/engine-self-test"

      - name: Compile and integration-test GTK application
        working-directory: source
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --parallel 2
          CUBICAL_CREATE_ENGINE="$PWD/engine/dist/cubical-create-engine" ./build-linux/CubicalCreate --self-test

      - name: Package Linux builds
        working-directory: source
        run: |
          VERSION=0.2.4-alpha19
          rm -rf stage-linux portable-linux
          mkdir -p stage-linux/DEBIAN stage-linux/opt/cubical-create stage-linux/usr/bin stage-linux/usr/share/applications
          cp packaging/linux/control stage-linux/DEBIAN/control
          cp build-linux/CubicalCreate stage-linux/opt/cubical-create/CubicalCreate
          cp engine/dist/cubical-create-engine stage-linux/opt/cubical-create/cubical-create-engine
          cp README.md stage-linux/opt/cubical-create/README.md
          cp packaging/linux/cubical-create.desktop stage-linux/usr/share/applications/cubical-create.desktop
          ln -s /opt/cubical-create/CubicalCreate stage-linux/usr/bin/cubical-create
          chmod 0755 stage-linux/opt/cubical-create/CubicalCreate stage-linux/opt/cubical-create/cubical-create-engine
          dpkg-deb --root-owner-group --build stage-linux "Cubical-Create-${VERSION}-linux-amd64.deb"
          mkdir -p "portable-linux/Cubical-Create-${VERSION}-linux-amd64"
          cp build-linux/CubicalCreate engine/dist/cubical-create-engine README.md "portable-linux/Cubical-Create-${VERSION}-linux-amd64/"
          tar -C portable-linux -czf "Cubical-Create-${VERSION}-linux-amd64.tar.gz" "Cubical-Create-${VERSION}-linux-amd64"
          sha256sum "Cubical-Create-${VERSION}-linux-amd64.deb" "Cubical-Create-${VERSION}-linux-amd64.tar.gz" ../Cubical-Create-0.2.4-alpha19-source.zip > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Create-0.2.4-alpha19-Linux-amd64
          path: |
            source/Cubical-Create-0.2.4-alpha19-linux-amd64.deb
            source/Cubical-Create-0.2.4-alpha19-linux-amd64.tar.gz
            source/SHA256SUMS-linux.txt
            Cubical-Create-0.2.4-alpha19-source.zip

  windows:
    name: Windows x64 native shell
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore reviewed Alpha 18 source and apply Alpha 19
        shell: pwsh
        run: |
          git fetch --depth=1 origin cubical-create-alpha18-build:refs/remotes/origin/cubical-create-alpha18-build
          New-Item -ItemType Directory "$env:RUNNER_TEMP\alpha18-parts" | Out-Null
          $encoded = ''
          foreach ($part in @('00','01','02','03','04')) {
            $text = git show "origin/cubical-create-alpha18-build:cubical-create-alpha18-source.b64.part$part"
            $encoded += ($text -replace '\s','')
          }
          $archive = "$env:RUNNER_TEMP\alpha18.zip"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($encoded))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'f77790798c92e8a75dfdc84281aeb1addfb6332b887a45bb0e321d8ff4a5b48e') { throw "Alpha 18 source checksum mismatch: $hash" }
          New-Item -ItemType Directory source | Out-Null
          Expand-Archive $archive source -Force
          git show origin/cubical-create-alpha18-build:alpha18-compiler-fixes.py | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\alpha18-compiler-fixes.py"
          python "$env:RUNNER_TEMP\alpha18-compiler-fixes.py" source
          python alpha19-apply.py source
          if (-not (Select-String -Quiet -Path source\engine\engine_cli.py -Pattern '0.2.4-alpha.19')) { throw 'Alpha 19 version marker missing.' }
          if (-not (Select-String -Quiet -Path source\native\windows\main.cpp -Pattern 'WM_SHEET_DONE')) { throw 'Async sheet marker missing.' }

      - name: Test and bundle rendering engine
        working-directory: source
        shell: pwsh
        run: |
          python -m pip install --upgrade pip -q
          pip install -q -r engine/requirements.txt pyinstaller pytest
          $env:PYTHONPATH = "$PWD\engine"
          pytest -q
          Push-Location engine
          pyinstaller --noconfirm --clean cubical-create-engine.spec | Out-Null
          & .\dist\cubical-create-engine.exe self-test --directory "$env:RUNNER_TEMP\engine-self-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Compile and integration-test Windows application
        working-directory: source
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64
          cmake --build build-windows --config Release --parallel 2
          $env:CUBICAL_CREATE_ENGINE = "$PWD\engine\dist\cubical-create-engine.exe"
          & .\build-windows\Release\CubicalCreate.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows build
        working-directory: source
        shell: pwsh
        run: |
          $version = '0.2.4-alpha19'
          $root = "Cubical-Create-$version-windows-x64"
          Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $root | Out-Null
          Copy-Item .\build-windows\Release\CubicalCreate.exe "$root\CubicalCreate.exe"
          Copy-Item .\engine\dist\cubical-create-engine.exe "$root\cubical-create-engine.exe"
          Copy-Item .\README.md "$root\README.md"
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if (-not $ffmpeg) { choco install ffmpeg -y --no-progress; $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue }
          if (-not $ffmpeg) { throw 'Could not locate ffmpeg.exe.' }
          Copy-Item $ffmpeg.Source "$root\ffmpeg.exe"
          Compress-Archive -Path $root -DestinationPath "Cubical-Create-$version-windows-x64.zip" -Force
          (Get-FileHash "Cubical-Create-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() + "  Cubical-Create-$version-windows-x64.zip" | Set-Content SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Create-0.2.4-alpha19-Windows-x64
          path: |
            source/Cubical-Create-0.2.4-alpha19-windows-x64.zip
            source/SHA256SUMS-windows.txt
