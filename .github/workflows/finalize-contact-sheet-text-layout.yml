name: Finalize contact-sheet text layout

on:
  push:
    branches:
      - release/cubical-compare-1.0
    paths:
      - tools/finalize_contact_sheet_text_layout.py
      - .github/workflows/finalize-contact-sheet-text-layout.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/cubical-compare-1.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install renderer test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt

      - name: Apply final contact-sheet text layout
        run: python tools/finalize_contact_sheet_text_layout.py

      - name: Verify animation and layout contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          pytest -q tests/test_animation_contract.py tests/test_males_middle_outro_regression.py
          python -m compileall -q engine

      - name: Commit final renderer correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/finalize_contact_sheet_text_layout.py .github/workflows/finalize-contact-sheet-text-layout.yml
          git add engine/ccengine/renderer.py tests/test_animation_contract.py
          git commit -m "Match badge value layout to contact-sheet reference"
          git push origin HEAD:release/cubical-compare-1.0

      - name: Start final Windows/Linux release verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cubical-compare-release-ci.yml --ref release/cubical-compare-1.0
