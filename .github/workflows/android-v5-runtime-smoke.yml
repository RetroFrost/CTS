name: Cubical Compare V5 Android 11 Runtime Smoke
on:
  push:
    branches: [android-main-preview]
    paths:
      - 'android-v5/**'
      - '.github/workflows/android-v5-runtime-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36 platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDK_MANAGER"
          ( set +o pipefail; yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null )
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Prepare Rust JNI for Android emulator
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'ndk;27.2.12479018'
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/27.2.12479018"
          cd android-v5/rust
          cargo ndk -t x86_64 -o ../app/src/main/jniLibs build --release
          test -s ../app/src/main/jniLibs/x86_64/libcts_engine.so
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the debug APK
        run: gradle --project-dir android-v5 :app:assembleDebug --no-daemon --console=plain
      - name: Prepare valid Renderer3 fixture for runtime import test
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, json, struct, zlib, pathlib
          scene = {
            'id':'android-v5-smoke','api':3,'engine':'scene-v3',
            'timeline':{'clock':'absolute','frames':30,'implicitAnimation':False},
            'canvas':{'width':320,'height':180,'fps':30},
            'background':'#000000',
            'resources':{'plate':{'type':'rect','x':0,'y':0,'width':320,'height':180,'color':'#E53935'}},
            'objects':[{'id':'plate0','kind':'rect','resource':'plate','frame':0}]
          }
          data=gzip.compress(json.dumps(scene,separators=(',',':')).encode('utf-8'))
          payload=b'CCRNDR03'+struct.pack('>III',1,len(data),zlib.crc32(data))+data
          pathlib.Path('android-v5/test.renderer3').write_bytes(payload)
          PY
      - name: Enable virtualization
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Boot Android 11, launch app and exercise menus
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -gpu swiftshader_indirect -no-boot-anim
          script: |
            adb install -r android-v5/app/build/outputs/apk/debug/app-debug.apk
            adb push android-v5/test.renderer3 /data/local/tmp/cts-test.renderer3
            adb shell 'run-as com.retrofrost.cubicalcompare.v5.debug mkdir -p files'
            adb shell 'run-as com.retrofrost.cubicalcompare.v5.debug cp /data/local/tmp/cts-test.renderer3 files/test.renderer3'
            adb shell am start -W -n com.retrofrost.cubicalcompare.v5.debug/com.retrofrost.cubicalcompare.v5.ComposeStudioActivity --ez ctsRenderer3SelfTest true --ez ctsParitySelfTest true
            sleep 3
            adb logcat -d -s CTS_RENDERER3_SELFTEST:I | grep -q 'PASS: imported and painted'
            adb logcat -d -s CTS_BUNDLE_SELFTEST:I | grep -q 'PASS: round-trip renderer and ordered embedded audio'
            adb logcat -d -s CTS_ZIPACK2_SELFTEST:I | grep -q 'PASS: contact sheet import and 2-card MegaPack re-export'
            adb logcat -d -s CTS_ZIPACK2_LARGE:I | grep -q 'PASS: original-resolution regions from 5200px Windows contact sheet'
            for attempt in $(seq 1 60); do
              if adb logcat -d -s CTS_PARITY_SELFTEST:I | grep -q 'PASS: reverse seek'; then break; fi
              sleep 2
            done
            adb logcat -d -s CTS_PARITY_SELFTEST:I | grep -q 'PASS: reverse seek'
            adb logcat -d -s CTS_RENDERER3_PARITY:I | grep -q 'PASS: integer frame seek'
            adb shell input keyevent 3
            for attempt in $(seq 1 60); do
              if adb logcat -d -s CTS_EXPORT_SERVICE:I | grep -q 'PASS: export finished'; then break; fi
              sleep 2
            done
            adb logcat -d -s CTS_EXPORT_SERVICE:I | grep -q 'PASS: export finished'
            adb shell 'run-as com.retrofrost.cubicalcompare.v5.debug test -s files/service-smoke.mp4'
            adb shell am start -W -n com.retrofrost.cubicalcompare.v5.debug/com.retrofrost.cubicalcompare.v5.ComposeStudioActivity
            adb shell pidof com.retrofrost.cubicalcompare.v5.debug
            adb shell input tap 340 285
            sleep 1
            adb shell input tap 560 285
            sleep 1
            adb shell input tap 810 285
            sleep 1
            adb shell pidof com.retrofrost.cubicalcompare.v5.debug
            adb shell screencap -p /sdcard/cts-android-v5.png
            adb pull /sdcard/cts-android-v5.png cts-android-v5-runtime.png
            ! adb logcat -d -t 1500 | grep -q 'Process: com.retrofrost.cubicalcompare.v5.debug'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CubicalCompare-V5-Android11-UI-Screenshot
          path: cts-android-v5-runtime.png
          if-no-files-found: ignore
