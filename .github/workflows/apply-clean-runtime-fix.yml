name: Apply clean runtime fixes

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/apply-clean-runtime-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - name: Apply clean UI and renderer hot-path fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('android/app/src/main/java/io/github/retrofrost/cts/android/MainActivity.kt')
          s = main.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'MainActivity patch anchor missing: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'import androidx.compose.foundation.background\n',
              'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n',
              'border import',
          )
          replace_once(
              'import androidx.compose.foundation.gestures.detectTransformGestures\n',
              'import androidx.compose.foundation.gestures.detectDragGestures\nimport androidx.compose.foundation.gestures.detectTransformGestures\n',
              'gesture imports',
          )
          replace_once(
              'import androidx.compose.foundation.shape.RoundedCornerShape\n',
              'import androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\n',
              'shape imports',
          )
          replace_once(
              'import androidx.compose.runtime.Composable\n',
              'import androidx.compose.runtime.Composable\nimport androidx.compose.runtime.DisposableEffect\n',
              'DisposableEffect import',
          )
          replace_once(
              '    val bitmap = remember(card.image) { decodePreviewBitmap(card.image) }\n    var editing by remember(card.id, card.image) { mutableStateOf(false) }',
              '''    val bitmap = remember(card.image) { decodePreviewBitmap(card.image) }\n    DisposableEffect(bitmap) {\n        onDispose { bitmap?.takeIf { !it.isRecycled }?.recycle() }\n    }\n    var editing by remember(card.id, card.image) { mutableStateOf(false) }''',
              'bitmap disposal',
          )
          replace_once(
              '''            } else {\n                Row(\n                    modifier = Modifier.align(Alignment.TopCenter).padding(8.dp),''',
              '''            } else {\n                Box(\n                    Modifier\n                        .fillMaxSize()\n                        .padding(12.dp)\n                        .border(2.dp, Color.White, RoundedCornerShape(10.dp)),\n                )\n                TransformHandle(Alignment.TopStart, -1f, -1f) { delta ->\n                    draft = draft.copy(imageScale = (draft.imageScale * (1.0 + delta)).coerceIn(0.10, 6.0))\n                }\n                TransformHandle(Alignment.TopEnd, 1f, -1f) { delta ->\n                    draft = draft.copy(imageScale = (draft.imageScale * (1.0 + delta)).coerceIn(0.10, 6.0))\n                }\n                TransformHandle(Alignment.BottomStart, -1f, 1f) { delta ->\n                    draft = draft.copy(imageScale = (draft.imageScale * (1.0 + delta)).coerceIn(0.10, 6.0))\n                }\n                TransformHandle(Alignment.BottomEnd, 1f, 1f) { delta ->\n                    draft = draft.copy(imageScale = (draft.imageScale * (1.0 + delta)).coerceIn(0.10, 6.0))\n                }\n                Row(\n                    modifier = Modifier.align(Alignment.TopCenter).padding(8.dp),''',
              'visible transform handles',
          )
          s = s.replace('"Drag · pinch · rotate"', '"Drag · pinch · rotate · drag corners to resize"', 1)

          helper_anchor = '''@Composable\nprivate fun TransformSlider(label: String, value: Float, range: ClosedFloatingPointRange<Float>, display: String, onChange: (Float) -> Unit) {'''
          helper = '''@Composable\nprivate fun androidx.compose.foundation.layout.BoxScope.TransformHandle(\n    alignment: Alignment,\n    signX: Float,\n    signY: Float,\n    onScaleDelta: (Double) -> Unit,\n) {\n    Box(\n        Modifier\n            .align(alignment)\n            .padding(3.dp)\n            .size(30.dp)\n            .background(MaterialTheme.colorScheme.primary, CircleShape)\n            .border(2.dp, Color.White, CircleShape)\n            .pointerInput(signX, signY) {\n                detectDragGestures { _, dragAmount ->\n                    val signedPixels = dragAmount.x * signX + dragAmount.y * signY\n                    onScaleDelta((signedPixels / 240f).toDouble().coerceIn(-0.35, 0.35))\n                }\n            },\n    )\n}\n\n'''
          replace_once(helper_anchor, helper + helper_anchor, 'transform handle helper')
          s = s.replace('while (bounds.outWidth / sample > 1600 || bounds.outHeight / sample > 1600)',
                        'while (bounds.outWidth / sample > 1280 || bounds.outHeight / sample > 1280)', 1)
          main.write_text(s)

          bridge = Path('android/app/src/main/java/io/github/retrofrost/cts/android/RendererBridge.kt')
          b = bridge.read_text()

          def breplace(old, new, label):
              global b
              if old not in b:
                  raise SystemExit(f'RendererBridge patch anchor missing: {label}')
              b = b.replace(old, new, 1)

          breplace(
              '''        val base = baseFrameCount(project, spec)\n        val rendererIntro = rendererIntroFrames(spec).coerceAtMost(base - 1)''',
              '''        val base = baseFrameCount(project, spec)\n        if (project.introMode == IntroMode.RENDERER) {\n            return@synchronized RenderMetadata(base, base.toDouble() / fps, fps)\n        }\n        val rendererIntro = rendererIntroFrames(spec).coerceAtMost(base - 1)''',
              'metadata renderer fast path',
          )
          breplace(
              '''        val spec = RendererRuntime.active\n        val mapped = mapFrame(project, spec, frame)\n        if (mapped.customIntroFrame != null) {''',
              '''        val spec = RendererRuntime.active\n        if (project.introMode == IntroMode.RENDERER) {\n            return@synchronized renderEngineRgba(project, spec, frame, width, height)\n        }\n        val mapped = mapFrame(project, spec, frame)\n        if (mapped.customIntroFrame != null) {''',
              'RGBA renderer fast path',
          )
          breplace(
              '''        val spec = RendererRuntime.active\n        val mapped = mapFrame(project, spec, frame)\n        if (mapped.customIntroFrame != null) {''',
              '''        val spec = RendererRuntime.active\n        if (project.introMode == IntroMode.RENDERER) {\n            return@synchronized renderEngine(project, spec, frame, width, height)\n        }\n        val mapped = mapFrame(project, spec, frame)\n        if (mapped.customIntroFrame != null) {''',
              'Bitmap renderer fast path',
          )
          bridge.write_text(b)

          intro = Path('android/app/src/main/java/io/github/retrofrost/cts/android/IntroVideoSource.kt')
          intro.write_text(r'''package io.github.retrofrost.cts.android

import android.graphics.Bitmap
import android.graphics.Canvas
import android.graphics.Color
import android.graphics.Paint
import android.graphics.Rect
import android.graphics.RectF
import android.media.MediaMetadataRetriever
import android.os.Build
import java.io.File
import java.nio.ByteBuffer
import kotlin.math.ceil
import kotlin.math.min

/** Decodes a user supplied MP4 intro into deterministic project-timeline frames. */
object IntroVideoSource {
    private data class Cached(
        val path: String,
        val retriever: MediaMetadataRetriever,
        val durationUs: Long,
        val sourceFrames: Int,
        val sourceWidth: Int,
        val sourceHeight: Int,
        var batchStart: Int = -1,
        var batchFrames: List<Bitmap> = emptyList(),
    )

    private var cached: Cached? = null
    private val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)

    @Synchronized
    fun durationUs(path: String): Long = source(path).durationUs

    @Synchronized
    fun frameCount(path: String, fps: Int): Int {
        if (path.isBlank()) return 0
        val duration = source(path).durationUs
        return ceil(duration / 1_000_000.0 * fps.coerceAtLeast(1)).toInt().coerceAtLeast(1)
    }

    @Synchronized
    fun render(path: String, projectFrame: Int, projectFps: Int, width: Int, height: Int): Bitmap {
        val source = source(path)
        val safeFps = projectFps.coerceAtLeast(1)
        val timeUs = (projectFrame.coerceAtLeast(0) * 1_000_000L / safeFps)
            .coerceIn(0L, (source.durationUs - 1L).coerceAtLeast(0L))

        val sourceIndex = if (Build.VERSION.SDK_INT >= 28 && source.sourceFrames > 0) {
            ((timeUs.toDouble() / source.durationUs.coerceAtLeast(1L)) * source.sourceFrames)
                .toInt().coerceIn(0, source.sourceFrames - 1)
        } else {
            -1
        }
        val decoded = decodedFrame(source, sourceIndex, timeUs)

        val output = Bitmap.createBitmap(width.coerceAtLeast(2), height.coerceAtLeast(2), Bitmap.Config.ARGB_8888)
        val canvas = Canvas(output)
        canvas.drawColor(Color.BLACK)
        if (decoded != null) {
            val scale = min(output.width.toFloat() / decoded.width.coerceAtLeast(1), output.height.toFloat() / decoded.height.coerceAtLeast(1))
            val drawnWidth = decoded.width * scale
            val drawnHeight = decoded.height * scale
            val left = (output.width - drawnWidth) / 2f
            val top = (output.height - drawnHeight) / 2f
            canvas.drawBitmap(
                decoded,
                Rect(0, 0, decoded.width, decoded.height),
                RectF(left, top, left + drawnWidth, top + drawnHeight),
                paint,
            )
        }
        return output
    }

    @Synchronized
    fun renderRgba(path: String, projectFrame: Int, projectFps: Int, width: Int, height: Int): ByteArray {
        val bitmap = render(path, projectFrame, projectFps, width, height)
        return try {
            ByteArray(bitmap.byteCount).also { bitmap.copyPixelsToBuffer(ByteBuffer.wrap(it)) }
        } finally {
            bitmap.recycle()
        }
    }

    @Synchronized
    fun clear() {
        releaseCached(cached)
        cached = null
    }

    private fun decodedFrame(source: Cached, sourceIndex: Int, timeUs: Long): Bitmap? {
        if (sourceIndex >= 0 && sourceIndex in source.batchStart until (source.batchStart + source.batchFrames.size)) {
            return source.batchFrames[sourceIndex - source.batchStart]
        }

        recycleBatch(source)
        if (Build.VERSION.SDK_INT >= 28 && source.sourceFrames > 0 && sourceIndex >= 0) {
            val bytesPerFrame = source.sourceWidth.coerceAtLeast(1).toLong() * source.sourceHeight.coerceAtLeast(1) * 4L
            val budget = 24L * 1024L * 1024L
            val desired = (budget / bytesPerFrame.coerceAtLeast(1L)).toInt().coerceIn(1, 6)
            val count = min(desired, source.sourceFrames - sourceIndex).coerceAtLeast(1)
            val frames = if (count > 1) {
                runCatching { source.retriever.getFramesAtIndex(sourceIndex, count) }.getOrNull()
            } else {
                null
            }
            val loaded = frames?.takeIf { it.isNotEmpty() }
                ?: listOfNotNull(runCatching { source.retriever.getFrameAtIndex(sourceIndex) }.getOrNull())
            if (loaded.isNotEmpty()) {
                source.batchStart = sourceIndex
                source.batchFrames = loaded
                return loaded.first()
            }
        }

        val fallback = source.retriever.getFrameAtTime(timeUs, MediaMetadataRetriever.OPTION_CLOSEST)
        if (fallback != null) {
            source.batchStart = if (sourceIndex >= 0) sourceIndex else 0
            source.batchFrames = listOf(fallback)
        }
        return fallback
    }

    private fun recycleBatch(source: Cached) {
        source.batchFrames.forEach { bitmap -> if (!bitmap.isRecycled) bitmap.recycle() }
        source.batchFrames = emptyList()
        source.batchStart = -1
    }

    private fun releaseCached(source: Cached?) {
        if (source == null) return
        recycleBatch(source)
        source.retriever.release()
    }

    private fun source(path: String): Cached {
        require(path.isNotBlank()) { "Choose an MP4 intro first." }
        val file = File(path)
        require(file.isFile) { "The selected intro MP4 is no longer available." }
        cached?.takeIf { it.path == file.absolutePath }?.let { return it }
        releaseCached(cached)

        val retriever = MediaMetadataRetriever().apply { setDataSource(file.absolutePath) }
        val durationMs = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull()
            ?: error("Could not read the intro duration.")
        val frames = if (Build.VERSION.SDK_INT >= 28) {
            retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_FRAME_COUNT)?.toIntOrNull() ?: 0
        } else 0
        val width = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull() ?: 1920
        val height = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)?.toIntOrNull() ?: 1080
        return Cached(
            path = file.absolutePath,
            retriever = retriever,
            durationUs = (durationMs * 1_000L).coerceAtLeast(1L),
            sourceFrames = frames.coerceAtLeast(0),
            sourceWidth = width.coerceAtLeast(1),
            sourceHeight = height.coerceAtLeast(1),
        ).also { cached = it }
    }
}
''')
          PY

          git config user.name "RetroFrost"
          git config user.email "routerifter@gmail.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/MainActivity.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RendererBridge.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/IntroVideoSource.kt
          git rm .github/workflows/apply-clean-runtime-fix.yml
          git commit -m "Stabilise clean editor and restore renderer throughput [skip ci]"
          git push origin HEAD:fork/2.0.7-renderer-bundles
