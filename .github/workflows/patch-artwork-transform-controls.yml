name: Patch artwork transform controls

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/patch-artwork-transform-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - name: Patch editor controls
        run: node scripts/patch_artwork_transform_controls.mjs

      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "RetroFrost CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/MainActivity.kt
          git commit -m "Add full artwork transform controls"
          git push origin HEAD:fork/2.0.7-renderer-bundles
