name: Apply transform onward

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/apply-transform-onward.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - name: Add Apply from here transform action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/java/io/github/retrofrost/cts/android/DirectPreviewTransform.kt')
          s = p.read_text()

          old = '''    fun finishEdit(commit: Boolean) {
        val index = editingIndex
        val value = draft
        if (commit && index != null && value != null && index in project.cards.indices) {
            val cards = project.cards.toMutableList()
            cards[index] = value
            onProjectChange(project.copy(cards = cards))
            onSelectedCardChange(index)
        }
        editingIndex = null
        draft = null
    }
'''
          new = '''    fun finishEdit(commit: Boolean, applyFromHere: Boolean = false) {
        val index = editingIndex
        val value = draft
        if (commit && index != null && value != null && index in project.cards.indices) {
            val cards = project.cards.toMutableList()
            if (applyFromHere) {
                for (targetIndex in index until cards.size) {
                    val target = cards[targetIndex]
                    cards[targetIndex] = target.copy(
                        imageX = value.imageX,
                        imageY = value.imageY,
                        imageScale = value.imageScale,
                        imageRotation = value.imageRotation,
                        imageCropLeft = value.imageCropLeft,
                        imageCropTop = value.imageCropTop,
                        imageCropRight = value.imageCropRight,
                        imageCropBottom = value.imageCropBottom,
                        imageLayer = value.imageLayer,
                    )
                }
            } else {
                cards[index] = value
            }
            onProjectChange(project.copy(cards = cards))
            onSelectedCardChange(index)
        }
        editingIndex = null
        draft = null
    }
'''
          if old not in s:
              raise SystemExit('finishEdit anchor missing')
          s = s.replace(old, new, 1)

          old_buttons = '''                        Row(
                            modifier = Modifier.align(Alignment.TopCenter).padding(8.dp),
                            horizontalArrangement = Arrangement.spacedBy(8.dp),
                        ) {
                            Button(onClick = { finishEdit(true) }) { Text("Done") }
                            OutlinedButton(onClick = { finishEdit(false) }) { Text("Cancel") }
                            OutlinedButton(onClick = {
'''
          new_buttons = '''                        Column(
                            modifier = Modifier.align(Alignment.TopCenter).padding(8.dp),
                            horizontalAlignment = Alignment.CenterHorizontally,
                            verticalArrangement = Arrangement.spacedBy(8.dp),
                        ) {
                            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Button(onClick = { finishEdit(true) }) { Text("Done") }
                                OutlinedButton(onClick = { finishEdit(false) }) { Text("Cancel") }
                                OutlinedButton(onClick = {
'''
          if old_buttons not in s:
              raise SystemExit('button row anchor missing')
          s = s.replace(old_buttons, new_buttons, 1)

          old_reset_tail = '''                            }) { Text("Reset") }
                        }
                    }
'''
          new_reset_tail = '''                                }) { Text("Reset") }
                            }
                            FilledTonalButton(
                                enabled = index < project.cards.lastIndex,
                                onClick = { finishEdit(true, applyFromHere = true) },
                            ) {
                                Text("Apply from card ${index + 1} onward")
                            }
                        }
                    }
'''
          if old_reset_tail not in s:
              raise SystemExit('reset tail anchor missing')
          s = s.replace(old_reset_tail, new_reset_tail, 1)

          old_hint = '''                if (editing) "Drag to move · pinch to resize · twist to rotate · drag a corner handle to scale"
                else "Tap artwork directly in the video to transform it",'''
          new_hint = '''                if (editing) "Drag to move · pinch to resize · twist to rotate · Apply from here copies this transform to every following card"
                else "Tap artwork directly in the video to transform it",'''
          if old_hint not in s:
              raise SystemExit('hint anchor missing')
          s = s.replace(old_hint, new_hint, 1)

          p.write_text(s)
          PY

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "RetroFrost"
          git config user.email "routerifter@gmail.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/DirectPreviewTransform.kt
          git rm .github/workflows/apply-transform-onward.yml
          git commit -m "Add apply-transform-from-selected-card action [skip ci]"
          git push origin HEAD:fork/2.0.7-renderer-bundles
