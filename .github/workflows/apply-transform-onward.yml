name: Apply transform onward

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/apply-transform-onward.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - name: Add Apply from here transform action
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/io/github/retrofrost/cts/android/DirectPreviewTransform.kt')
          s = p.read_text()
          old = "    fun finishEdit(commit: Boolean) {\n        val index = editingIndex\n        val value = draft\n        if (commit && index != null && value != null && index in project.cards.indices) {\n            val cards = project.cards.toMutableList()\n            cards[index] = value\n            onProjectChange(project.copy(cards = cards))\n            onSelectedCardChange(index)\n        }\n        editingIndex = null\n        draft = null\n    }\n"
          new = "    fun finishEdit(commit: Boolean, applyFromHere: Boolean = false) {\n        val index = editingIndex\n        val value = draft\n        if (commit && index != null && value != null && index in project.cards.indices) {\n            val cards = project.cards.toMutableList()\n            if (applyFromHere) {\n                for (targetIndex in index until cards.size) {\n                    val target = cards[targetIndex]\n                    cards[targetIndex] = target.copy(\n                        imageX = value.imageX,\n                        imageY = value.imageY,\n                        imageScale = value.imageScale,\n                        imageRotation = value.imageRotation,\n                        imageCropLeft = value.imageCropLeft,\n                        imageCropTop = value.imageCropTop,\n                        imageCropRight = value.imageCropRight,\n                        imageCropBottom = value.imageCropBottom,\n                        imageLayer = value.imageLayer,\n                    )\n                }\n            } else {\n                cards[index] = value\n            }\n            onProjectChange(project.copy(cards = cards))\n            onSelectedCardChange(index)\n        }\n        editingIndex = null\n        draft = null\n    }\n"
          if old not in s: raise SystemExit('finishEdit anchor missing')
          s = s.replace(old, new, 1)
          old = "                        Row(\n                            modifier = Modifier.align(Alignment.TopCenter).padding(8.dp),\n                            horizontalArrangement = Arrangement.spacedBy(8.dp),\n                        ) {\n                            Button(onClick = { finishEdit(true) }) { Text(\"Done\") }\n                            OutlinedButton(onClick = { finishEdit(false) }) { Text(\"Cancel\") }\n                            OutlinedButton(onClick = {\n"
          new = "                        Column(\n                            modifier = Modifier.align(Alignment.TopCenter).padding(8.dp),\n                            horizontalAlignment = Alignment.CenterHorizontally,\n                            verticalArrangement = Arrangement.spacedBy(8.dp),\n                        ) {\n                            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                                Button(onClick = { finishEdit(true) }) { Text(\"Done\") }\n                                OutlinedButton(onClick = { finishEdit(false) }) { Text(\"Cancel\") }\n                                OutlinedButton(onClick = {\n"
          if old not in s: raise SystemExit('buttons anchor missing')
          s = s.replace(old, new, 1)
          old = "                            }) { Text(\"Reset\") }\n                        }\n                    }\n"
          new = "                                }) { Text(\"Reset\") }\n                            }\n                            FilledTonalButton(\n                                enabled = index < project.cards.lastIndex,\n                                onClick = { finishEdit(true, applyFromHere = true) },\n                            ) {\n                                Text(\"Apply from card ${index + 1} onward\")\n                            }\n                        }\n                    }\n"
          if old not in s: raise SystemExit('reset anchor missing')
          s = s.replace(old, new, 1)
          old = "                if (editing) \"Drag to move · pinch to resize · twist to rotate · drag a corner handle to scale\"\n                else \"Tap artwork directly in the video to transform it\","
          new = "                if (editing) \"Drag to move · pinch to resize · twist to rotate · Apply from here copies this transform to every following card\"\n                else \"Tap artwork directly in the video to transform it\","
          if old not in s: raise SystemExit('hint anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "RetroFrost"
          git config user.email "routerifter@gmail.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/DirectPreviewTransform.kt
          git rm .github/workflows/apply-transform-onward.yml
          git commit -m "Add apply-transform-from-selected-card action [skip ci]"
          git push origin HEAD:fork/2.0.7-renderer-bundles
