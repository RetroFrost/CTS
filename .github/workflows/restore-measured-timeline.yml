name: Restore tested CTS 2.0 exact reference motion

# Re-run the source-measured reference pass on demand and after workflow updates.

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/restore-measured-timeline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-reference-motion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android history
        uses: actions/checkout@v4
        with:
          ref: android
          fetch-depth: 0

      - name: Install frame-measured opening motion and exact palette
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/java/io/github/retrofrost/cts/android/timeline/TimelineEngine.kt")
          text = path.read_text()
          replacement = '    private val malesPhasePullKeys = arrayOf(\n        528f to 0.000000f,\n        529f to 0.000000f,\n        530f to 0.008333f,\n        531f to 0.008333f,\n        532f to 0.008333f,\n        533f to 0.016667f,\n        534f to 0.016667f,\n        535f to 0.016667f,\n        536f to 0.025000f,\n        537f to 0.025000f,\n        538f to 0.033333f,\n        539f to 0.033333f,\n        540f to 0.041667f,\n        541f to 0.041667f,\n        542f to 0.041667f,\n        543f to 0.050000f,\n        544f to 0.050000f,\n        545f to 0.058333f,\n        546f to 0.066667f,\n        547f to 0.066667f,\n        548f to 0.075000f,\n        549f to 0.075000f,\n        550f to 0.083333f,\n        551f to 0.091667f,\n        552f to 0.091667f,\n        553f to 0.100000f,\n        554f to 0.108333f,\n        555f to 0.116667f,\n        556f to 0.116667f,\n        557f to 0.125000f,\n        558f to 0.133333f,\n        559f to 0.133333f,\n        560f to 0.141667f,\n        561f to 0.150000f,\n        562f to 0.150000f,\n        563f to 0.158333f,\n        564f to 0.166667f,\n        565f to 0.175000f,\n        566f to 0.183333f,\n        567f to 0.183333f,\n        568f to 0.200000f,\n        569f to 0.200000f,\n        570f to 0.208333f,\n        571f to 0.216667f,\n        572f to 0.225000f,\n        573f to 0.233333f,\n        574f to 0.241667f,\n        575f to 0.250000f,\n        576f to 0.250000f,\n        577f to 0.258333f,\n        578f to 0.266667f,\n        579f to 0.275000f,\n        580f to 0.283333f,\n        581f to 0.291667f,\n        582f to 0.300000f,\n        583f to 0.308333f,\n        584f to 0.316667f,\n        585f to 0.325000f,\n        586f to 0.333333f,\n        587f to 0.333333f,\n        588f to 0.350000f,\n        589f to 0.358333f,\n        590f to 0.366667f,\n        591f to 0.375000f,\n        592f to 0.375000f,\n        593f to 0.391667f,\n        594f to 0.391667f,\n        595f to 0.408333f,\n        596f to 0.416667f,\n        597f to 0.416667f,\n        598f to 0.433333f,\n        599f to 0.433333f,\n        600f to 0.450000f,\n        601f to 0.458333f,\n        602f to 0.458333f,\n        603f to 0.475000f,\n        604f to 0.475000f,\n        605f to 0.491667f,\n        606f to 0.500000f,\n        607f to 0.500000f,\n        608f to 0.516667f,\n        609f to 0.516667f,\n        610f to 0.533333f,\n        611f to 0.533333f,\n        612f to 0.541667f,\n        613f to 0.550000f,\n        614f to 0.558333f,\n        615f to 0.566667f,\n        616f to 0.575000f,\n        617f to 0.583333f,\n        618f to 0.591667f,\n        619f to 0.600000f,\n        620f to 0.608333f,\n    )'
          text, count = re.subn(
              r"    private val malesPhasePullKeys = arrayOf\(.*?\n    \)\n    const val MALES_BODY_SECONDS",
              replacement + "\n    const val MALES_BODY_SECONDS",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("malesPhasePullKeys block not found")
          text = text.replace("private const val MALES_STEADY_START_SHIFT = 0.614439f", "private const val MALES_STEADY_START_SHIFT = 0.608333f", 1)
          path.write_text(text)

          monitor = Path("android/app/src/main/java/io/github/retrofrost/cts/android/ui/ProgramMonitor.kt")
          m = monitor.read_text()
          m = m.replace("Color(0xFFF2F2F2)", "Color(0xFFF0F0F0)")
          m = m.replace("Color(0xFF635E57)", "Color(0xFF625F58)")
          monitor.write_text(m)
          PY

      - name: Verify exact-reference invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE=android/app/src/main/java/io/github/retrofrost/cts/android/timeline/TimelineEngine.kt
          MONITOR=android/app/src/main/java/io/github/retrofrost/cts/android/ui/ProgramMonitor.kt
          git diff --check
          grep -q '528f to 0.000000f' "$FILE"
          grep -q '535f to 0.016667f' "$FILE"
          grep -q '620f to 0.608333f' "$FILE"
          grep -q 'MALES_STEADY_START_SHIFT = 0.608333f' "$FILE"
          grep -q 'Color(0xFFF0F0F0)' "$MONITOR"
          grep -q 'Color(0xFF625F58)' "$MONITOR"
          grep -q 'Color(0xFFE8E6E2)' "$MONITOR"
          grep -q 'Color(0xFF181818)' "$MONITOR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile exact-reference pass
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android/gradle-exact-reference.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee android/gradle-exact-reference-tests.log

      - name: Commit only tested exact-reference changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin android
          git rebase origin/android
          git add android/app/src/main/java/io/github/retrofrost/cts/android/timeline/TimelineEngine.kt android/app/src/main/java/io/github/retrofrost/cts/android/ui/ProgramMonitor.kt
          if git diff --cached --quiet; then
            echo "Exact-reference changes already present"
          else
            git commit -m "Use frame-measured CTS reference motion and palette"
            git push origin HEAD:android
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-2.0-exact-reference-validation
          path: |
            android/gradle-exact-reference.log
            android/gradle-exact-reference-tests.log
          if-no-files-found: ignore
