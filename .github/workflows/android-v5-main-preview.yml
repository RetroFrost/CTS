name: Cubical Compare V5 Android Main Preview
on:
  push:
    branches: [android-main-preview]
    paths:
      - 'android-v5/**'
      - '.github/workflows/android-v5-main-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 using runner tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDK_MANAGER"
          ( set +o pipefail; yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null )
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install Android NDK and cargo-ndk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'ndk;27.2.12479018'
          cargo install cargo-ndk --locked
      - name: Test Rust renderer logic
        run: cargo test --manifest-path android-v5/rust/Cargo.toml --locked
      - name: Compile Rust JNI library for Android
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android-v5/app/src/main/jniLibs build --manifest-path android-v5/rust/Cargo.toml --release
          test -s android-v5/app/src/main/jniLibs/arm64-v8a/libcts_engine.so
          test -s android-v5/app/src/main/jniLibs/armeabi-v7a/libcts_engine.so
          test -s android-v5/app/src/main/jniLibs/x86_64/libcts_engine.so
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test project and M3U compatibility
        run: gradle --project-dir android-v5 :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
      - name: Build native Android debug APK
        run: gradle --project-dir android-v5 :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Verify feature source and APK
        shell: bash
        run: |
          test -s android-v5/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android-v5/app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libcts_engine.so'
          grep -q 'ComposeStudioActivity' android-v5/app/src/main/AndroidManifest.xml
          grep -q 'M3uPattern.save' android-v5/app/src/main/java/com/retrofrost/cubicalcompare/v5/MainActivity.java
          grep -q 'setImageDurationMs' android-v5/app/src/main/java/com/retrofrost/cubicalcompare/v5/VideoExporter.java
          grep -q 'ThumbnailTransform' android-v5/app/src/main/java/com/retrofrost/cubicalcompare/v5/StudioModel.java
      - name: Package APK and SHA256
        shell: bash
        run: |
          cp android-v5/app/build/outputs/apk/debug/app-debug.apk CubicalCompare-V5-Android-MainPreview-debug.apk
          sha256sum CubicalCompare-V5-Android-MainPreview-debug.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CubicalCompare-V5-Android-MainPreview
          if-no-files-found: error
          path: |
            CubicalCompare-V5-Android-MainPreview-debug.apk
            SHA256SUMS-android.txt
      - name: Publish GitHub prerelease
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v5.0.0-android-main-preview.${{ github.run_number }}"
          for attempt in 1 2 3 4; do
            if gh release create "$TAG" CubicalCompare-V5-Android-MainPreview-debug.apk SHA256SUMS-android.txt \
            --repo "${{ github.repository }}" --target "$GITHUB_SHA" --prerelease \
            --title "Cubical Compare V5 Android — Main Preview #${{ github.run_number }}" \
            --notes "Android V5 rebuilt using Rust JNI deterministic timeline engine plus Kotlin Jetpack Compose Material 3 UI, floating menus, Windows .ccv5 projects, M3U patterns, thumbnail transforms, draw-as-artwork, Media3 MP4 export. Debug-signed sideload APK."
            then exit 0; fi
            echo "GitHub release upload attempt ${attempt} failed (possibly transient permission/rate error)."
            if [ "$attempt" -lt 4 ]; then sleep $((attempt*12)); fi
          done
          exit 1
