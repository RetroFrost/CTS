name: Apply contact-sheet measured motion

on:
  push:
    branches:
      - release/cubical-compare-1.0
    paths:
      - tools/apply_contact_sheet_motion.py
      - .github/workflows/apply-contact-sheet-motion.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/cubical-compare-1.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install renderer test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt

      - name: Apply dense contact-sheet measurements
        run: python tools/apply_contact_sheet_motion.py

      - name: Verify animation contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/engine
        run: |
          pytest -q tests/test_animation_contract.py tests/test_males_middle_outro_regression.py
          python -m compileall -q engine

      - name: Commit measured renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_contact_sheet_motion.py .github/workflows/apply-contact-sheet-motion.yml
          git add engine/ccengine/renderer.py tests/test_animation_contract.py tests/test_males_middle_outro_regression.py
          git commit -m "Use contact-sheet measured badge and outro animation"
          git push origin HEAD:release/cubical-compare-1.0

      - name: Start release verification build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cubical-compare-release-ci.yml --ref release/cubical-compare-1.0
