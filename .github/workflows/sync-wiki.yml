name: Sync GitHub Wiki

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 1

      - name: Publish docs/wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/cts-wiki"
          mkdir -p "$RUNNER_TEMP/cts-wiki"
          cp docs/wiki/*.md "$RUNNER_TEMP/cts-wiki/"
          cd "$RUNNER_TEMP/cts-wiki"
          git init
          git checkout -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Sync wiki from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.wiki.git"
          git push --force origin master
