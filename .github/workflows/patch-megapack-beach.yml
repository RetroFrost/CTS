name: Patch MegaPack beach fallback

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/patch-megapack-beach.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0
      - name: Patch MegaPack importer
        run: node scripts/patch_megapack_beach.mjs
      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "RetroFrost CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/NativeImporters.kt
          git commit -m "Add beach fallback for transparent MegaPack icons"
          git push origin HEAD:fork/2.0.7-renderer-bundles
