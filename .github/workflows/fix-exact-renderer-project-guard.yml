name: Fix exact renderer project guard

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - '.github/workflows/fix-exact-renderer-project-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Apply exact renderer project guard
        run: python3 tools/fix_exact_renderer_project_guard.py

      - name: Verify source diff
        run: git diff --check

      - name: Test and build release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-exact-renderer-project-guard.yml
          rm tools/fix_exact_renderer_project_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/io/github/retrofrost/cts/android/RendererBridge.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RendererBundle.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/RendererProjectGuard.kt \
                  android/app/src/main/java/io/github/retrofrost/cts/android/CubicalCompareApplication.kt \
                  android/app/src/test/java/io/github/retrofrost/cts/android/RelationshipsPrecisionRendererTest.kt \
                  .github/workflows/fix-exact-renderer-project-guard.yml \
                  tools/fix_exact_renderer_project_guard.py
          git commit -m 'renderer: block source-exact project hybrids'
          git push origin HEAD:fork/2.0.7-renderer-bundles

      - name: Package APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Cubical-Compare-2.0.7-Relationships-Exact-ProjectGuard.apk
          sha256sum Cubical-Compare-2.0.7-Relationships-Exact-ProjectGuard.apk > Cubical-Compare-2.0.7-Relationships-Exact-ProjectGuard.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-2.0.7-Relationships-Exact-ProjectGuard
          path: |
            Cubical-Compare-2.0.7-Relationships-Exact-ProjectGuard.apk
            Cubical-Compare-2.0.7-Relationships-Exact-ProjectGuard.apk.sha256
          if-no-files-found: error
          retention-days: 14
