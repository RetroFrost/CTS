name: Build Cubical Compare 2.0.8 Precision

on:
  push:
    branches:
      - work/worst-things-exact-2.0.8-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android precision APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out build skeleton
        uses: actions/checkout@v4

      - name: Restore recovered 2.0.8 precision source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/precision208-overlay.b64 > /tmp/precision208-overlay.zip
          unzip -t /tmp/precision208-overlay.zip
          unzip -o /tmp/precision208-overlay.zip -d android
          grep -q 'versionCode = 20008' android/app/build.gradle.kts
          grep -q 'versionName = "2.0.8"' android/app/build.gradle.kts
          grep -q 'MultiModelFrameRenderer' android/app/src/main/python/cts_android_bridge.py
          test -f android/app/src/main/python/ccengine/worst_things_reference.py
          test -f android/app/src/main/python/ccengine/perfect_206.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Python renderer sources
        shell: bash
        run: python3 -m compileall -q android/app/src/main/python

      - name: Run Android unit tests
        shell: bash
        run: gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build APK
        shell: bash
        run: gradle --project-dir android :app:assembleDebug --stacktrace --console=plain

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Cubical-Compare-2.0.8-Precision.apk
          sha256sum Cubical-Compare-2.0.8-Precision.apk | tee Cubical-Compare-2.0.8-Precision.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-2.0.8-Precision
          path: |
            Cubical-Compare-2.0.8-Precision.apk
            Cubical-Compare-2.0.8-Precision.apk.sha256
          if-no-files-found: error
          retention-days: 14
