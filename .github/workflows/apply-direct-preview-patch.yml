name: Apply direct preview editor

on:
  push:
    branches:
      - 'fork/2.0.7-renderer-bundles'
    paths:
      - '.github/workflows/apply-direct-preview-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - name: Apply Preview wiring
        run: python3 tools/apply_direct_preview_patch.py

      - name: Commit source wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RetroFrost"
          git config user.email "routerifter@gmail.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/MainActivity.kt
          git rm .github/workflows/apply-direct-preview-patch.yml tools/apply_direct_preview_patch.py
          git commit -m "Use in-place direct preview transform [skip ci]"
          git push origin HEAD:fork/2.0.7-renderer-bundles
