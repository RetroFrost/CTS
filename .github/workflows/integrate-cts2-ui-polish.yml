name: Integrate CTS 2.0 app shell

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/integrate-cts2-ui-polish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Apply CTS 2.0 app shell polish
        run: python tools/polish_cts2_app_shell.py

      - name: Verify sealed-model UI invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          APP=android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt
          CARDS=android/app/src/main/java/io/github/retrofrost/cts/android/ui/CardsWorkspace2.kt
          MAIN=android/app/src/main/java/io/github/retrofrost/cts/android/MainActivity.kt
          THEME=android/app/src/main/java/io/github/retrofrost/cts/android/ui/theme/CtsTheme.kt
          grep -q 'WorkspaceSection.Data -> CardsWorkspace2(' "$APP"
          ! grep -q 'private fun DataWorkspace(' "$APP"
          ! grep -q 'onSetLength' "$APP"
          ! grep -q 'Text("Video length"' "$APP"
          ! grep -q 'ReferenceOption("Include intro"' "$APP"
          ! grep -q 'Editable timing' "$APP"
          ! grep -q 'Audio("Sound & intro")' "$APP"
          ! grep -q 'Custom MP4 intro ready' "$APP"
          ! grep -q 'introVideo.uri != null && project.showIntro' "$APP"
          grep -q 'Audio("Sound & pre-roll")' "$APP"
          grep -q 'Optional pre-roll' "$APP"
          grep -q 'Pre-roll ready' "$APP"
          grep -q 'Reference output' "$APP"
          grep -q 'colors = titleFieldColors2()' "$CARDS"
          grep -q 'focusedContainerColor = Color.White' "$CARDS"
          grep -q 'focusedTextColor = Color.Black' "$CARDS"
          grep -q 'setup-complete-v2' "$MAIN"
          grep -q 'dynamicDarkColorScheme' "$THEME"
          grep -q 'dynamicLightColorScheme' "$THEME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared contract
        run: python tools/sync_shared_contract.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build CTS 2.0.0 app shell
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-ui.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-ui-tests.log

      - name: Commit tested app shell
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt
          if git diff --cached --quiet; then
            echo "CTS 2.0 app shell already integrated"
          else
            git commit -m "Polish CTS 2.0 pre-roll semantics"
            git stash push --include-untracked -m cts-ui-ci-generated || true
            git pull --rebase origin android
            git push origin HEAD:android
            git stash pop || true
          fi

      - name: Upload validation logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-2.0-app-shell-validation-logs
          path: |
            android/gradle-cts2-ui.log
            android/gradle-cts2-ui-tests.log
          if-no-files-found: ignore
