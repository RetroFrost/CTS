name: Build Cubical Compare 3.0.300 Windows .NET

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - windows-dotnet/**
      - .github/workflows/build-windows-dotnet.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-dotnet
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        shell: pwsh
        run: dotnet restore windows-dotnet/CubicalCompare.Windows.csproj

      - name: Build
        shell: pwsh
        run: dotnet build windows-dotnet/CubicalCompare.Windows.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish windows-dotnet/CubicalCompare.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o dist/Cubical-Compare-3.0.300-Windows-dotnet

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if (-not (Test-Path $ffmpeg)) { throw "imageio-ffmpeg did not provide an ffmpeg executable" }
          Copy-Item $ffmpeg dist/Cubical-Compare-3.0.300-Windows-dotnet/ffmpeg.exe -Force
          & dist/Cubical-Compare-3.0.300-Windows-dotnet/ffmpeg.exe -version | Select-Object -First 1

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/Cubical-Compare-3.0.300-Windows-dotnet.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path dist/Cubical-Compare-3.0.300-Windows-dotnet/* -DestinationPath $out -CompressionLevel Optimal
          Get-FileHash $out -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Cubical-Compare-3.0.300-Windows-dotnet.zip" } | Set-Content dist/SHA256SUMS-Windows-dotnet.txt

      - name: Upload Windows .NET build
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-3.0.300-Windows-dotnet
          path: |
            dist/Cubical-Compare-3.0.300-Windows-dotnet.zip
            dist/SHA256SUMS-Windows-dotnet.txt
          if-no-files-found: error
