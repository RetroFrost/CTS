name: Build Cubical Compare 3.0.300 Windows .NET

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - windows-dotnet/**
      - tools/patch_windows_mobile_parity.py
      - tools/fix_windows_mobile_parity_followup.py
      - .github/workflows/build-windows-dotnet.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-dotnet
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and verify Windows mobile parity runtime
        shell: pwsh
        run: |
          python tools/patch_windows_mobile_parity.py
          python tools/fix_windows_mobile_parity_followup.py

      - name: Restore
        shell: pwsh
        run: dotnet restore windows-dotnet/CubicalCompare.Windows.csproj

      - name: Build
        shell: pwsh
        run: dotnet build windows-dotnet/CubicalCompare.Windows.csproj -c Release --no-restore

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish windows-dotnet/CubicalCompare.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o dist/Cubical-Compare-3.0.300-Windows-dotnet

      - name: Bundle FFmpeg
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if (-not (Test-Path $ffmpeg)) { throw "imageio-ffmpeg did not provide an ffmpeg executable" }
          Copy-Item $ffmpeg dist/Cubical-Compare-3.0.300-Windows-dotnet/ffmpeg.exe -Force
          & dist/Cubical-Compare-3.0.300-Windows-dotnet/ffmpeg.exe -version | Select-Object -First 1

      - name: Self-test production app
        shell: pwsh
        run: |
          $report = Join-Path $env:TEMP 'CubicalCompare-selftest-failure.txt'
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $process = Start-Process `
            -FilePath 'dist/Cubical-Compare-3.0.300-Windows-dotnet/CubicalCompare.exe' `
            -ArgumentList '--self-test' `
            -Wait `
            -PassThru `
            -NoNewWindow
          $code = $process.ExitCode
          if ($code -ne 0) {
            if (Test-Path $report) {
              Write-Host '----- Cubical Compare self-test report -----'
              Get-Content $report
              Write-Host '-------------------------------------------'
            }
            throw "Cubical Compare Windows self-test failed with exit code $code"
          }

      - name: Persist validated Windows runtime
        shell: pwsh
        run: |
          $paths = @(
            'windows-dotnet/RendererEngine.cs',
            'windows-dotnet/MainWindow.cs',
            'windows-dotnet/InfiniteTimelineRenderer.cs'
          )
          $changes = git status --porcelain -- $paths
          if (-not $changes) {
            Write-Host 'Windows runtime already persisted.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $paths
          git commit -m 'Persist validated Windows mobile parity runtime'
          git push origin HEAD:fork/2.0.7-renderer-bundles

      - name: Package
        shell: pwsh
        run: |
          $out = 'dist/Cubical-Compare-3.0.300-Windows-dotnet.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path dist/Cubical-Compare-3.0.300-Windows-dotnet/* -DestinationPath $out -CompressionLevel Optimal
          Get-FileHash $out -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Cubical-Compare-3.0.300-Windows-dotnet.zip" } | Set-Content dist/SHA256SUMS-Windows-dotnet.txt

      - name: Upload Windows .NET build
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-3.0.300-Windows-dotnet
          path: |
            dist/Cubical-Compare-3.0.300-Windows-dotnet.zip
            dist/SHA256SUMS-Windows-dotnet.txt
          if-no-files-found: error
