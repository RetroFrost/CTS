name: Cubical Compare V5 Windows
on:
  push:
    branches: [v5/development, windows/main-preview]
    paths:
      - windows-v5/**
      - .github/workflows/v5-windows.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate app icon
        shell: pwsh
        run: ./windows-v5/tools/make-icon.ps1
      - name: Build Windows x64
        shell: pwsh
        run: dotnet publish windows-v5/CubicalCompareV5/CubicalCompareV5.csproj -c Release -r win-x64 --self-contained true -o windows-v5/publish
      - name: Check compiled files
        shell: pwsh
        run: |
          if (!(Test-Path windows-v5/publish/CubicalCompareV5.exe)) { throw "EXE missing" }
          if (!(Test-Path windows-v5/publish/CubicalCompareV5.dll)) { throw "DLL missing" }
      - name: Validate uncluttered update UX
        shell: pwsh
        run: |
          # Only hand-written source is relevant. Generated obj/bin code can
          # include source snippets or assembly strings and is not UI code.
          $root = "windows-v5/CubicalCompareV5"
          $sources = @(Get-ChildItem $root -File -Filter *.cs) + @(Get-ChildItem $root -File -Filter *.xaml)
          $matches = @($sources | Select-String -Pattern 'Built-in changelog|What.s New|Release Notes')
          if ($matches.Count -gt 0) {
            $matches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw "In-app changelog or What's New UI was found in Windows V5 source"
          }
          if ((Get-Content windows/CubicalCompare/MainWindow.Settings42.cs -Raw).Contains("Built-in changelog")) { throw "Embedded legacy changelog still exists" }
      - name: Smoke-test Windows app startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path windows-v5/publish/CubicalCompareV5.exe).Path
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $proc.Refresh()
            if ($proc.HasExited) { throw "WPF app exited during startup (exit code $($proc.ExitCode))" }
          }
          finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Thumbnail image transform regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path windows-v5/publish/CubicalCompareV5.exe).Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test-thumbnail' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path thumbnail-regression-result.txt) { Get-Content thumbnail-regression-result.txt }
            throw "Thumbnail regression failed (exit code $($proc.ExitCode))"
          }
          if ((Get-Content thumbnail-regression-result.txt -Raw).Trim() -ne "PASS") { throw "Missing thumbnail regression result" }
      - name: Crash-recovery regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path windows-v5/publish/CubicalCompareV5.exe).Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test-recovery' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path recovery-regression-result.txt) { Get-Content recovery-regression-result.txt }
            throw "Project recovery regression failed ($($proc.ExitCode))"
          }
          if ((Get-Content recovery-regression-result.txt -Raw).Trim() -ne "PASS") { throw "Missing recovery regression result" }
      - name: Floating navigation and audio pattern regression
        shell: pwsh
        run: |
          $exe = (Resolve-Path windows-v5/publish/CubicalCompareV5.exe).Path
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test-island' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            if (Test-Path island-regression-result.txt) { Get-Content island-regression-result.txt }
            throw "Floating island / audio pattern regression failed ($($proc.ExitCode))"
          }
          if ((Get-Content island-regression-result.txt -Raw).Trim() -ne "PASS") { throw "Missing island/audio regression result" }
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build interactive installer
        shell: pwsh
        run: |
          $source = (Resolve-Path windows-v5/publish).Path
          $dest = Join-Path $env:GITHUB_WORKSPACE "CubicalCompare-V5-Windows-Setup.exe"
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { throw "NSIS missing" }
          & $nsis "/DAPP_SOURCE=$source" "/DOUT_FILE=$dest" "windows-v5/installer/setup.nsi"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $dest)) { throw "NSIS installer failed" }
      - name: Portable ZIP and hashes
        shell: pwsh
        run: |
          Compress-Archive -Path "windows-v5/publish/*" -DestinationPath "CubicalCompare-V5-Windows-Portable.zip"
          "CubicalCompare-V5-Windows-Setup.exe", "CubicalCompare-V5-Windows-Portable.zip" | ForEach-Object {
            $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $_"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cubical-compare-v5-windows
          path: |
            CubicalCompare-V5-Windows-Setup.exe
            CubicalCompare-V5-Windows-Portable.zip
            SHA256SUMS.txt
      - name: Publish Windows preview
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v5.0.0-windows-preview.${{ github.run_number }}"
          gh release create $tag "CubicalCompare-V5-Windows-Setup.exe" "CubicalCompare-V5-Windows-Portable.zip" "SHA256SUMS.txt" --repo "${{ github.repository }}" --target "$env:GITHUB_SHA" --title "Cubical Compare V5 Windows Preview #${{ github.run_number }}" --notes "Windows V5 preview: floating Fluent island, thumbnail transforms, ordered M3U audio patterns, 60 FPS video export, transactional crash-recovery autosaves, light/dark/Mica, old-GPU mode, and interactive NSIS installer. No in-app changelog dialogs." --prerelease
