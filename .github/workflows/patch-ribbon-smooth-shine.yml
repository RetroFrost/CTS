name: Patch Ribbon smoothness and shine

on:
  push:
    branches: [fork/2.0.7-renderer-bundles]
    paths: [.github/workflows/patch-ribbon-smooth-shine.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
      - name: Smooth Ribbon motion and widen translucent shine
        shell: bash
        run: echo '' | base64 -d | python3
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RetroFrost CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-ribbon-smooth-shine.yml
          git add android/app/src/main/java/io/github/retrofrost/cts/android/RibbonFrameRenderer.kt
          git commit -m "Smooth Ribbon motion and soften shine"
          git push origin HEAD:fork/2.0.7-renderer-bundles
