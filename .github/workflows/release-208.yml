name: Release Cubical Compare 2.0.8

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/release-208.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cubical-compare-208-release
  cancel-in-progress: false

env:
  VERSION: 2.0.8
  CTS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CTS_ANDROID_KEYSTORE_PASSWORD }}
  CTS_ANDROID_KEY_ALIAS: ${{ secrets.CTS_ANDROID_KEY_ALIAS }}
  CTS_ANDROID_KEY_PASSWORD: ${{ secrets.CTS_ANDROID_KEY_PASSWORD }}
  CTS_EXPECTED_CERT_SHA256: ${{ secrets.CTS_ANDROID_CERT_SHA256 }}
  CTS_ANDROID_KEYSTORE_B64: ${{ secrets.CTS_ANDROID_KEYSTORE_B64 }}

jobs:
  release:
    name: Build, verify and publish 2.0.8
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify 2.0.8 source identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 200081' android/app/build.gradle.kts
          grep -q 'versionName = "2.0.8"' android/app/build.gradle.kts
          grep -q 'android:label="Cubical Compare 2.0.8"' android/app/src/main/AndroidManifest.xml
          test ! -d android/app/src/main/python

      - name: Prepare permanent signing when available
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CTS_ANDROID_KEYSTORE_B64 CTS_ANDROID_KEYSTORE_PASSWORD CTS_ANDROID_KEY_ALIAS CTS_ANDROID_KEY_PASSWORD CTS_EXPECTED_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then missing=1; fi
          done
          if [ "$missing" -eq 0 ]; then
            install -d -m 700 "$RUNNER_TEMP/cts-signing"
            printf '%s' "$CTS_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cts-signing/cts-release.keystore"
            chmod 600 "$RUNNER_TEMP/cts-signing/cts-release.keystore"
            echo "CTS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cts-signing/cts-release.keystore" >> "$GITHUB_ENV"
            echo "CTS_HAS_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "CTS_HAS_STABLE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Test and build Android 2.0.8
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify release APK and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          if [ "$CTS_HAS_STABLE_SIGNING" = true ]; then
            EXPECTED="$(printf '%s' "$CTS_EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            test "$ACTUAL" = "$EXPECTED"
            SIGNING_KIND="permanent configured release identity"
          else
            SIGNING_KIND="CI fallback identity"
          fi
          mkdir -p dist
          cp "$APK" "dist/Cubical-Compare-$VERSION-Android.apk"
          sha256sum "dist/Cubical-Compare-$VERSION-Android.apk" > "dist/Cubical-Compare-$VERSION-Android.apk.sha256"
          {
            echo "Cubical Compare $VERSION Android signing"
            echo "certificate_sha256=$ACTUAL"
            echo "identity=$SIGNING_KIND"
          } > "dist/Cubical-Compare-$VERSION-Android.signing.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-${{ env.VERSION }}-Release
          path: |
            dist/Cubical-Compare-${{ env.VERSION }}-Android.apk
            dist/Cubical-Compare-${{ env.VERSION }}-Android.apk.sha256
            dist/Cubical-Compare-${{ env.VERSION }}-Android.signing.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove one-time release workflow and commit final release head
        id: final_head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-208.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-208.yml
          git commit -m 'release: finalize Cubical Compare 2.0.8 [skip ci]'
          git pull --rebase origin fork/2.0.7-renderer-bundles
          git push origin HEAD:fork/2.0.7-renderer-bundles
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub v2.0.8 release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.final_head.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          FILES=(
            "dist/Cubical-Compare-$VERSION-Android.apk"
            "dist/Cubical-Compare-$VERSION-Android.apk.sha256"
            "dist/Cubical-Compare-$VERSION-Android.signing.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Cubical Compare $VERSION — Exact Renderer Release" \
              --notes-file FINAL_RELEASE.md
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "$RELEASE_SHA" \
              --title "Cubical Compare $VERSION — Exact Renderer Release" \
              --notes-file FINAL_RELEASE.md
          fi

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/cts-signing"
