name: Build 2.0.7 Native Rewrite

on:
  push:
    branches:
      - rewrite/207-native
    paths:
      - "android/**"
      - ".github/workflows/build-207-native-rewrite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rewrite-207-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Full Android rewrite APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile and test full 2.0.7-derived app
        shell: bash
        run: |
          set -euo pipefail
          gradle --project-dir android :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Cubical-Compare-3.0.0-Native-Rewrite-Alpha.apk
          sha256sum Cubical-Compare-3.0.0-Native-Rewrite-Alpha.apk

      - name: Upload rewrite APK
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-3.0.0-Native-Rewrite-Alpha
          path: Cubical-Compare-3.0.0-Native-Rewrite-Alpha.apk
          if-no-files-found: error
          retention-days: 14
