name: Cubical Compare Lab - Gemini Reference Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - lab/gemini-reference-experiments-2.0.5
    paths:
      - android/**
      - native/**
      - engine/**
      - tests/**
      - tools/fetch_watchdata_fonts.py
      - CMakeLists.txt
      - LAB_GEMINI.md
      - .github/workflows/lab-gemini-reference.yml

permissions:
  contents: read

concurrency:
  group: cubical-compare-lab-gemini-${{ github.ref }}
  cancel-in-progress: true

env:
  LAB_VERSION: 2.0.5-Lab-Gemini1

jobs:
  windows:
    name: Windows x64 Lab
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-build.txt

      - name: Fetch verified Poppins fonts
        shell: pwsh
        run: |
          python tools/fetch_watchdata_fonts.py --dest engine/ccengine/fonts --dest android/app/src/main/python/ccengine/fonts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.Length -gt 1000000 } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $ffmpeg) { throw 'Could not locate FFmpeg.' }
          "CUBICAL_COMPARE_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Lab source and stable contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\engine"
          python -m py_compile engine\ccengine\lab_renderer.py engine\lab_engine_cli.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $desktopHash = (Get-FileHash engine\ccengine\lab_renderer.py -Algorithm SHA256).Hash
          $androidHash = (Get-FileHash android\app\src\main\python\ccengine\lab_renderer.py -Algorithm SHA256).Hash
          if ($desktopHash -ne $androidHash) { throw 'Android and Windows Lab renderer sources differ.' }
          pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Lab renderer engine
        working-directory: engine
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD"
          pyinstaller --noconfirm --clean cubical-compare-lab-engine.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = '.\dist\cubical-compare-engine\cubical-compare-engine.exe'
          if (-not (Test-Path $engine)) { throw 'Lab renderer engine was not produced.' }
          Copy-Item $env:CUBICAL_COMPARE_FFMPEG '.\dist\cubical-compare-engine\ffmpeg.exe' -Force

      - name: Self-test packaged Lab renderer
        shell: pwsh
        run: |
          Remove-Item lab-renderer-self-test -Recurse -Force -ErrorAction SilentlyContinue
          & .\engine\dist\cubical-compare-engine\cubical-compare-engine.exe self-test --directory lab-renderer-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path lab-renderer-self-test\self-test.mp4)) { throw 'Lab self-test MP4 is missing.' }

      - name: Build and test Windows shell
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CUBICAL_COMPARE_ENGINE = "$PWD\engine\dist\cubical-compare-engine\cubical-compare-engine.exe"
          & .\build-windows\Release\CubicalCompare.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows Lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "dist\Cubical-Compare-$env:LAB_VERSION-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$root\engine" | Out-Null
          Copy-Item build-windows\Release\CubicalCompare.exe "$root\CubicalCompare.exe"
          Copy-Item engine\dist\cubical-compare-engine\* "$root\engine" -Recurse -Force
          Copy-Item LAB_GEMINI.md "$root\LAB_GEMINI.md"
          Compress-Archive -Path "$root\*" -DestinationPath "dist\Cubical-Compare-$env:LAB_VERSION-Windows-x64.zip" -Force
          $hash = (Get-FileHash "dist\Cubical-Compare-$env:LAB_VERSION-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Cubical-Compare-$env:LAB_VERSION-Windows-x64.zip" | Out-File "dist\Cubical-Compare-$env:LAB_VERSION-Windows-x64.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-${{ env.LAB_VERSION }}-Windows-x64
          path: |
            dist/Cubical-Compare-${{ env.LAB_VERSION }}-Windows-x64.zip
            dist/Cubical-Compare-${{ env.LAB_VERSION }}-Windows-x64.zip.sha256
          if-no-files-found: error

  android:
    name: Android Lab
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Android Lab bridge and renderer parity
        run: |
          set -euo pipefail
          python -m py_compile android/app/src/main/python/cts_android_bridge.py android/app/src/main/python/cts_android_bridge_lab.py android/app/src/main/python/ccengine/lab_renderer.py
          cmp engine/ccengine/lab_renderer.py android/app/src/main/python/ccengine/lab_renderer.py

      - name: Build Android Lab
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify and package Android Lab
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/Cubical-Compare-$LAB_VERSION-Android.apk"
          sha256sum "dist/Cubical-Compare-$LAB_VERSION-Android.apk" > "dist/Cubical-Compare-$LAB_VERSION-Android.apk.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-${{ env.LAB_VERSION }}-Android
          path: |
            dist/Cubical-Compare-${{ env.LAB_VERSION }}-Android.apk
            dist/Cubical-Compare-${{ env.LAB_VERSION }}-Android.apk.sha256
          if-no-files-found: error
