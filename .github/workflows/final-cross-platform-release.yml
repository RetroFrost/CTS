name: Cubical Compare 2.0 Final

on:
  workflow_dispatch:
  push:
    branches:
      - work/final-cross-platform-rebuild
      - release/cubical-compare-final
      - hotfix/android-preview-lifecycle-2.0.1
      - hotfix/android-megapack-background-export-2.0.2
      - hotfix/android-preview-play-stop-2.0.3
      - hotfix/reference-fidelity-watchdata-font-2.0.4
    paths:
      - android/**
      - native/**
      - engine/**
      - tests/**
      - tools/**
      - CMakeLists.txt
      - FINAL_RELEASE.md
      - .github/workflows/final-cross-platform-release.yml

permissions:
  contents: write

concurrency:
  group: cubical-compare-final-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 2.0.4
  # First commit where the corrected 2.0.4 renderer source and Android mirror
  # both passed the rendered visual-audit correction.
  RENDERER_BASE: 0aabbdcc9118f8fd82876d8b8ec2ee54b0fcbeb6

jobs:
  windows:
    name: Windows x64 final
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prove 2.0.4 reference renderer is frozen
        shell: pwsh
        run: |
          git diff --exit-code $env:RENDERER_BASE -- engine/ccengine
          if ($LASTEXITCODE -ne 0) { throw 'The reviewed 2.0.4 reference renderer changed after its baseline commit.' }

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: engine/requirements-build.txt

      - name: Fetch verified WatchData-matched Poppins fonts
        shell: pwsh
        run: |
          python tools/fetch_watchdata_fonts.py --dest engine/ccengine/fonts --dest android/app/src/main/python/ccengine/fonts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg -y --no-progress
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements-build.txt
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.Length -gt 1000000 } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $ffmpeg) { throw 'Could not locate FFmpeg.' }
          "CUBICAL_COMPARE_FFMPEG=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test shared renderer and final contracts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\engine"
          pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render 2.0.4 visual-audit frames
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\engine"
          New-Item -ItemType Directory -Force -Path qa\watchdata-204 | Out-Null
          @'
          from pathlib import Path
          from ccengine.models import Card, Project, ProjectSettings
          from ccengine.renderer import FrameRenderer

          cards = [
              Card("Ape Noises And Gestures", "7M YEARS AGO", "Our chimp ancestors spoke with hoots and gestures", ""),
              Card("Language Section Of Brain Develops", "400K YEARS AGO", "The FOXP2 gene gave us the language part of our brain", ""),
              Card("Voice Box Evolves Fully", "300K YEARS AGO", "A lower larynx unlocked many more distinct sounds", ""),
              Card("Clicking Languages", "70K YEARS AGO", "Some languages like Khoisan still use clicking sounds", ""),
              Card("Continuous Card", "50K YEARS AGO", "Reference conveyor continuation", ""),
          ]
          settings = ProjectSettings()
          settings.credits_top_text = "The values presented are the years in which various developmental milestones in languages occured."
          settings.credits_heading = "Credits"
          settings.credits_project_name = "Lead Research & Sourcing · Ahmed"
          settings.credits_created_with_label = "Independent Fact Check"
          settings.credits_created_with_value = "Alex Lambert"
          settings.credits_design_label = "Lead Graphic Designer"
          settings.credits_design_value = "Jack H"
          settings.credits_footer = "DISCLAIMER: THIS VIDEO IS BASED ON COMMUNITY DISCUSSIONS AND RELEVANT SOURCES."
          project = Project("WatchData visual audit", cards, settings)
          renderer = FrameRenderer()
          root = Path("qa/watchdata-204")
          renderer.render(project, 100 / 60.0).save(root / "frame-0100.png")
          renderer.render(project, 528 / 60.0).save(root / "frame-0528.png")
          badge = renderer._badge_source(cards[3], 5.0, sticker_entry=False)
          badge.save(root / "settled-badge.png")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: WatchData-2.0.4-Visual-Audit
          path: qa/watchdata-204/*.png
          if-no-files-found: error

      - name: Build private shared renderer engine
        working-directory: engine
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD"
          pyinstaller --noconfirm --clean cubical-compare-engine.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = '.\dist\cubical-compare-engine\cubical-compare-engine.exe'
          if (-not (Test-Path $engine)) { throw 'Renderer engine was not produced.' }
          Copy-Item $env:CUBICAL_COMPARE_FFMPEG '.\dist\cubical-compare-engine\ffmpeg.exe' -Force

      - name: Self-test packaged renderer
        shell: pwsh
        run: |
          Remove-Item renderer-self-test -Recurse -Force -ErrorAction SilentlyContinue
          & .\engine\dist\cubical-compare-engine\cubical-compare-engine.exe self-test --directory renderer-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path renderer-self-test\self-test.mp4)) { throw 'Renderer self-test MP4 is missing.' }

      - name: Build completely rebuilt Windows shell
        shell: pwsh
        run: |
          cmake -S . -B build-windows -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-windows --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build-windows\Release\CubicalCompare.exe)) { throw 'CubicalCompare.exe was not produced.' }

      - name: Self-test rebuilt Windows shell against shared renderer
        shell: pwsh
        run: |
          $env:CUBICAL_COMPARE_ENGINE = "$PWD\engine\dist\cubical-compare-engine\cubical-compare-engine.exe"
          & .\build-windows\Release\CubicalCompare.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows final
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "dist\Cubical-Compare-$env:VERSION-Windows-x64"
          New-Item -ItemType Directory -Force -Path "$root\engine" | Out-Null
          Copy-Item build-windows\Release\CubicalCompare.exe "$root\CubicalCompare.exe"
          Copy-Item engine\dist\cubical-compare-engine\* "$root\engine" -Recurse -Force
          Copy-Item FINAL_RELEASE.md "$root\FINAL_RELEASE.md"
          Compress-Archive -Path "$root\*" -DestinationPath "dist\Cubical-Compare-$env:VERSION-Windows-x64.zip" -Force
          $hash = (Get-FileHash "dist\Cubical-Compare-$env:VERSION-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Cubical-Compare-$env:VERSION-Windows-x64.zip" | Out-File "dist\Cubical-Compare-$env:VERSION-Windows-x64.zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-${{ env.VERSION }}-Windows-x64
          path: |
            dist/Cubical-Compare-${{ env.VERSION }}-Windows-x64.zip
            dist/Cubical-Compare-${{ env.VERSION }}-Windows-x64.zip.sha256
          if-no-files-found: error

  android:
    name: Android final
    runs-on: ubuntu-24.04
    env:
      CTS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CTS_ANDROID_KEYSTORE_PASSWORD }}
      CTS_ANDROID_KEY_ALIAS: ${{ secrets.CTS_ANDROID_KEY_ALIAS }}
      CTS_ANDROID_KEY_PASSWORD: ${{ secrets.CTS_ANDROID_KEY_PASSWORD }}
      CTS_EXPECTED_CERT_SHA256: ${{ secrets.CTS_ANDROID_CERT_SHA256 }}
      CTS_ANDROID_KEYSTORE_B64: ${{ secrets.CTS_ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prove Android uses the 2.0.4 desktop renderer
        run: |
          set -euo pipefail
          git diff --exit-code "$RENDERER_BASE" -- engine/ccengine
          diff -qr engine/ccengine android/app/src/main/python/ccengine
          test ! -e android/app/src/main/java/io/github/retrofrost/cts/android/export/ReferenceFrameRenderer.kt
          test ! -e android/app/src/main/java/io/github/retrofrost/cts/android/timeline/TimelineEngine.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate Android Python bridge syntax
        run: |
          python -m py_compile android/app/src/main/python/cts_android_bridge.py
          python -m py_compile android/app/src/main/python/ccengine/watchdata_renderer.py

      - name: Prepare permanent signing when available
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CTS_ANDROID_KEYSTORE_B64 CTS_ANDROID_KEYSTORE_PASSWORD CTS_ANDROID_KEY_ALIAS CTS_ANDROID_KEY_PASSWORD CTS_EXPECTED_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then missing=1; fi
          done
          if [ "$missing" -eq 0 ]; then
            install -d -m 700 "$RUNNER_TEMP/cts-signing"
            printf '%s' "$CTS_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cts-signing/cts-release.keystore"
            chmod 600 "$RUNNER_TEMP/cts-signing/cts-release.keystore"
            echo "CTS_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cts-signing/cts-release.keystore" >> "$GITHUB_ENV"
            echo "CTS_HAS_STABLE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "CTS_HAS_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo 'No private release identity is configured; this hotfix APK will use the installable CI fallback signing identity.'
          fi

      - name: Build completely rebuilt Android app
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Verify bundled WatchData font files
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/python/ccengine/fonts/Poppins-ExtraBold.ttf
          test -s android/app/src/main/python/ccengine/fonts/Poppins-SemiBold.ttf
          test -s android/app/src/main/python/ccengine/fonts/Poppins-Medium.ttf

      - name: Verify Android release signature and identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL"
          if [ "$CTS_HAS_STABLE_SIGNING" = true ]; then
            EXPECTED="$(printf '%s' "$CTS_EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            test "$ACTUAL" = "$EXPECTED"
            SIGNING_KIND="permanent configured release identity"
          else
            SIGNING_KIND="CI fallback identity (installable; private key is not stored in the repository)"
          fi
          mkdir -p dist
          cp "$APK" "dist/Cubical-Compare-$VERSION-Android.apk"
          sha256sum "dist/Cubical-Compare-$VERSION-Android.apk" > "dist/Cubical-Compare-$VERSION-Android.apk.sha256"
          {
            echo "Cubical Compare $VERSION Android signing"
            echo "certificate_sha256=$ACTUAL"
            echo "identity=$SIGNING_KIND"
          } > "dist/Cubical-Compare-$VERSION-Android.signing.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: Cubical-Compare-${{ env.VERSION }}-Android
          path: |
            dist/Cubical-Compare-${{ env.VERSION }}-Android.apk
            dist/Cubical-Compare-${{ env.VERSION }}-Android.apk.sha256
            dist/Cubical-Compare-${{ env.VERSION }}-Android.signing.txt
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/cts-signing"

  publish:
    name: Publish v2.0.4 hotfix
    if: github.ref == 'refs/heads/release/cubical-compare-final'
    needs: [windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: Cubical-Compare-${{ env.VERSION }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable final release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#FILES[@]}" -ge 5
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --target "$GITHUB_SHA" \
              --title "Cubical Compare $VERSION — Final" \
              --notes-file FINAL_RELEASE.md
          fi
