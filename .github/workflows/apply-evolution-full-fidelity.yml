name: Apply Evolution full-fidelity renderer fix

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/apply-evolution-full-fidelity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0

      - name: Apply full-fidelity renderer fixes
        run: python tools/apply_evolution_full_fidelity_fix.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and build release APK
        run: gradle --project-dir android :app:testDebugUnitTest :app:assembleRelease --stacktrace --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cubical-Compare-2.0.7-Evolution-Full-Fidelity
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit renderer engine fixes
        shell: bash
        run: |
          rm .github/workflows/apply-evolution-full-fidelity.yml tools/apply_evolution_full_fidelity_fix.py
          git config user.name 'RetroFrost'
          git config user.email 'routerifter@gmail.com'
          git add android/app/src/main/java/io/github/retrofrost/cts/android/RibbonFrameRenderer.kt .github/workflows/apply-evolution-full-fidelity.yml tools/apply_evolution_full_fidelity_fix.py
          git commit -m 'renderer: correct Evolution frame fidelity'
          git pull --rebase origin fork/2.0.7-renderer-bundles
          git push origin HEAD:fork/2.0.7-renderer-bundles
