name: Fix artwork transform interpolation

on:
  push:
    branches:
      - fork/2.0.7-renderer-bundles
    paths:
      - .github/workflows/fix-transform-interpolation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/2.0.7-renderer-bundles
          fetch-depth: 0
      - name: Fix source
        run: node scripts/fix_transform_interpolation.mjs
      - name: Commit source update
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "RetroFrost CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/MainActivity.kt
          git commit -m "Fix artwork transform labels"
          git push origin HEAD:fork/2.0.7-renderer-bundles
