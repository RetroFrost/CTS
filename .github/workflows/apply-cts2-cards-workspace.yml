name: Integrate CTS 2.0 cards workspace

on:
  push:
    branches: [android]
    paths:
      - ".github/workflows/apply-cts2-cards-workspace.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Android branch
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Replace legacy Cards workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt')
          cards = Path('android/app/src/main/java/io/github/retrofrost/cts/android/ui/CardsWorkspace2.kt')
          text = app.read_text()

          start_marker = '                    WorkspaceSection.Data -> DataWorkspace('
          end_marker = '                    WorkspaceSection.Audio -> AudioWorkspace('
          replacement = '''                    WorkspaceSection.Data -> CardsWorkspace2(
                        project = project,
                        selectedCardId = selectedCardId,
                        onSelectCard = ::selectCard,
                        onProjectChanged = ::applyProject,
                        onUpdateSelectedCard = ::updateSelectedCard,
                        onChooseImage = { imagePicker.launch(arrayOf("image/*")) },
                        onChooseBackground = { backgroundPicker.launch(arrayOf("image/*")) },
                        onImportCardStrip = { cardStripPicker.launch(arrayOf("image/*")) },
                        isImportingCardStrip = isImportingCardStrip,
                        onImportMegaPack = {
                            megaPackPicker.launch(
                                arrayOf("application/zip", "application/x-zip-compressed", "application/octet-stream"),
                            )
                        },
                        isImportingMegaPack = isImportingMegaPack,
                        onInsertData = { showInsertDialog = true },
                    )
'''

          if 'WorkspaceSection.Data -> CardsWorkspace2(' not in text:
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate the current Cards workspace call')
              text = text[:start] + replacement + text[end:]
              app.write_text(text)

          integrated = app.read_text()
          card_ui = cards.read_text()
          assert 'WorkspaceSection.Data -> CardsWorkspace2(' in integrated
          assert 'WorkspaceSection.Data -> DataWorkspace(' not in integrated
          assert 'colors = titleFieldColors2()' in card_ui
          assert 'focusedContainerColor = Color.White' in card_ui
          assert 'focusedTextColor = Color.Black' in card_ui
          assert 'VisualModel.entries.forEach' in card_ui
          assert 'Compact' not in card_ui
          assert 'Gradient Bars' not in card_ui
          PY

          git diff --check
          git diff -- android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify shared contract
        run: python tools/sync_shared_contract.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build CTS 2.0 UI
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:assembleDebug --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-ui.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --project-dir android :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee android/gradle-cts2-tests.log

      - name: Commit tested UI integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/io/github/retrofrost/cts/android/ui/CtsAppV2.kt
          if git diff --cached --quiet; then
            echo "Integration already committed"
          else
            git commit -m "Use focused CTS 2.0 cards workspace"
            git push origin HEAD:android
          fi

      - name: Upload compile logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CTS-2.0-cards-workspace-build-logs
          path: |
            android/gradle-cts2-ui.log
            android/gradle-cts2-tests.log
          if-no-files-found: ignore
