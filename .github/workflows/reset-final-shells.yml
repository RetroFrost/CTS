name: Reset Android app for final rebuild
on:
  push:
    branches: [work/final-cross-platform-rebuild]
    paths: [.github/workflows/reset-final-shells.yml]
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/final-cross-platform-rebuild
      - name: Remove old Android implementation and install shared renderer source
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/java android/app/src/main/res android/app/src/main/python
          mkdir -p android/app/src/main/python
          cp -a engine/ccengine android/app/src/main/python/ccengine
          find android/app/src/main/python -type d -name __pycache__ -prune -exec rm -rf {} + || true
          rm -f .final-rebuild-trigger .github/workflows/import-final-android-scaffold.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove old Android renderer and app implementation"
          git push origin HEAD:work/final-cross-platform-rebuild
